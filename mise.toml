# Used by Mjolnir container sessions and `mj image build`.
# Keep the Rust version aligned with rust-toolchain.toml and CI.
[tools]
# The test-cost coverage scripts use the LLVM tools from this toolchain.
rust = { version = "1.99.1", components = "rustfmt,clippy,llvm-tools-preview" }
node = "24"
python = "3.12"
uv = "0.11.31"
java = "temurin-21.0.8+9.0.LTS"
# The external-fixture provenance job rebuilds its checked-in C# assembly.
dotnet = "8.0.418"
go = "1.26"
# mise uses cargo-binstall to fetch prebuilt Cargo tools when available.
"aqua:cargo-bins/cargo-binstall" = "1.27.0"
# The test-cost scripts use nextest wrapper scripts, available from 0.9.143.
"cargo:cargo-nextest" = "0.9.143"
"cargo:cargo-llvm-cov" = "0.8.7"
"cargo:cargo-machete" = "0.9.2"
"cargo:cargo-hakari" = "0.9.39"

[settings]
# Consume the committed lock without rewriting it, including read-only checkouts.
# Refresh tool versions explicitly with `mise lock` when changing this recipe.
locked = true
idiomatic_version_file_enable_tools = ["rust", "node", "python", "ruby", "go"]

# Native grammar crates build C/C++; SQLite is bundled by Cargo.
# These packages also cover Linux validation scripts and container session tools.
[bootstrap.packages]
"apt:bash" = "*"
"apt:build-essential" = "*"
"apt:ca-certificates" = "*"
"apt:clang" = "*"
"apt:cmake" = "*"
"apt:curl" = "*"
"apt:eatmydata" = "*"
"apt:fd-find" = "*"
"apt:file" = "*"
"apt:gh" = "*"
"apt:git" = "*"
"apt:jq" = "*"
"apt:less" = "*"
"apt:libssl-dev" = "*"
"apt:lsof" = "*"
"apt:openssh-client" = "*"
"apt:patch" = "*"
"apt:pkg-config" = "*"
"apt:procps" = "*"
"apt:python3" = "*"
"apt:python3-dev" = "*"
"apt:python3-venv" = "*"
"apt:ripgrep" = "*"
"apt:rsync" = "*"
"apt:shellcheck" = "*"
"apt:sudo" = "*"
"apt:time" = "*"
"apt:tmux" = "*"
"apt:unzip" = "*"
"apt:zip" = "*"
