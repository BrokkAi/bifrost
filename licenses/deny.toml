[graph]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-gnu",
    "aarch64-linux-android",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]

[licenses]
# Dependencies are denied unless at least one branch of their SPDX expression
# can be satisfied by this reviewed list. Keep reciprocal licenses scoped to
# named exceptions instead of making them globally acceptable.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8
include-build = true
include-dev = false
unused-allowed-license = "allow"
exceptions = [
    # Bifrost's first-party workspace packages are the LGPL-covered work, not
    # generally allowed third-party dependencies.
    { crate = "brokk-bifrost", allow = ["LGPL-3.0-or-later"] },
    { crate = "brokk-bifrost-analysis", allow = ["LGPL-3.0-or-later"] },
    { crate = "brokk-bifrost-core", allow = ["LGPL-3.0-or-later"] },
    { crate = "brokk-bifrost-cpp", allow = ["LGPL-3.0-or-later"] },
    { crate = "brokk-bifrost-csharp", allow = ["LGPL-3.0-or-later"] },
    { crate = "brokk-bifrost-go", allow = ["LGPL-3.0-or-later"] },
    { crate = "brokk-bifrost-js-ts", allow = ["LGPL-3.0-or-later"] },
    { crate = "brokk-bifrost-jvm", allow = ["LGPL-3.0-or-later"] },
    { crate = "brokk-bifrost-php", allow = ["LGPL-3.0-or-later"] },
    { crate = "brokk-bifrost-python", allow = ["LGPL-3.0-or-later"] },
    { crate = "brokk-bifrost-ruby", allow = ["LGPL-3.0-or-later"] },
    { crate = "brokk-bifrost-rust", allow = ["LGPL-3.0-or-later"] },
    { crate = "brokk-bifrost-nlp", allow = ["LGPL-3.0-or-later"] },
    { crate = "brokk-bifrost-policy", allow = ["LGPL-3.0-or-later"] },
    { crate = "brokk-bifrost-semantic-packs", allow = ["LGPL-3.0-or-later"] },
    { crate = "brokk-bifrost-lsp", allow = ["LGPL-3.0-or-later"] },
    { crate = "brokk-bifrost-mcp", allow = ["LGPL-3.0-or-later"] },
    { crate = "brokk-bifrost-runtime", allow = ["LGPL-3.0-or-later"] },
    # Only the optional nlp feature reaches this MPL crate through hf-hub.
    # Any prebuilt nlp artifact must also inform recipients how to obtain the
    # option-ext source, as documented on the public third-party-notices page.
    { crate = "option-ext@0.2.0", allow = ["MPL-2.0"] },
]

[licenses.private]
ignore = false
