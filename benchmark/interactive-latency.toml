warmup_iterations = 2
measured_iterations = 10
output_dir = "interactive-latency-output"
repo_cache_dir = ".cache/repos"
required_languages = ["rust"]
required_scenarios = ["interactive_code_intelligence", "mcp_fairness"]

[[repos]]
name = "bifrost-self"
url = "https://github.com/BrokkAi/bifrost"
commit = "45841f1a9e665a056380eb7c0a1b8485389cb48c"
languages = ["rust"]
extensions = ["rs"]
scenarios = ["interactive_code_intelligence", "mcp_fairness"]

interactive_queries = [
  { id = "search-common-symbols", tool = "search_symbols", arguments_json = '{"patterns":["SemanticProcedureSummary","SearchToolsService","scan_usages_by_reference","search_symbols"],"include_tests":true}', expected_json_pointer = "/structuredContent/files", max_p95_ms = 5000.0 },
  { id = "source-semantic-summary", tool = "get_symbol_sources", arguments_json = '{"symbols":["src/analyzer/dataflow/reusable_summary.rs#SemanticProcedureSummary"]}', expected_json_pointer = "/structuredContent/sources/0/path", expected_json_value = "src/analyzer/dataflow/reusable_summary.rs", max_p95_ms = 5000.0 },
  { id = "source-search-service", tool = "get_symbol_sources", arguments_json = '{"symbols":["src/searchtools_service.rs#SearchToolsService"]}', expected_json_pointer = "/structuredContent/sources/0/path", expected_json_value = "src/searchtools_service.rs", max_p95_ms = 5000.0 },
  { id = "source-usage-scan", tool = "get_symbol_sources", arguments_json = '{"symbols":["src/searchtools/scan_usages.rs#scan_usages_by_reference"]}', expected_json_pointer = "/structuredContent/sources/0/path", expected_json_value = "src/searchtools/scan_usages.rs", max_p95_ms = 5000.0 },
  { id = "source-symbol-search", tool = "get_symbol_sources", arguments_json = '{"symbols":["src/searchtools/navigation.rs#search_symbols"]}', expected_json_pointer = "/structuredContent/sources/0/path", expected_json_value = "src/searchtools/navigation.rs", max_p95_ms = 5000.0 },
  { id = "definition-by-location", tool = "get_definitions_by_location", arguments_json = '{"references":[{"path":"src/searchtools_service.rs","line":789,"column":21}]}', expected_json_pointer = "/structuredContent/results/0/definitions/0/path", expected_json_value = "src/searchtools/navigation.rs", max_p95_ms = 5000.0 },
  { id = "summary-semantic-procedure", tool = "get_summaries", arguments_json = '{"targets":["src/analyzer/dataflow/reusable_summary.rs#SemanticProcedureSummary"]}', expected_json_pointer = "/structuredContent/summaries", max_p95_ms = 5000.0 },
  { id = "scan-semantic-procedure-exact", tool = "scan_usages_by_location", arguments_json = '{"targets":[{"path":"src/analyzer/dataflow/reusable_summary.rs","line":911,"symbol":"SemanticProcedureSummary"}],"include_tests":true,"include_same_owner":true}', expected_json_pointer = "/structuredContent/results/0/definition_path", expected_json_value = "src/analyzer/dataflow/reusable_summary.rs", allow_bounded_incomplete = true, max_p95_ms = 5000.0 },
  { id = "scan-semantic-procedure-line", tool = "scan_usages_by_location", arguments_json = '{"targets":[{"path":"src/analyzer/dataflow/reusable_summary.rs","line":911}],"include_tests":true,"include_same_owner":true}', expected_json_pointer = "/structuredContent/results/0/definition_path", expected_json_value = "src/analyzer/dataflow/reusable_summary.rs", allow_bounded_incomplete = true, max_p95_ms = 5000.0 },
]

mcp_fairness = { id = "heavy-scan-does-not-block-source", scan_arguments_json = '{"targets":[{"path":"src/analyzer/dataflow/reusable_summary.rs","line":911,"symbol":"SemanticProcedureSummary"},{"path":"src/searchtools_service.rs","line":191,"symbol":"SearchToolsService"},{"path":"src/searchtools/navigation.rs","line":282,"symbol":"search_symbols"},{"path":"src/searchtools/scan_usages.rs","line":1296,"symbol":"scan_usages_by_reference"}],"include_tests":true,"include_same_owner":true}', source_arguments_json = '{"symbols":["src/analyzer/dataflow/reusable_summary.rs#SemanticProcedureSummary"]}', expected_source_path = "src/analyzer/dataflow/reusable_summary.rs", max_p95_ms = 5000.0 }
