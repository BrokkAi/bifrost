warmup_iterations = 2
measured_iterations = 20
output_dir = "interactive-latency-output"
repo_cache_dir = ".cache/repos"
required_languages = ["rust"]
required_scenarios = ["interactive_code_intelligence", "mcp_fairness"]

[[repos]]
name = "bifrost-self"
# The public BrokkAi/bifrost history is regenerated by the open-core projector:
# it holds squashed snapshot commits, and a projection run can replace commits
# that earlier snapshots published. Pin only a commit that a released tag makes
# reachable, otherwise the pin dangles as soon as history is regenerated.
# This pin is v0.10.1.
#
# Every path, line, and column below is derived from this pinned tree. The
# location cases select structured declaration name ranges (issue #607), so a
# line that no longer holds a declaration name is not a target and the case
# fails as a correctness failure, not a latency one. When the pin moves,
# re-derive each coordinate from the new tree; do not carry the old ones over.
# The v0.10.1 snapshot moved the sources from `src/**` into `crates/*/src/**`,
# which is why every path here is crate-qualified.
url = "https://github.com/BrokkAi/bifrost"
commit = "511adaa2733067bb1b7809ab79e06ec0e3d2a146"
languages = ["rust"]
extensions = ["rs"]
scenarios = ["interactive_code_intelligence", "mcp_fairness"]

interactive_queries = [
  { id = "search-common-symbols", tool = "search_symbols", arguments_json = '{"patterns":["solve_typestate.*summary","solve_taint.*summary","ProtocolSemanticSummarySet","TaintSemanticSummarySet"],"include_tests":true,"limit":100}', expected_json_pointer = "/structuredContent/files", max_p95_ms = 5000.0 },
  { id = "source-semantic-summary", tool = "get_symbol_sources", arguments_json = '{"symbols":["crates/bifrost-analysis/src/analyzer/dataflow/reusable_summary.rs#SemanticProcedureSummary"]}', expected_json_pointer = "/structuredContent/sources/0/path", expected_json_value = "crates/bifrost-analysis/src/analyzer/dataflow/reusable_summary.rs", max_p95_ms = 5000.0 },
  { id = "source-search-service", tool = "get_symbol_sources", arguments_json = '{"symbols":["crates/bifrost-mcp/src/searchtools_service.rs#SearchToolsService"]}', expected_json_pointer = "/structuredContent/sources/0/path", expected_json_value = "crates/bifrost-mcp/src/searchtools_service.rs", max_p95_ms = 5000.0 },
  { id = "source-usage-scan", tool = "get_symbol_sources", arguments_json = '{"symbols":["crates/bifrost-analysis/src/searchtools/scan_usages.rs#scan_usages_by_reference"]}', expected_json_pointer = "/structuredContent/sources/0/path", expected_json_value = "crates/bifrost-analysis/src/searchtools/scan_usages.rs", max_p95_ms = 5000.0 },
  { id = "source-symbol-search", tool = "get_symbol_sources", arguments_json = '{"symbols":["crates/bifrost-analysis/src/searchtools/navigation.rs#search_symbols"]}', expected_json_pointer = "/structuredContent/sources/0/path", expected_json_value = "crates/bifrost-analysis/src/searchtools/navigation.rs", max_p95_ms = 5000.0 },
  { id = "definition-by-location", tool = "get_definitions_by_location", arguments_json = '{"references":[{"path":"crates/bifrost-mcp/src/searchtools_service.rs","line":1722,"column":21}]}', expected_json_pointer = "/structuredContent/results/0/definitions/0/path", expected_json_value = "crates/bifrost-analysis/src/searchtools/navigation.rs", max_p95_ms = 5000.0 },
  { id = "summary-semantic-procedure", tool = "get_summaries", arguments_json = '{"targets":["crates/bifrost-analysis/src/analyzer/dataflow/reusable_summary.rs#SemanticProcedureSummary"]}', expected_json_pointer = "/structuredContent/summaries", max_p95_ms = 5000.0 },
  { id = "scan-semantic-procedure-exact", tool = "scan_usages_by_location", arguments_json = '{"targets":[{"path":"crates/bifrost-analysis/src/analyzer/dataflow/reusable_summary.rs","line":1037,"symbol":"SemanticProcedureSummary"}],"include_tests":true,"include_same_owner":true}', expected_json_pointer = "/structuredContent/results/0/definition_path", expected_json_value = "crates/bifrost-analysis/src/analyzer/dataflow/reusable_summary.rs", allow_bounded_incomplete = true, max_p95_ms = 5000.0 },
  { id = "scan-semantic-procedure-line", tool = "scan_usages_by_location", arguments_json = '{"targets":[{"path":"crates/bifrost-analysis/src/analyzer/dataflow/reusable_summary.rs","line":1037}],"include_tests":true,"include_same_owner":true}', expected_json_pointer = "/structuredContent/results/0/definition_path", expected_json_value = "crates/bifrost-analysis/src/analyzer/dataflow/reusable_summary.rs", allow_bounded_incomplete = true, max_p95_ms = 5000.0 },
]

mcp_fairness = { id = "heavy-scan-does-not-block-source", scan_arguments_json = '{"targets":[{"path":"crates/bifrost-analysis/src/analyzer/dataflow/reusable_summary.rs","line":1037,"symbol":"SemanticProcedureSummary"},{"path":"crates/bifrost-mcp/src/searchtools_service.rs","line":897,"symbol":"SearchToolsService"},{"path":"crates/bifrost-analysis/src/searchtools/navigation.rs","line":341,"symbol":"search_symbols"},{"path":"crates/bifrost-analysis/src/searchtools/scan_usages.rs","line":1875,"symbol":"scan_usages_by_reference"}],"include_tests":true,"include_same_owner":true}', source_arguments_json = '{"symbols":["crates/bifrost-analysis/src/analyzer/dataflow/reusable_summary.rs#SemanticProcedureSummary"]}', expected_source_path = "crates/bifrost-analysis/src/analyzer/dataflow/reusable_summary.rs", max_p95_ms = 5000.0 }
