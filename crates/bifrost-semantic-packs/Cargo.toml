[package]
name = "brokk-bifrost-semantic-packs"
version.workspace = true
edition.workspace = true
description = "Optional prebuilt semantic-pack distribution for brokk-bifrost"
readme = "README.md"
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = true
autobins = false
# The JDK source slices under testdata/summary-sources are GPL-2.0 WITH
# Classpath-exception-2.0. They are derivation test fixtures and are never
# distributed with this crate.
exclude = ["tests/**", "testdata/summary-sources/**"]

[lib]
name = "brokk_bifrost_semantic_packs"

[features]
default = []
release-tooling = [
    "dep:brokk-bifrost-tools",
    "dep:brokk-bifrost-policy",
    "dep:brokk-bifrost-rql",
    "dep:semver",
    "dep:serde",
    "dep:serde_json",
    "dep:serde-saphyr",
    "dep:sha2",
    "dep:tempfile",
    "dep:flate2",
    "dep:tar",
]
download = [
    "dep:semver",
    "dep:serde",
    "dep:serde_json",
    "dep:serde-saphyr",
    "dep:sha2",
    "dep:tempfile",
    "dep:flate2",
    "dep:tar",
    "dep:zip",
    "dep:ureq",
]

[[bin]]
name = "bifrost-semantic-pack"
path = "src/bin/bifrost-semantic-pack.rs"
required-features = ["release-tooling"]

[dependencies]
brokk-bifrost-policy = { path = "../bifrost-policy", version = "=0.14.4", optional = true }
brokk-bifrost-rql = { path = "../bifrost-rql", version = "=0.14.4", optional = true }
brokk-bifrost-jvm-analysis = { path = "../bifrost-jvm-analysis", version = "=0.14.4" }
brokk-bifrost-rust-analysis = { path = "../bifrost-rust-analysis", version = "=0.14.4" }
brokk-bifrost-go-analysis = { path = "../bifrost-go-analysis", version = "=0.14.4" }
brokk-bifrost-php-analysis = { path = "../bifrost-php-analysis", version = "=0.14.4" }
brokk-bifrost-python-analysis = { path = "../bifrost-python-analysis", version = "=0.14.4" }
brokk-bifrost-ruby-analysis = { path = "../bifrost-ruby-analysis", version = "=0.14.4" }
brokk-bifrost-csharp-analysis = { path = "../bifrost-csharp-analysis", version = "=0.14.4" }
brokk-bifrost-js-ts-analysis = { path = "../bifrost-js-ts-analysis", version = "=0.14.4" }
brokk-bifrost-analysis = { path = "../bifrost-analysis", version = "=0.14.4" }
brokk-bifrost-flow = { path = "../bifrost-flow", version = "=0.14.4" }
# The bifrost-semantic-pack binary links the complete language table, which
# only brokk-bifrost-tools defines.
brokk-bifrost-tools = { path = "../bifrost-tools", version = "=0.14.4", optional = true }
semver = { version = "1.0.28", optional = true }
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = { version = "1.0.145", optional = true }
serde-saphyr = { version = "0.0.29", default-features = false, features = [
    "deserialize",
], optional = true }
sha2 = { version = "0.10.8", optional = true }
tempfile = { version = "3.23.0", optional = true }
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"], optional = true }
tar = { version = "0.4.44", default-features = false, optional = true }
ureq = { version = "3.4.0", default-features = false, features = ["rustls"], optional = true }
zip = { version = "9.0.3", default-features = false, features = ["deflate-flate2", "deflate-zopfli"], optional = true }
workspace-hack.workspace = true

[dev-dependencies]
brokk-bifrost-jvm-analysis = { path = "../bifrost-jvm-analysis", version = "=0.14.4", features = ["test-support"] }
brokk-bifrost-python-analysis = { path = "../bifrost-python-analysis", version = "=0.14.4", features = ["test-support"] }
brokk-bifrost-js-ts-analysis = { path = "../bifrost-js-ts-analysis", version = "=0.14.4", features = ["test-support"] }

brokk-bifrost-tools = { path = "../bifrost-tools", version = "=0.14.4", features = ["test-support"] }
brokk-bifrost-test-macros = { path = "../bifrost-test-macros" }
brokk-bifrost-analysis = { path = "../bifrost-analysis", version = "=0.14.4", features = ["test-support"] }
jsonschema = { version = "0.48.0", default-features = false }
tempfile = "3.23.0"
zip = { version = "9.0.3", default-features = false, features = ["deflate-flate2", "deflate-zopfli"] }

[lints]
workspace = true
