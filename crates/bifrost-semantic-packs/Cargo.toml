[package]
name = "brokk-bifrost-semantic-packs"
version.workspace = true
edition.workspace = true
description = "Optional prebuilt semantic-pack distribution for brokk-bifrost"
readme = "README.md"
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = true
autobins = false
# The JDK source slices under testdata/summary-sources are GPL-2.0 WITH
# Classpath-exception-2.0. They are derivation test fixtures and are never
# distributed with this crate.
exclude = ["tests/**", "testdata/summary-sources/**"]

[lib]
name = "brokk_bifrost_semantic_packs"

[features]
default = []
release-tooling = [
    "dep:semver",
    "dep:serde",
    "dep:serde_json",
    "dep:serde-saphyr",
    "dep:sha2",
    "dep:tempfile",
]

[[bin]]
name = "bifrost-semantic-pack"
path = "src/bin/bifrost-semantic-pack.rs"
required-features = ["release-tooling"]

[dependencies]
brokk-bifrost-analysis = { path = "../bifrost-analysis", version = "=0.10.5" }
semver = { version = "1.0.28", optional = true }
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = { version = "1.0.145", optional = true }
serde-saphyr = { version = "0.0.29", default-features = false, features = [
    "deserialize",
], optional = true }
sha2 = { version = "0.10.8", optional = true }
tempfile = { version = "3.23.0", optional = true }

[dev-dependencies]
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4.44", default-features = false }
