[package]
name = "brokk-bifrost-semantic"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish = true
exclude = ["tests/**"]
rust-version.workspace = true
description = "Shared semantic vocabulary, algorithms, and semantic-model contracts for brokk-bifrost"
readme = "README.md"

[lib]
name = "brokk_bifrost_semantic"

[lints]
workspace = true

[features]
default = []
randomized-hash = ["brokk-bifrost-core/randomized-hash"]
test-support = ["brokk-bifrost-core/test-support"]

[dependencies]
brokk-bifrost-core = { path = "../bifrost-core", version = "=0.14.4" }
brokk-bifrost-cpp = { path = "../bifrost-cpp", version = "=0.14.4" }
brokk-bifrost-csharp = { path = "../bifrost-csharp", version = "=0.14.4" }
brokk-bifrost-go = { path = "../bifrost-go", version = "=0.14.4" }
brokk-bifrost-js-ts = { path = "../bifrost-js-ts", version = "=0.14.4" }
brokk-bifrost-jvm = { path = "../bifrost-jvm", version = "=0.14.4" }
brokk-bifrost-php = { path = "../bifrost-php", version = "=0.14.4" }
brokk-bifrost-python = { path = "../bifrost-python", version = "=0.14.4" }
brokk-bifrost-ruby = { path = "../bifrost-ruby", version = "=0.14.4" }
brokk-bifrost-rust = { path = "../bifrost-rust", version = "=0.14.4" }
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
git2 = { version = "0.20.2", default-features = false }
moka = { version = "0.12.11", features = ["sync"] }
rusqlite = { version = "0.40.2", default-features = false, features = [
"bundled",
"cache",
"fallible_uint",
"trace",
"hooks",
"functions",
] }
schemars = "1.2.1"
semver = "1.0.28"
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.145"
serde-saphyr = { version = "0.0.29", default-features = false, features = ["deserialize"] }
spdx = "0.13.4"
sha2 = "0.10.8"
tempfile = "3.23.0"
url = { version = "2.5.8", default-features = false, features = ["std"] }
tree-sitter = "0.25.10"
jsonschema = { version = "0.48.0", default-features = false }
serde_json_canonicalizer = "0.3.2"
workspace-hack.workspace = true

[dev-dependencies]
brokk-bifrost-test-macros = { path = "../bifrost-test-macros" }
brokk-bifrost-core = { path = "../bifrost-core", version = "=0.14.4", features = ["test-support"] }
brokk-bifrost-cpp = { path = "../bifrost-cpp", version = "=0.14.4", features = ["test-support"] }
brokk-bifrost-go = { path = "../bifrost-go", version = "=0.14.4", features = ["test-support"] }
brokk-bifrost-js-ts = { path = "../bifrost-js-ts", version = "=0.14.4", features = ["test-support"] }
brokk-bifrost-jvm = { path = "../bifrost-jvm", version = "=0.14.4", features = ["test-support"] }
brokk-bifrost-python = { path = "../bifrost-python", version = "=0.14.4", features = ["test-support"] }
brokk-bifrost-rust = { path = "../bifrost-rust", version = "=0.14.4", features = ["test-support"] }
