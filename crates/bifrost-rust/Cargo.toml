[package]
name = "brokk-bifrost-rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Rust language knowledge for brokk-bifrost: cargo routes, declarations, hierarchy, lexical scope, and usage-graph resolution"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
publish = true

[lib]
name = "brokk_bifrost_rust"

[dependencies]
brokk-bifrost-core = { path = "../bifrost-core", version = "=0.8.24" }
glob = "0.3.3"
moka = { version = "0.12.11", features = ["sync"] }
rayon = "1.10.0"
regex = "1.12.2"
semver = "1.0.28"
toml = "0.8.23"
tree-sitter = "0.25.10"
tree-sitter-rust = "0.24.0"

[features]
default = []
# Mirrors `brokk-bifrost-analysis`'s feature of the same name. The tree-parse
# counters in `lexical_scope` are the complexity signal the issue #1219
# regression tests assert on, and a `cfg(test)` item is invisible across a
# crate boundary, so dependents reach them under this gate instead of through
# permanent public API.
test-support = []

[dev-dependencies]
brokk-bifrost-core = { path = "../bifrost-core", version = "=0.8.24", features = ["test-support"] }
# crate_naming's mtime-invalidation test stamps manifest timestamps directly.
filetime = "0.2"
tempfile = "3.23.0"
