[package]
name = "brokk-bifrost-rust"
version.workspace = true
edition.workspace = true
description = "Rust language knowledge for brokk-bifrost: cargo routes, declarations, hierarchy, lexical scope, and usage-graph resolution"
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = true

[lib]
name = "brokk_bifrost_rust"

[dependencies]
brokk-bifrost-core = { path = "../bifrost-core", version = "=0.8.22" }
glob = "0.3.3"
moka = { version = "0.12.11", features = ["sync"] }
rayon = "1.10.0"
regex = "1.12.2"
semver = "1.0.28"
toml = "0.8.23"
tree-sitter = "0.25.10"
tree-sitter-rust = "0.24.0"

[dev-dependencies]
brokk-bifrost-core = { path = "../bifrost-core", version = "=0.8.22", features = ["test-support"] }
tempfile = "3.23.0"
