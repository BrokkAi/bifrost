[package]
name = "brokk-bifrost-store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish = true
rust-version.workspace = true
description = "SQLite-backed analyzer store and resolution support for brokk-bifrost"

[lib]
name = "brokk_bifrost_store"

[lints]
workspace = true

[features]
default = []
test-support = ["dep:regex", "dep:syn", "brokk-bifrost-core/test-support", "brokk-bifrost-jvm/test-support"]
randomized-hash = ["brokk-bifrost-core/randomized-hash"]

[dependencies]
regex = { version = "1", optional = true }
syn = { version = "2", features = ["extra-traits", "full", "visit"], optional = true }
brokk-bifrost-semantic = { path = "../bifrost-semantic", version = "=0.14.3" }
brokk-bifrost-core = { path = "../bifrost-core", version = "=0.14.3" }
brokk-bifrost-cpp = { path = "../bifrost-cpp", version = "=0.14.3" }
brokk-bifrost-csharp = { path = "../bifrost-csharp", version = "=0.14.3" }
brokk-bifrost-go = { path = "../bifrost-go", version = "=0.14.3" }
brokk-bifrost-js-ts = { path = "../bifrost-js-ts", version = "=0.14.3" }
brokk-bifrost-jvm = { path = "../bifrost-jvm", version = "=0.14.3" }
brokk-bifrost-php = { path = "../bifrost-php", version = "=0.14.3" }
brokk-bifrost-python = { path = "../bifrost-python", version = "=0.14.3" }
brokk-bifrost-ruby = { path = "../bifrost-ruby", version = "=0.14.3" }
brokk-bifrost-rust = { path = "../bifrost-rust", version = "=0.14.3" }
bincode = "1.3.3"
growable-bloom-filter = "2.1"
git2 = { version = "0.20.2", default-features = false }
moka = { version = "0.12.11", features = ["sync"] }
rayon = "1.10.0"
rusqlite = { version = "0.40.2", default-features = false, features = [
    "bundled",
    "cache",
    "fallible_uint",
    "trace",
    "hooks",
    "limits",
    "functions",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.8"
toml = "0.8.23"
tempfile = "3.23.0"
uuid = { version = "1.23.0", features = ["v4"] }
url = { version = "2.5.8", default-features = false, features = ["std"] }
tree-sitter = "0.25.10"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = { package = "brokk-tree-sitter-javascript", version = "=0.25.3" }
tree-sitter-python = "0.25.0"
tree-sitter-c-sharp = { package = "brokk-tree-sitter-c-sharp", version = "=0.23.8" }
tree-sitter-cpp = { package = "brokk-tree-sitter-cpp", version = "=0.24.8" }
tree-sitter-java = "0.23.5"
tree-sitter-php = { package = "brokk-tree-sitter-php", version = "=0.24.4" }
tree-sitter-rust = { package = "brokk-tree-sitter-rust", version = "=0.24.7" }
# Brokk's fork carries TypeScript declaration-grammar repairs that are not yet
# available in an upstream release (#3502).
tree-sitter-typescript = { package = "brokk-tree-sitter-typescript", version = "=0.23.7" }
walkdir = "2.5.0"
quick-xml = "0.40"
workspace-hack.workspace = true

[dev-dependencies]
regex = "1"
brokk-bifrost-rust = { path = "../bifrost-rust", version = "=0.14.3", features = ["test-support"] }
brokk-bifrost-jvm = { path = "../bifrost-jvm", version = "=0.14.3", features = ["test-support"] }
syn = { version = "2", features = ["extra-traits", "full", "visit"] }
brokk-bifrost-core = { path = "../bifrost-core", version = "=0.14.3", features = ["test-support"] }
brokk-bifrost-test-macros = { path = "../bifrost-test-macros" }
proptest = "1.11"
