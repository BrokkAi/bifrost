[package]
name = "brokk-bifrost-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Foundation model, project, and workspace utilities shared by every brokk-bifrost crate"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
publish = true
exclude = ["tests/**"]

[lib]
name = "brokk_bifrost_core"

[dependencies]
bincode = "1.3.3"
ctor = { version = "1.0.13", default-features = false, features = [
    "proc_macro",
    "std",
], optional = true }
git2 = { version = "0.20.2", default-features = false }
growable-bloom-filter = "2.1"
ignore = "0.4.24"
moka = { version = "0.12.11", features = ["sync"] }
once_cell = "1.21.3"
rayon = "1.10.0"
# `backup` carries a cache store forward across schema versions: it copies a
# live source through SQLite rather than the filesystem, so committed pages
# sitting in the source's `-wal` sidecar come along (issue #1589).
rusqlite = { version = "0.40.2", default-features = false, features = [
    "backup",
    "bundled",
    "cache",
    "fallible_uint",
    "functions",
    "hooks",
    "trace",
] }
rustc-hash = "2"
same-file = "1.0.6"
# The MCP `get_active_workspace` output schema is derived from the result
# struct, whose `session_subset` field is this crate's `SubsetCoverage` (#2770).
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
# `canonical_hash` is the workspace's single content-addressing primitive; sha2
# already reaches the dependency graph through analysis, MCP, and policy, so
# this adds a manifest line rather than a new third party.
sha2 = "0.11"
smallvec = "1"
tempfile = "3.23.0"
tree-sitter = "0.25.10"
workspace-hack.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
brokk-bifrost-test-macros = { path = "../bifrost-test-macros" }
ctor = { version = "1.0.13", default-features = false, features = [
    "proc_macro",
    "std",
] }
# Generative property tests for the construction-point invariants (FqName
# round-trips, line tables, workspace-relative paths). See issue #1189 for the
# model assertion these generators feed.
proptest = "1.11"

[features]
default = []
# CI-only mode that exposes accidental dependence on hash iteration order.
randomized-hash = []
# Mirrors `brokk-bifrost-analysis`'s feature of the same name: the analysis
# crate's `test-support` turns this on so the cancellation hooks stay a single
# implementation rather than a copy on each side of the seam.
test-support = ["dep:ctor"]

[lints]
workspace = true
