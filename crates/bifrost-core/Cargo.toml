[package]
name = "brokk-bifrost-core"
version.workspace = true
edition.workspace = true
description = "Foundation model, project, and workspace utilities shared by every brokk-bifrost crate"
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = true

[lib]
name = "brokk_bifrost_core"

[dependencies]
bincode = "1.3.3"
git2 = { version = "0.20.2", default-features = false }
growable-bloom-filter = "2.1"
ignore = "0.4.24"
once_cell = "1.21.3"
rayon = "1.10.0"
rusqlite = { version = "0.32.1", features = ["bundled"] }
rustc-hash = "2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
smallvec = "1"
tempfile = "3.23.0"
tree-sitter = "0.25.10"
walkdir = "2.5.0"

[features]
default = []
# Mirrors `brokk-bifrost-analysis`'s feature of the same name: the analysis
# crate's `test-support` turns this on so the cancellation hooks stay a single
# implementation rather than a copy on each side of the seam.
test-support = []

[dev-dependencies]
rusqlite_migration = "=1.3.1"
