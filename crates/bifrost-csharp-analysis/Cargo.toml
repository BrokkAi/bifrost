[package]
name = "brokk-bifrost-csharp-analysis"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "C# analyzer and receiver-aware usage resolution for brokk-bifrost"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish = true
exclude = ["tests/**"]
readme = "README.md"

[lib]
name = "brokk_bifrost_csharp_analysis"

[lints]
workspace = true

[dependencies]
brokk-bifrost-analysis = { path = "../bifrost-analysis", version = "=0.15.2" }
brokk-bifrost-semantic = { path = "../bifrost-semantic", version = "=0.15.2" }
brokk-bifrost-core = { path = "../bifrost-core", version = "=0.15.2" }
brokk-bifrost-csharp = { path = "../bifrost-csharp", version = "=0.15.2" }
goblin = "0.10.7"
git2 = { version = "0.20.2", default-features = false }
moka = { version = "0.12.11", features = ["sync"] }
rayon = "1.10.0"
rusqlite = { version = "0.40.2", default-features = false }
semver = "1.0.28"
serde_json = "1.0.145"
sha2 = "0.11"
sha1 = "0.10.6"
tempfile = "3.23.0"
tree-sitter = "0.25.10"
tree-sitter-c-sharp = { package = "brokk-tree-sitter-c-sharp", version = "=0.23.9" }
walkdir = "2.5.0"
quick-xml = "0.40"
workspace-hack.workspace = true

[dev-dependencies]
brokk-bifrost-analysis = { path = "../bifrost-analysis", version = "=0.15.2", features = ["test-support"] }
brokk-bifrost-test-macros = { path = "../bifrost-test-macros" }
brokk-bifrost-core = { path = "../bifrost-core", version = "=0.15.2", features = ["test-support"] }

[features]
default = []
test-support = ["brokk-bifrost-analysis/test-support"]
randomized-hash = ["brokk-bifrost-analysis/randomized-hash"]
