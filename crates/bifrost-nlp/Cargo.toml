[package]
name = "brokk-bifrost-nlp"
version.workspace = true
edition.workspace = true
description = "Semantic code search (embeddings + BM25 + git co-edit relevance) for brokk-bifrost"
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = true

[lib]
name = "brokk_bifrost_nlp"

# This crate *is* the `nlp` feature. Hosts opt in by depending on it (the facade
# and bifrost-mcp gate it behind their own `nlp` feature). The runtime stack stays
# unconditional, so enabling semantic search never changes the analysis crate's
# fingerprint. The one gated item is the `tokenizers` re-export (see below); it
# backs only a diagnostic binary, so featureless workspace builds skip its ~6.5s
# compile.
[features]
# The `tokenizers` crate is used only by the `embed_seq_probe` sequence-length
# diagnostic (through the `pub use tokenizers` re-export in lib.rs). Gate it so a
# featureless `cargo build --workspace` does not compile it. The facade's `nlp`
# feature turns it on for hosts that build the probe.
tokenizers = ["dep:tokenizers"]

[dependencies]
brokk-bifrost-analysis = { path = "../bifrost-analysis", version = "=0.8.22" }
fastrq = "0.2.0"
git2 = { version = "0.20.2", default-features = false }
growable-bloom-filter = "2.1"
hf-hub = { version = "0.4", default-features = false, features = ["ureq"] }
rayon = "1.10.0"
regex = "1.12.2"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.8"
tokenizers = { version = "0.21", optional = true }

# Unix: process-group kill for the embedding sidecar.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
brokk-bifrost-analysis = { path = "../bifrost-analysis", version = "=0.8.22", features = ["test-support"] }
tempfile = "3.23.0"
