[package]
name = "brokk-bifrost-policy"
version.workspace = true
edition.workspace = true
description = "Versioned static-analysis policy authoring, loading, evaluation, and reporting for brokk-bifrost"
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = true
# Product rule sources are repository regression fixtures, not engine payloads.
exclude = ["policy-packs/**"]

[lib]
name = "brokk_bifrost_policy"

[features]
default = []
test-support = ["brokk-bifrost-analysis/test-support"]

[dependencies]
brokk-bifrost-rust-analysis = { path = "../bifrost-rust-analysis", version = "=0.14.4" }
brokk-bifrost-tools = { path = "../bifrost-tools", version = "=0.14.4" }
brokk-bifrost-analysis = { path = "../bifrost-analysis", version = "=0.14.4" }
brokk-bifrost-flow = { path = "../bifrost-flow", version = "=0.14.4" }
brokk-bifrost-rql = { path = "../bifrost-rql", version = "=0.14.4" }
cap-std = { version = "4.0.2", default-features = false }
chrono = { version = "0.4.44", default-features = false, features = ["clock", "std"] }
cvss = { version = "2.2.0", default-features = false, features = ["std", "v3", "v4"] }
# The built-in policy pack manifest is the `list_policies` MCP result, and that
# tool advertises a generated JSON Schema `outputSchema`.
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_json_canonicalizer = "0.3.2"
sha2 = "0.10.8"
tree-sitter = "0.25.10"
url = { version = "2.5.8", default-features = false, features = ["std"] }
workspace-hack.workspace = true

[dev-dependencies]
brokk-bifrost-jvm-analysis = { path = "../bifrost-jvm-analysis", version = "=0.14.4", features = ["test-support"] }
brokk-bifrost-cpp-analysis = { path = "../bifrost-cpp-analysis", version = "=0.14.4", features = ["test-support"] }
brokk-bifrost-python-analysis = { path = "../bifrost-python-analysis", version = "=0.14.4" }
brokk-bifrost-js-ts-analysis = { path = "../bifrost-js-ts-analysis", version = "=0.14.4", features = ["test-support"] }

brokk-bifrost-test-macros = { path = "../bifrost-test-macros" }
brokk-bifrost-analysis = { path = "../bifrost-analysis", version = "=0.14.4", features = ["test-support"] }
tempfile = "3.23.0"

# Unix: the RQLP directory loader's symlink/permission tests inspect raw modes.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[lints]
workspace = true
