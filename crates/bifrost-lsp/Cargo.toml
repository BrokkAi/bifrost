[package]
name = "brokk-bifrost-lsp"
version.workspace = true
edition.workspace = true
description = "Internal LSP host implementation for brokk-bifrost"
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = true
exclude = ["src/bin/bifrost-lsp-test-server.rs", "tests/**"]

[lib]
name = "brokk_bifrost_lsp"

[dependencies]
brokk-bifrost-analysis = { path = "../bifrost-analysis", version = "=0.8.22" }
brokk-bifrost-policy = { path = "../bifrost-policy", version = "=0.8.22" }
brokk-bifrost-runtime = { path = "../bifrost-runtime", version = "=0.8.22" }
glob = "0.3.3"
lsp-server = "0.7"
lsp-types = "0.97"
regex = "1.12.2"
semver = "1.0.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tree-sitter = "0.25.10"
tree-sitter-python = "0.25.0"
toml = "0.8.23"

[dev-dependencies]
tempfile = "3.23.0"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
