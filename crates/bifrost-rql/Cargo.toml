[package]
name = "brokk-bifrost-rql"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Analyzer-independent RQL syntax, schema, typed IR, and validation for brokk-bifrost"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
publish = true

[lib]
name = "brokk_bifrost_rql"

[dependencies]
brokk-bifrost-core = { path = "../bifrost-core", version = "=0.10.4" }
glob = "0.3.3"
json-spanned-value = "0.2.2"
regex = "1.12.2"
regex-syntax = "0.8"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
strsim = "0.11.1"
