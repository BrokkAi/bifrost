[package]
name = "brokk-bifrost-rql"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "RQL syntax, typed IR, planning, and execution for brokk-bifrost"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
publish = true

[features]
default = []
test-support = ["brokk-bifrost-jvm-analysis/test-support", "brokk-bifrost-analysis/test-support"]
query-result-fixtures = []

[lib]
name = "brokk_bifrost_rql"

[[bin]]
name = "query_result_fixtures"
required-features = ["query-result-fixtures"]

[dependencies]
git2 = { version = "0.20.2", default-features = false }
brokk-bifrost-jvm-analysis = { path = "../bifrost-jvm-analysis", version = "=0.14.4" }
brokk-bifrost-rust-analysis = { path = "../bifrost-rust-analysis", version = "=0.14.4" }
brokk-bifrost-go-analysis = { path = "../bifrost-go-analysis", version = "=0.14.4" }
brokk-bifrost-php-analysis = { path = "../bifrost-php-analysis", version = "=0.14.4" }
brokk-bifrost-cpp-analysis = { path = "../bifrost-cpp-analysis", version = "=0.14.4" }
brokk-bifrost-python-analysis = { path = "../bifrost-python-analysis", version = "=0.14.4" }
brokk-bifrost-ruby-analysis = { path = "../bifrost-ruby-analysis", version = "=0.14.4" }
brokk-bifrost-csharp-analysis = { path = "../bifrost-csharp-analysis", version = "=0.14.4" }
brokk-bifrost-js-ts-analysis = { path = "../bifrost-js-ts-analysis", version = "=0.14.4" }
brokk-bifrost-tools = { path = "../bifrost-tools", version = "=0.14.4" }
semver = "1.0.28"
brokk-bifrost-analysis = { path = "../bifrost-analysis", version = "=0.14.4" }
brokk-bifrost-cpp = { path = "../bifrost-cpp", version = "=0.14.4" }
brokk-bifrost-core = { path = "../bifrost-core", version = "=0.14.4" }
brokk-bifrost-python = { path = "../bifrost-python", version = "=0.14.4" }
brokk-bifrost-js-ts = { path = "../bifrost-js-ts", version = "=0.14.4" }
brokk-bifrost-flow = { path = "../bifrost-flow", version = "=0.14.4" }
brokk-bifrost-jvm = { path = "../bifrost-jvm", version = "=0.14.4" }
glob = "0.3.3"
regex = "1.12.2"
regex-syntax = "0.8"
serde = { version = "1.0.228", features = ["derive"] }
schemars = "1.2.1"
serde_json = "1.0.145"
sha2 = "0.10.8"
strsim = "0.11.1"
tree-sitter = "0.25.10"
workspace-hack.workspace = true

[dev-dependencies]
brokk-bifrost-jvm-analysis = { path = "../bifrost-jvm-analysis", version = "=0.14.4", features = ["test-support"] }
brokk-bifrost-rust-analysis = { path = "../bifrost-rust-analysis", version = "=0.14.4", features = ["test-support"] }
brokk-bifrost-cpp-analysis = { path = "../bifrost-cpp-analysis", version = "=0.14.4", features = ["test-support"] }
brokk-bifrost-python-analysis = { path = "../bifrost-python-analysis", version = "=0.14.4", features = ["test-support"] }
brokk-bifrost-js-ts-analysis = { path = "../bifrost-js-ts-analysis", version = "=0.14.4", features = ["test-support"] }

brokk-bifrost-ruby-analysis = { path = "../bifrost-ruby-analysis", version = "=0.14.4", features = ["test-support"] }
brokk-bifrost-test-macros = { path = "../bifrost-test-macros" }
brokk-bifrost-analysis = { path = "../bifrost-analysis", version = "=0.14.4", features = ["test-support"] }
brokk-bifrost-flow = { path = "../bifrost-flow", version = "=0.14.4", features = ["test-support"] }
tempfile = "3.23.0"
proptest = "1.11"
zip = { version = "9.0.3", default-features = false, features = ["deflate-flate2", "deflate-zopfli"] }

[lints]
workspace = true
