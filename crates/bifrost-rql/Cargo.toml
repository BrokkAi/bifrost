[package]
name = "brokk-bifrost-rql"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "RQL syntax, typed IR, planning, and execution for brokk-bifrost"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
publish = true

[lib]
name = "brokk_bifrost_rql"

[dependencies]
brokk-bifrost-analysis = { path = "../bifrost-analysis", version = "=0.10.8" }
brokk-bifrost-core = { path = "../bifrost-core", version = "=0.10.8" }
brokk-bifrost-flow = { path = "../bifrost-flow", version = "=0.10.8" }
glob = "0.3.3"
json-spanned-value = "0.2.2"
regex = "1.12.2"
regex-syntax = "0.8"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.8"
strsim = "0.11.1"

[dev-dependencies]
brokk-bifrost-analysis = { path = "../bifrost-analysis", version = "=0.10.8", features = ["test-support"] }
brokk-bifrost-flow = { path = "../bifrost-flow", version = "=0.10.8", features = ["test-support"] }
tempfile = "3.23.0"
git2 = { version = "0.20.2", default-features = false }
semver = "1.0.28"
