[package]
name = "brokk-bifrost-js-ts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "JavaScript and TypeScript language knowledge for brokk-bifrost: declarations, ESM/CommonJS imports and tsconfig path aliases, receiver facts, and usage-graph resolution"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
publish = true

[lib]
name = "brokk_bifrost_js_ts"

[dependencies]
js-semver = "1.0.0"
brokk-bifrost-core = { path = "../bifrost-core", version = "=0.14.3" }
# `scan_files_for_seeds` and the usage-index builder walk the workspace file set
# in parallel; these are the seam's only two rayon sites and both moved here.
rayon = "1.10.0"
# `tsconfig.json`/`jsconfig.json` are JSONC, which `tsconfig::AliasResolver`
# strips and then parses for its `paths` map.
serde_json = "1.0.145"
tree-sitter = "0.25.10"
tree-sitter-javascript = { package = "brokk-tree-sitter-javascript", version = "=0.25.3" }
# Brokk's 0.23.6 fork carries declaration-grammar repairs (#3502) and raw NUL
# string/comment support (#4479) not yet available in an upstream release.
# It remains a grammar generation behind the fleet's 0.25 line,
# in the same class as tree-sitter-c-sharp 0.23.1, tree-sitter-cpp 0.23.4 and
# tree-sitter-ruby 0.23.1. It is versioned independently of
# tree-sitter-javascript even though one module drives both dialects, and it is
# the only fleet grammar exporting a second parser constant (`LANGUAGE_TSX`),
# which is why `ParserFlavor` exists on the analysis side. `LANGUAGE_TSX` also
# continues to read `.jsx` under its established dialect/storage identity.
# Standard `.js` uses Brokk's JavaScript grammar, whose 0.25.1 repair accepts
# reserved words in JSX name positions without TSX's ordinary-JS drift
# (#3322, #3342).
tree-sitter-typescript = { package = "brokk-tree-sitter-typescript", version = "=0.23.7" }
workspace-hack.workspace = true

[features]
default = []
# Mirrors `brokk-bifrost-analysis`'s feature of the same name, chained exactly
# like `brokk-bifrost-core`'s. Nothing here records a production-path counter,
# so this is the chain alone -- it exists so a `test-support` build of the
# workspace resolves one consistent core feature set.
test-support = ["brokk-bifrost-core/test-support"]

[dev-dependencies]
brokk-bifrost-test-macros = { path = "../bifrost-test-macros" }
brokk-bifrost-core = { path = "../bifrost-core", version = "=0.14.3", features = ["test-support"] }
tempfile = "3.23.0"

[lints]
workspace = true
