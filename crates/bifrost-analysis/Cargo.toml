[package]
name = "brokk-bifrost-analysis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Protocol-neutral analysis engine for brokk-bifrost"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
publish = true

[lib]
name = "brokk_bifrost_analysis"

[dependencies]
brokk-bifrost-store.workspace = true
brokk-bifrost-semantic = { path = "../bifrost-semantic", version = "=0.14.2" }
brokk-bifrost-core = { path = "../bifrost-core", version = "=0.14.2" }
brokk-bifrost-cpp = { path = "../bifrost-cpp", version = "=0.14.2" }
brokk-bifrost-csharp = { path = "../bifrost-csharp", version = "=0.14.2" }
brokk-bifrost-go = { path = "../bifrost-go", version = "=0.14.2" }
brokk-bifrost-js-ts = { path = "../bifrost-js-ts", version = "=0.14.2" }
brokk-bifrost-jvm = { path = "../bifrost-jvm", version = "=0.14.2" }
brokk-bifrost-php = { path = "../bifrost-php", version = "=0.14.2" }
brokk-bifrost-python = { path = "../bifrost-python", version = "=0.14.2" }
brokk-bifrost-ruby = { path = "../bifrost-ruby", version = "=0.14.2" }
brokk-bifrost-rust = { path = "../bifrost-rust", version = "=0.14.2" }
arc-swap = "1.7.1"
cap-std = { version = "4.0.2", default-features = false }
cap-fs-ext = { version = "4.0.2", default-features = false, features = ["std"] }
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
git2 = { version = "0.20.2", default-features = false }
glob = "0.3.3"
moka = { version = "0.12.11", features = ["sync"] }
rayon = "1.10.0"
regex = "1.12.2"
regex-syntax = "0.8.11"
rusqlite = { version = "0.40.2", default-features = false, features = [
    "bundled",
    "cache",
    "fallible_uint",
    "trace",
    "hooks",
    "functions",
] }
rustc-hash = "2"
schemars = "1.2.1"
semver = "1.0.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde-saphyr = { version = "0.0.29", default-features = false, features = ["deserialize"] }
sha2 = "0.10.8"
tempfile = "3.23.0"
uuid = { version = "1.23.0", features = ["v4"] }
tree-sitter = "0.25.10"
tree-sitter-go = "0.25.0"
# Brokk's maintained fork carries JSON grammar corrections that are not both
# available in an upstream release (issue #3343).
tree-sitter-json = { package = "brokk-tree-sitter-json", version = "=0.24.9" }
tree-sitter-properties = "0.3.0"
tree-sitter-javascript = { package = "brokk-tree-sitter-javascript", version = "=0.25.3" }
tree-sitter-python = "0.25.0"
tree-sitter-c-sharp = { package = "brokk-tree-sitter-c-sharp", version = "=0.23.8" }
tree-sitter-cpp = { package = "brokk-tree-sitter-cpp", version = "=0.24.6" }
tree-sitter-java = "0.23.5"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = { package = "brokk-tree-sitter-rust", version = "=0.24.7" }
# Brokk's fork carries TypeScript declaration-grammar repairs that are not yet
# available in an upstream release (#3502).
tree-sitter-typescript = { package = "brokk-tree-sitter-typescript", version = "=0.23.7" }
tree-sitter-yaml = "0.7.2"
tar = { version = "0.4.44", default-features = false }
quick-xml = "0.40"
toml_edit = "0.22.27"
jsonschema = { version = "0.48.0", default-features = false }
zip = { version = "9.0.3", default-features = false, features = ["deflate-flate2", "deflate-zopfli"] }

[features]
default = []
# Propagates the CI-only hash-order check through the analysis graph.
randomized-hash = ["brokk-bifrost-core/randomized-hash", "brokk-bifrost-store/randomized-hash"]
test-support = [
    "brokk-bifrost-store/test-support",
    "brokk-bifrost-semantic/test-support",
    "brokk-bifrost-core/test-support",
    "brokk-bifrost-cpp/test-support",
    "brokk-bifrost-go/test-support",
    "brokk-bifrost-js-ts/test-support",
    "brokk-bifrost-jvm/test-support",
    "brokk-bifrost-python/test-support",
    "brokk-bifrost-rust/test-support",
]

[dev-dependencies]
brokk-bifrost-store = { path = "../bifrost-store", version = "=0.14.2", features = ["test-support"] }
proptest = "1.11"
brokk-bifrost-test-macros = { path = "../bifrost-test-macros" }
# Cargo unifies this with the plain `[dependencies]` entry above for this
# crate's test targets, which is what makes `CancellationToken`'s
# `cancel_after_checks_for_test` hooks exist while the unit tests are built.
brokk-bifrost-core = { path = "../bifrost-core", version = "=0.14.2", features = ["test-support"] }
brokk-bifrost-cpp = { path = "../bifrost-cpp", version = "=0.14.2", features = ["test-support"] }
brokk-bifrost-go = { path = "../bifrost-go", version = "=0.14.2", features = ["test-support"] }
brokk-bifrost-js-ts = { path = "../bifrost-js-ts", version = "=0.14.2", features = ["test-support"] }
brokk-bifrost-jvm = { path = "../bifrost-jvm", version = "=0.14.2", features = ["test-support"] }
brokk-bifrost-python = { path = "../bifrost-python", version = "=0.14.2", features = ["test-support"] }
brokk-bifrost-rust = { path = "../bifrost-rust", version = "=0.14.2", features = ["test-support"] }
brokk-bifrost-semantic = { path = "../bifrost-semantic", version = "=0.14.2", features = ["test-support"] }
rusqlite = { version = "0.40.2", default-features = false, features = [
    "bundled",
    "cache",
    "fallible_uint",
    "trace",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
