[package]
name = "brokk-bifrost-analysis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Protocol-neutral analysis engine for brokk-bifrost"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
publish = true

[lib]
name = "brokk_bifrost_analysis"

[dependencies]
brokk-bifrost-core = { path = "../bifrost-core", version = "=0.8.24" }
brokk-bifrost-cpp = { path = "../bifrost-cpp", version = "=0.8.24" }
brokk-bifrost-csharp = { path = "../bifrost-csharp", version = "=0.8.24" }
brokk-bifrost-go = { path = "../bifrost-go", version = "=0.8.24" }
brokk-bifrost-js-ts = { path = "../bifrost-js-ts", version = "=0.8.24" }
brokk-bifrost-jvm = { path = "../bifrost-jvm", version = "=0.8.24" }
brokk-bifrost-php = { path = "../bifrost-php", version = "=0.8.24" }
brokk-bifrost-python = { path = "../bifrost-python", version = "=0.8.24" }
brokk-bifrost-ruby = { path = "../bifrost-ruby", version = "=0.8.24" }
brokk-bifrost-rust = { path = "../bifrost-rust", version = "=0.8.24" }
arc-swap = "1.7.1"
bincode = "1.3.3"
cap-std = { version = "4.0.2", default-features = false }
cap-fs-ext = { version = "4.0.2", default-features = false, features = ["std"] }
growable-bloom-filter = "2.1"
chrono = { version = "0.4.44", default-features = false, features = ["clock", "std"] }
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
git2 = { version = "0.20.2", default-features = false }
goblin = "0.10.7"
glob = "0.3.3"
moka = { version = "0.12.11", features = ["sync"] }
rayon = "1.10.0"
regex = "1.12.2"
regex-syntax = "0.8"
rusqlite = { version = "0.32.1", features = ["bundled"] }
rustc-hash = "2"
rustdoc-types = { version = "=0.60.0", default-features = false }
rubund = { version = "=0.1.0", default-features = false }
schemars = "1.2.1"
semver = "1.0.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde-saphyr = { version = "0.0.29", default-features = false, features = ["deserialize"] }
spdx = "0.13.4"
strsim = "0.11.1"
json-spanned-value = "0.2.2"
sha2 = "0.10.8"
toml = "0.8.23"
tempfile = "3.23.0"
uuid = { version = "1.23.0", features = ["v4"] }
url = { version = "2.5.8", default-features = false, features = ["std"] }
tree-sitter = "0.25.10"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-c-sharp = "0.23.1"
tree-sitter-cpp = "0.23.4"
tree-sitter-java = "0.23.5"
tree-sitter-php = "0.23.11"
tree-sitter-rbs = "=0.2.2"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.0"
tree-sitter-typescript = "0.23.2"
tar = { version = "0.4.44", default-features = false }
walkdir = "2.5.0"
quick-xml = "0.40"
jclassfile = "0.6.0"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

[features]
default = []
# Deliberately no `nlp` feature: semantic search is its own crate
# (brokk-bifrost-nlp), so turning it on cannot change this crate's fingerprint
# and cannot force a rebuild of the workspace's largest compilation unit.
test-support = [
    "brokk-bifrost-core/test-support",
    "brokk-bifrost-cpp/test-support",
    "brokk-bifrost-go/test-support",
    "brokk-bifrost-js-ts/test-support",
    "brokk-bifrost-jvm/test-support",
    "brokk-bifrost-python/test-support",
    "brokk-bifrost-rust/test-support",
]

[dev-dependencies]
# Cargo unifies this with the plain `[dependencies]` entry above for this
# crate's test targets, which is what makes `CancellationToken`'s
# `cancel_after_checks_for_test` hooks exist while the unit tests are built.
brokk-bifrost-core = { path = "../bifrost-core", version = "=0.8.24", features = ["test-support"] }
brokk-bifrost-cpp = { path = "../bifrost-cpp", version = "=0.8.24", features = ["test-support"] }
brokk-bifrost-go = { path = "../bifrost-go", version = "=0.8.24", features = ["test-support"] }
brokk-bifrost-js-ts = { path = "../bifrost-js-ts", version = "=0.8.24", features = ["test-support"] }
brokk-bifrost-jvm = { path = "../bifrost-jvm", version = "=0.8.24", features = ["test-support"] }
brokk-bifrost-python = { path = "../bifrost-python", version = "=0.8.24", features = ["test-support"] }
brokk-bifrost-rust = { path = "../bifrost-rust", version = "=0.8.24", features = ["test-support"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
tree-sitter-scala = "=0.25.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
