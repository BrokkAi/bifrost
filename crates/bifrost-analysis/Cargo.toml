[package]
name = "brokk-bifrost-analysis"
version.workspace = true
edition.workspace = true
description = "Protocol-neutral analysis engine for brokk-bifrost"
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = true
build = "build.rs"
exclude = [
    "vendor/tree-sitter-scala/README.md",
    "vendor/tree-sitter-scala/queries/**",
    "!vendor/tree-sitter-scala/queries/highlights.scm",
    "vendor/tree-sitter-scala/src/grammar.json",
    "vendor/tree-sitter-scala/src/node-types.json",
    "vendor/tree-sitter-scala/tree-sitter.json",
    "resources/treesitter/kotlin/tags.scm",
    "vendor/tree-sitter-kotlin/src/grammar.json",
    "vendor/tree-sitter-kotlin/src/node-types.json",
    "vendor/tree-sitter-kotlin/tree-sitter.json",
]

[lib]
name = "brokk_bifrost_analysis"

[dependencies]
brokk-bifrost-core = { path = "../bifrost-core", version = "=0.8.23" }
arc-swap = "1.7.1"
bincode = "1.3.3"
cap-std = { version = "4.0.2", default-features = false }
cap-fs-ext = { version = "4.0.2", default-features = false, features = ["std"] }
growable-bloom-filter = "2.1"
chrono = { version = "0.4.44", default-features = false, features = ["clock", "std"] }
csv = "1.3.1"
cvss = { version = "2.2.0", default-features = false, features = ["std", "v3", "v4"] }
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
git2 = { version = "0.20.2", default-features = false }
goblin = "0.10.7"
glob = "0.3.3"
ignore = "0.4.24"
moka = { version = "0.12.11", features = ["sync"] }
nu-ansi-term = "0.50"
rayon = "1.10.0"
regex = "1.12.2"
regex-syntax = "0.8"
rusqlite = { version = "0.32.1", features = ["bundled"] }
rustc-hash = "2"
rustdoc-types = { version = "=0.60.0", default-features = false }
rubund = { version = "=0.1.0", default-features = false }
schemars = "1.2.1"
semver = "1.0.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde-saphyr = { version = "0.0.29", default-features = false, features = ["deserialize"] }
spdx = "0.13.4"
strsim = "0.11.1"
json-spanned-value = "0.2.2"
sha2 = "0.10.8"
shlex = "2.0.1"
toml = "0.8.23"
tempfile = "3.23.0"
uuid = { version = "1.23.0", features = ["v4"] }
url = { version = "2.5.8", default-features = false, features = ["std"] }
tree-sitter = "0.25.10"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-language = "0.1"
tree-sitter-c-sharp = "0.23.1"
tree-sitter-cpp = "0.23.4"
tree-sitter-java = "0.23.5"
tree-sitter-php = "0.23.11"
tree-sitter-rbs = "=0.2.2"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.0"
tree-sitter-typescript = "0.23.2"
tar = { version = "0.4.44", default-features = false }
walkdir = "2.5.0"
quick-xml = "0.40"
jclassfile = "0.6.0"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

[build-dependencies]
cc = "1.2"

[features]
default = []
# Deliberately no `nlp` feature: semantic search is its own crate
# (brokk-bifrost-nlp), so turning it on cannot change this crate's fingerprint
# and cannot force a rebuild of the workspace's largest compilation unit.
test-support = ["brokk-bifrost-core/test-support"]

[dev-dependencies]
# Cargo unifies this with the plain `[dependencies]` entry above for this
# crate's test targets, which is what makes `CancellationToken`'s
# `cancel_after_checks_for_test` hooks exist while the unit tests are built.
brokk-bifrost-core = { path = "../bifrost-core", version = "=0.8.23", features = ["test-support"] }
filetime = "0.2"
jsonschema = { version = "0.48.0", default-features = false }
pretty_assertions = "1.4.1"
rusqlite = { version = "0.32.1", features = ["bundled"] }
tree-sitter-scala = "=0.25.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
