[package]
name = "brokk-bifrost-js-ts-analysis"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "JavaScript and TypeScript analyzers and usage resolution for brokk-bifrost"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish = true
readme = "README.md"

[lib]
name = "brokk_bifrost_js_ts_analysis"

[lints]
workspace = true

[dependencies]
brokk-bifrost-analysis = { path = "../bifrost-analysis", version = "=0.14.3" }
brokk-bifrost-semantic = { path = "../bifrost-semantic", version = "=0.14.3" }
brokk-bifrost-core = { path = "../bifrost-core", version = "=0.14.3" }
brokk-bifrost-js-ts = { path = "../bifrost-js-ts", version = "=0.14.3" }
git2 = { version = "0.20.2", default-features = false }
glob = "0.3.3"
moka = { version = "0.12.11", features = ["sync"] }
rusqlite = { version = "0.40.2", default-features = false, features = [
"bundled",
"cache",
"fallible_uint",
"trace",
"hooks",
"functions",
] }
semver = "1.0.28"
serde_json = "1.0.145"
serde-saphyr = { version = "0.0.29", default-features = false, features = ["deserialize"] }
sha2 = "0.10.8"
tempfile = "3.23.0"
tree-sitter = "0.25.10"
tree-sitter-javascript = { package = "brokk-tree-sitter-javascript", version = "=0.25.3" }
tree-sitter-typescript = { package = "brokk-tree-sitter-typescript", version = "=0.23.7" }
tree-sitter-yarnlock = "=0.2.0"
yarn-lock-parser = "=0.14.0"
workspace-hack.workspace = true

[dev-dependencies]
brokk-bifrost-analysis = { path = "../bifrost-analysis", version = "=0.14.3", features = ["test-support"] }
brokk-bifrost-test-macros = { path = "../bifrost-test-macros" }
brokk-bifrost-core = { path = "../bifrost-core", version = "=0.14.3", features = ["test-support"] }
brokk-bifrost-js-ts = { path = "../bifrost-js-ts", version = "=0.14.3", features = ["test-support"] }
rusqlite = { version = "0.40.2", default-features = false, features = [
"bundled",
"cache",
"fallible_uint",
"trace",
] }

[features]
default = []
test-support = ["brokk-bifrost-analysis/test-support", "brokk-bifrost-js-ts/test-support"]
randomized-hash = ["brokk-bifrost-analysis/randomized-hash"]
