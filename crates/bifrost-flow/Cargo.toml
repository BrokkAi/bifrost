[package]
name = "brokk-bifrost-flow"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Dataflow, value-flow, taint, and typestate engines for brokk-bifrost"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
publish = true

[lib]
name = "brokk_bifrost_flow"

[dependencies]
brokk-bifrost-analysis = { path = "../bifrost-analysis", version = "=0.14.3" }
brokk-bifrost-core = { path = "../bifrost-core", version = "=0.14.3" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.8"
tempfile = "3.23.0"
tree-sitter = "0.25.10"
workspace-hack.workspace = true

[features]
default = []
randomized-hash = [
    "brokk-bifrost-analysis/randomized-hash",
    "brokk-bifrost-core/randomized-hash",
]
test-support = [
    "brokk-bifrost-analysis/test-support",
    "brokk-bifrost-core/test-support",
]

[dev-dependencies]
brokk-bifrost-tools = { path = "../bifrost-tools", version = "=0.14.3", features = ["test-support"] }
brokk-bifrost-test-macros = { path = "../bifrost-test-macros" }
proptest = "1.11"
brokk-bifrost-analysis = { path = "../bifrost-analysis", version = "=0.14.3", features = ["test-support"] }
brokk-bifrost-core = { path = "../bifrost-core", version = "=0.14.3", features = ["test-support"] }

[lints]
workspace = true
