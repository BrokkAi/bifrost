[package]
name = "brokk-bifrost-jvm-analysis"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Java, Kotlin and Scala analyzers and JVM artifact integration for brokk-bifrost"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish = true
readme = "README.md"

[lib]
name = "brokk_bifrost_jvm_analysis"

[lints]
workspace = true

[dependencies]
brokk-bifrost-analysis = { path = "../bifrost-analysis", version = "=0.14.3" }
brokk-bifrost-semantic = { path = "../bifrost-semantic", version = "=0.14.3" }
brokk-bifrost-core = { path = "../bifrost-core", version = "=0.14.3" }
brokk-bifrost-jvm = { path = "../bifrost-jvm", version = "=0.14.3" }
git2 = { version = "0.20.2", default-features = false }
moka = { version = "0.12.11", features = ["sync"] }
rayon = "1.10.0"
rusqlite = { version = "0.40.2", default-features = false, features = [
"bundled",
"cache",
"fallible_uint",
"trace",
"hooks",
"functions",
] }
schemars = "1.2.1"
semver = "1.0.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.8"
tempfile = "3.23.0"
tree-sitter = "0.25.10"
tree-sitter-java = "0.23.5"
jclassfile = "0.6.0"
zip = { version = "9.0.3", default-features = false, features = ["deflate-flate2", "deflate-zopfli"] }
workspace-hack.workspace = true

[dev-dependencies]
brokk-bifrost-analysis = { path = "../bifrost-analysis", version = "=0.14.3", features = ["test-support"] }
brokk-bifrost-test-macros = { path = "../bifrost-test-macros" }
brokk-bifrost-core = { path = "../bifrost-core", version = "=0.14.3", features = ["test-support"] }
brokk-bifrost-jvm = { path = "../bifrost-jvm", version = "=0.14.3", features = ["test-support"] }
rusqlite = { version = "0.40.2", default-features = false, features = [
"bundled",
"cache",
"fallible_uint",
"trace",
] }

[features]
default = []
test-support = ["brokk-bifrost-analysis/test-support"]
randomized-hash = ["brokk-bifrost-analysis/randomized-hash"]
