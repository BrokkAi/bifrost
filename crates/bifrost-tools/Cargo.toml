[package]
name = "brokk-bifrost-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Product-facing code intelligence and workspace tools for brokk-bifrost"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish = true
readme = "README.md"

[lib]
name = "brokk_bifrost_tools"

[lints]
workspace = true

[dependencies]
brokk-bifrost-jvm-analysis = { path = "../bifrost-jvm-analysis", version = "=0.14.2" }
brokk-bifrost-rust-analysis = { path = "../bifrost-rust-analysis", version = "=0.14.2" }
brokk-bifrost-go-analysis = { path = "../bifrost-go-analysis", version = "=0.14.2" }
brokk-bifrost-php-analysis = { path = "../bifrost-php-analysis", version = "=0.14.2" }
brokk-bifrost-cpp-analysis = { path = "../bifrost-cpp-analysis", version = "=0.14.2" }
brokk-bifrost-python-analysis = { path = "../bifrost-python-analysis", version = "=0.14.2" }
brokk-bifrost-ruby-analysis = { path = "../bifrost-ruby-analysis", version = "=0.14.2" }
brokk-bifrost-csharp-analysis = { path = "../bifrost-csharp-analysis", version = "=0.14.2" }
brokk-bifrost-js-ts-analysis = { path = "../bifrost-js-ts-analysis", version = "=0.14.2" }
brokk-bifrost-analysis = { path = "../bifrost-analysis", version = "=0.14.2" }
brokk-bifrost-core = { path = "../bifrost-core", version = "=0.14.2" }
brokk-bifrost-cpp = { path = "../bifrost-cpp", version = "=0.14.2" }
brokk-bifrost-go = { path = "../bifrost-go", version = "=0.14.2" }
brokk-bifrost-php = { path = "../bifrost-php", version = "=0.14.2" }
brokk-bifrost-python = { path = "../bifrost-python", version = "=0.14.2" }
brokk-bifrost-rust = { path = "../bifrost-rust", version = "=0.14.2" }
chrono = { version = "0.4.44", default-features = false, features = ["clock", "std"] }
git2 = { version = "0.20.2", default-features = false }
glob = "0.3.3"
moka = { version = "0.12.11", features = ["sync"] }
rayon = "1.10.0"
regex = "1.12.2"
rusqlite = { version = "0.40.2", default-features = false, features = [
"bundled",
"cache",
"fallible_uint",
"trace",
"hooks",
"functions",
] }
schemars = "1.2.1"
semver = "1.0.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tempfile = "3.23.0"
tree-sitter = "0.25.10"
tree-sitter-json = { package = "brokk-tree-sitter-json", version = "=0.24.9" }
tree-sitter-properties = "0.3.0"
tree-sitter-yaml = "0.7.2"
walkdir = "2.5.0"

[dev-dependencies]
brokk-bifrost-jvm = { path = "../bifrost-jvm", version = "=0.14.2", features = ["test-support"] }
zip = { version = "9.0.3", default-features = false, features = ["deflate-flate2", "deflate-zopfli"] }
brokk-bifrost-jvm-analysis = { path = "../bifrost-jvm-analysis", version = "=0.14.2" , features = ["test-support"] }
brokk-bifrost-rust-analysis = { path = "../bifrost-rust-analysis", version = "=0.14.2", features = ["test-support"] }
tree-sitter-go = "0.25.0"
syn = { version = "2", features = ["extra-traits", "full", "visit"] }
tree-sitter-ruby = "0.23.1"
brokk-bifrost-ruby = { path = "../bifrost-ruby", version = "=0.14.2" }
brokk-bifrost-go-analysis = { path = "../bifrost-go-analysis", version = "=0.14.2", features = ["test-support"] }
brokk-bifrost-php-analysis = { path = "../bifrost-php-analysis", version = "=0.14.2", features = ["test-support"] }
brokk-bifrost-cpp-analysis = { path = "../bifrost-cpp-analysis", version = "=0.14.2", features = ["test-support"] }
proptest = "1.11"
brokk-bifrost-semantic = { path = "../bifrost-semantic", version = "=0.14.2" }
brokk-bifrost-python-analysis = { path = "../bifrost-python-analysis", version = "=0.14.2", features = ["test-support"] }
brokk-bifrost-ruby-analysis = { path = "../bifrost-ruby-analysis", version = "=0.14.2", features = ["test-support"] }
brokk-bifrost-csharp-analysis = { path = "../bifrost-csharp-analysis", version = "=0.14.2", features = ["test-support"] }
brokk-bifrost-js-ts-analysis = { path = "../bifrost-js-ts-analysis", version = "=0.14.2", features = ["test-support"] }
brokk-bifrost-js-ts = { path = "../bifrost-js-ts", version = "=0.14.2", features = ["test-support"] }
tree-sitter-cpp = { package = "brokk-tree-sitter-cpp", version = "=0.24.6" }
tree-sitter-rust = { package = "brokk-tree-sitter-rust", version = "=0.24.7" }
brokk-bifrost-analysis = { path = "../bifrost-analysis", version = "=0.14.2", features = ["test-support"] }
brokk-bifrost-test-macros = { path = "../bifrost-test-macros" }
brokk-bifrost-core = { path = "../bifrost-core", version = "=0.14.2", features = ["test-support"] }
brokk-bifrost-cpp = { path = "../bifrost-cpp", version = "=0.14.2", features = ["test-support"] }
brokk-bifrost-go = { path = "../bifrost-go", version = "=0.14.2", features = ["test-support"] }
brokk-bifrost-python = { path = "../bifrost-python", version = "=0.14.2", features = ["test-support"] }
brokk-bifrost-rust = { path = "../bifrost-rust", version = "=0.14.2", features = ["test-support"] }
rusqlite = { version = "0.40.2", default-features = false, features = [
"bundled",
"cache",
"fallible_uint",
"trace",
] }

[features]
default = []
test-support = ["brokk-bifrost-jvm-analysis/test-support", "brokk-bifrost-rust-analysis/test-support", "brokk-bifrost-go-analysis/test-support", "brokk-bifrost-cpp-analysis/test-support", "brokk-bifrost-csharp-analysis/test-support", "brokk-bifrost-php-analysis/test-support", "brokk-bifrost-python-analysis/test-support", "brokk-bifrost-analysis/test-support", "brokk-bifrost-ruby-analysis/test-support", "brokk-bifrost-js-ts-analysis/test-support"]
randomized-hash = ["brokk-bifrost-analysis/randomized-hash"]
