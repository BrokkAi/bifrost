<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Bifrost usage analysis architecture</title>
  <desc id="desc">Two current pipelines share language-specific structured resolution. A target-directed query discovers candidate files and returns evidence-bearing usage hits. A workspace build reads persisted declarations, scans files once, and returns an exact caller-to-callee graph used for ranking. Only complete graphs enter a content-keyed cache. A dashed orange box marks immutable file-local usage facts and pure workspace composition as a future direction, not a shipped component.</desc>
  <defs>
    <linearGradient id="usage-bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#081521"/>
      <stop offset="1" stop-color="#102b36"/>
    </linearGradient>
    <filter id="usage-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#02070b" flood-opacity="0.45"/>
    </filter>
    <marker id="usage-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#66d4c2"/>
    </marker>
    <marker id="usage-warm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f6a85f"/>
    </marker>
    <style>
      .label{font:600 21px 'JetBrains Mono',ui-monospace,monospace;fill:#effaf8}
      .section{font:700 16px 'JetBrains Mono',ui-monospace,monospace;fill:#66d4c2;letter-spacing:1px}
      .small{font:500 15px 'JetBrains Mono',ui-monospace,monospace;fill:#b8d5d2}
      .tiny{font:500 13px 'JetBrains Mono',ui-monospace,monospace;fill:#9bb8b6}
      .box{fill:#102b36;stroke:#3e7d7a;stroke-width:2}
      .accent{fill:#133f43;stroke:#66d4c2;stroke-width:2}
      .warm{fill:#3b2b20;stroke:#f6a85f;stroke-width:2}
      .line{stroke:#66d4c2;stroke-width:3;fill:none;marker-end:url(#usage-arrow)}
      .warm-line{stroke:#f6a85f;stroke-width:3;stroke-dasharray:8 7;fill:none;marker-end:url(#usage-warm-arrow)}
    </style>
  </defs>

  <rect width="1200" height="900" rx="22" fill="url(#usage-bg)"/>
  <text x="60" y="54" class="label">BIFROST USAGE ANALYSIS: RESOLVE, THEN RELATE</text>

  <text x="80" y="96" class="section">TARGET-DIRECTED REQUEST</text>
  <text x="650" y="96" class="section">WORKSPACE GRAPH</text>

  <g filter="url(#usage-shadow)">
    <rect x="70" y="116" width="480" height="88" rx="14" class="box"/>
    <text x="310" y="151" text-anchor="middle" class="label">Exact declaration target</text>
    <text x="310" y="179" text-anchor="middle" class="small">one declaration or an explicit overload group</text>

    <rect x="650" y="116" width="480" height="88" rx="14" class="box"/>
    <text x="890" y="151" text-anchor="middle" class="label">Root files or full catalog</text>
    <text x="890" y="179" text-anchor="middle" class="small">persisted declaration projections by ecosystem</text>
  </g>

  <path d="M310 204 V244" class="line"/>
  <path d="M890 204 V244" class="line"/>

  <g filter="url(#usage-shadow)">
    <rect x="70" y="252" width="480" height="106" rx="14" class="accent"/>
    <text x="310" y="286" text-anchor="middle" class="label">Candidate discovery</text>
    <text x="310" y="315" text-anchor="middle" class="small">imports | hierarchy | language augmentation</text>
    <text x="310" y="340" text-anchor="middle" class="tiny">file count | source bytes | path scope | cancellation</text>

    <rect x="650" y="252" width="480" height="106" rx="14" class="accent"/>
    <text x="890" y="286" text-anchor="middle" class="label">One pass over admitted files</text>
    <text x="890" y="315" text-anchor="middle" class="small">declaration spans | structured references</text>
    <text x="890" y="340" text-anchor="middle" class="tiny">attribute each site to its smallest enclosing caller</text>
  </g>

  <path d="M310 358 V396 H515" class="line"/>
  <path d="M890 358 V396 H685" class="line"/>

  <rect x="190" y="407" width="820" height="118" rx="16" class="accent" filter="url(#usage-shadow)"/>
  <text x="600" y="442" text-anchor="middle" class="label">Language reference plugin</text>
  <text x="600" y="472" text-anchor="middle" class="small">Tree-sitter extraction | imports and scopes | receiver and overload resolution</text>
  <text x="600" y="500" text-anchor="middle" class="tiny">spelling narrows candidates; structured binding establishes declaration identity and proof</text>

  <path d="M390 525 V568" class="line"/>
  <path d="M810 525 V568" class="line"/>

  <g filter="url(#usage-shadow)">
    <rect x="70" y="577" width="500" height="119" rx="14" class="box"/>
    <text x="320" y="611" text-anchor="middle" class="label">Evidence-bearing usage hits</text>
    <text x="320" y="641" text-anchor="middle" class="small">range | enclosing declaration | kind | proof</text>
    <text x="320" y="670" text-anchor="middle" class="tiny">LSP view | external usages | callers | policy inputs</text>

    <rect x="630" y="577" width="500" height="119" rx="14" class="box"/>
    <text x="880" y="611" text-anchor="middle" class="label">Exact caller-to-callee graph</text>
    <text x="880" y="641" text-anchor="middle" class="small">DeclarationId nodes | weighted, source-backed edges</text>
    <text x="880" y="670" text-anchor="middle" class="tiny">usage_graph | personalized PageRank | blast radius</text>
  </g>

  <path d="M880 696 V724 H1015" class="line"/>
  <rect x="735" y="734" width="395" height="84" rx="13" class="warm" filter="url(#usage-shadow)"/>
  <text x="932" y="767" text-anchor="middle" class="label">Complete-value cache</text>
  <text x="932" y="794" text-anchor="middle" class="tiny">graph kind + ecosystems + content identity</text>

  <rect x="70" y="734" width="610" height="84" rx="13" fill="#0b2029" stroke="#f6a85f" stroke-width="2"/>
  <text x="375" y="765" text-anchor="middle" class="small">RESULT CONTRACT</text>
  <text x="375" y="792" text-anchor="middle" class="tiny">proof | ambiguity | completion | caps | diagnostics | cancellation</text>

  <path d="M600 818 V839" class="warm-line"/>
  <rect x="170" y="840" width="860" height="42" rx="11" class="warm" stroke-dasharray="8 7"/>
  <text x="600" y="867" text-anchor="middle" class="tiny">DIRECTION, NOT SHIPPED: immutable file-local usage facts -&gt; exact workspace composition</text>
</svg>
