<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Bifrost system architecture</title>
  <desc id="desc">A layered diagram. Clients connect through MCP, LSP, CLI, or library adapters to a protocol-neutral runtime. The runtime uses query, policy, flow, and analysis engines. Language front ends and a SQLite analyzer store support the analysis engine. Evidence, completeness, budgets, and cancellation cross every layer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#081521"/><stop offset="1" stop-color="#102b36"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#02070b" flood-opacity="0.45"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#66d4c2"/></marker>
    <style>
      .label{font:600 22px 'JetBrains Mono',ui-monospace,monospace;fill:#effaf8}.small{font:500 15px 'JetBrains Mono',ui-monospace,monospace;fill:#b8d5d2}.tiny{font:500 13px 'JetBrains Mono',ui-monospace,monospace;fill:#9bb8b6}.box{fill:#102b36;stroke:#3e7d7a;stroke-width:2}.accent{fill:#133f43;stroke:#66d4c2;stroke-width:2}.warm{fill:#3b2b20;stroke:#f6a85f;stroke-width:2}.line{stroke:#66d4c2;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="760" rx="22" fill="url(#bg)"/>
  <text x="60" y="54" class="label">BIFROST: ONE ANALYSIS CONTRACT, MULTIPLE CLIENTS</text>

  <g filter="url(#shadow)">
    <rect x="80" y="85" width="245" height="74" rx="12" class="box"/><text x="202" y="116" text-anchor="middle" class="label">Editors</text><text x="202" y="142" text-anchor="middle" class="small">LSP</text>
    <rect x="345" y="85" width="245" height="74" rx="12" class="box"/><text x="467" y="116" text-anchor="middle" class="label">Agents</text><text x="467" y="142" text-anchor="middle" class="small">MCP</text>
    <rect x="610" y="85" width="245" height="74" rx="12" class="box"/><text x="732" y="116" text-anchor="middle" class="label">Automation</text><text x="732" y="142" text-anchor="middle" class="small">CLI</text>
    <rect x="875" y="85" width="245" height="74" rx="12" class="box"/><text x="997" y="116" text-anchor="middle" class="label">Embedded</text><text x="997" y="142" text-anchor="middle" class="small">Rust / Python</text>
  </g>

  <path d="M202 159 V197 H480" class="line"/><path d="M467 159 V197" class="line"/><path d="M732 159 V197" class="line"/><path d="M997 159 V197 H650" class="line"/>
  <rect x="200" y="205" width="800" height="82" rx="14" class="accent" filter="url(#shadow)"/>
  <text x="600" y="239" text-anchor="middle" class="label">Protocol-neutral runtime</text>
  <text x="600" y="266" text-anchor="middle" class="small">workspace generation | canonical results | extension boundary</text>

  <path d="M600 287 V326" class="line"/>
  <g filter="url(#shadow)">
    <rect x="80" y="335" width="235" height="94" rx="14" class="box"/><text x="197" y="370" text-anchor="middle" class="label">Query</text><text x="197" y="398" text-anchor="middle" class="small">CodeQuery / RQL</text>
    <rect x="335" y="335" width="235" height="94" rx="14" class="box"/><text x="452" y="370" text-anchor="middle" class="label">Policy</text><text x="452" y="398" text-anchor="middle" class="small">selectors / reports</text>
    <rect x="590" y="335" width="235" height="94" rx="14" class="accent"/><text x="707" y="370" text-anchor="middle" class="label">Flow</text><text x="707" y="398" text-anchor="middle" class="small">IFDS-family / IDE-style</text>
    <rect x="845" y="335" width="275" height="94" rx="14" class="accent"/><text x="982" y="370" text-anchor="middle" class="label">Analysis</text><text x="982" y="398" text-anchor="middle" class="small">semantic / usage / structural</text>
  </g>
  <path d="M315 382 H335" class="line"/><path d="M570 382 H590" class="line"/><path d="M825 382 H845" class="line"/>

  <path d="M982 429 V479" class="line"/><path d="M707 429 V480 H527" class="line"/>
  <g filter="url(#shadow)">
    <rect x="80" y="492" width="595" height="112" rx="14" class="box"/>
    <text x="377" y="528" text-anchor="middle" class="label">Language front ends</text>
    <text x="377" y="558" text-anchor="middle" class="small">Tree-sitter + structured imports + hierarchy + call binding</text>
    <text x="377" y="582" text-anchor="middle" class="tiny">C/C++ | C# | Go | Java/Scala/Kotlin | JS/TS | PHP | Python | Ruby | Rust</text>
    <rect x="705" y="492" width="415" height="112" rx="14" class="warm"/>
    <text x="912" y="528" text-anchor="middle" class="label">Analyzer store</text>
    <text x="912" y="558" text-anchor="middle" class="small">SQLite relational facts + generations</text>
    <text x="912" y="582" text-anchor="middle" class="tiny">content identity | leases | GC | complete caches</text>
  </g>
  <path d="M675 548 H705" class="line"/>

  <rect x="60" y="646" width="1080" height="68" rx="12" fill="#0b2029" stroke="#f6a85f" stroke-width="2"/>
  <text x="600" y="675" text-anchor="middle" class="small">CROSS-CUTTING CONTRACT</text>
  <text x="600" y="700" text-anchor="middle" class="tiny">structured identity | proof + completeness | explicit budgets | cooperative cancellation | source provenance</text>
</svg>
