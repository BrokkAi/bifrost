<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Bifrost social card</title>
  <desc id="description">Bifrost code intelligence for AI, illustrated by the rainbow beam from the documentation home page.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11100f"/>
      <stop offset="0.48" stop-color="#080808"/>
      <stop offset="1" stop-color="#030303"/>
    </linearGradient>
    <radialGradient id="warm-glow" cx="82%" cy="12%" r="65%">
      <stop offset="0" stop-color="#eb3f33" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#eb3f33" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#eb3f33" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.028"/>
    </pattern>
    <linearGradient id="beam-spectrum-aura" gradientUnits="userSpaceOnUse" x1="560" y1="280" x2="820" y2="520">
      <stop offset="0" stop-color="#ff3b2c" stop-opacity="0"/>
      <stop offset="0.1" stop-color="#ff5a33" stop-opacity="0.65"/>
      <stop offset="0.22" stop-color="#ff9a3c" stop-opacity="0.85"/>
      <stop offset="0.36" stop-color="#ffd975"/>
      <stop offset="0.47" stop-color="#fffdf4"/>
      <stop offset="0.58" stop-color="#8ff0d8"/>
      <stop offset="0.74" stop-color="#4fa8ff" stop-opacity="0.95"/>
      <stop offset="0.9" stop-color="#8a63ff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#8a63ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam-spectrum-body" gradientUnits="userSpaceOnUse" x1="600" y1="318" x2="780" y2="482">
      <stop offset="0" stop-color="#ff3b2c" stop-opacity="0"/>
      <stop offset="0.08" stop-color="#ff5a33" stop-opacity="0.75"/>
      <stop offset="0.24" stop-color="#ff9a3c" stop-opacity="0.95"/>
      <stop offset="0.38" stop-color="#ffd975"/>
      <stop offset="0.5" stop-color="#fffdf4"/>
      <stop offset="0.62" stop-color="#8ff0d8"/>
      <stop offset="0.76" stop-color="#4fa8ff" stop-opacity="0.95"/>
      <stop offset="0.92" stop-color="#8a63ff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#8a63ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam-ramp" gradientUnits="userSpaceOnUse" x1="510" y1="460" x2="1180" y2="78">
      <stop offset="0" stop-color="#fff3d9" stop-opacity="0"/>
      <stop offset="0.58" stop-color="#fff3d9" stop-opacity="0"/>
      <stop offset="0.86" stop-color="#ffe9bd" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#fffdf4" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="beam-entry" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="black"/>
      <stop offset="0.19" stop-color="black"/>
      <stop offset="0.43" stop-color="white"/>
      <stop offset="1" stop-color="white"/>
    </linearGradient>
    <mask id="beam-entry-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="630">
      <rect width="1200" height="630" fill="url(#beam-entry)"/>
    </mask>
    <filter id="beam-blur-xl" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="beam-blur-lg" x="-12%" y="-25%" width="124%" height="150%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="beam-blur-sm" x="-5%" y="-12%" width="110%" height="124%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <filter id="core-glow" x="-5%" y="-20%" width="110%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="flare-glow">
      <stop offset="0" stop-color="#fffdf4" stop-opacity="0.76"/>
      <stop offset="0.22" stop-color="#ffe9bd" stop-opacity="0.32"/>
      <stop offset="0.55" stop-color="#ffb27a" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ffb27a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="copy-scrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#050505" stop-opacity="0.98"/>
      <stop offset="0.7" stop-color="#050505" stop-opacity="0.83"/>
      <stop offset="1" stop-color="#050505" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card-clip">
      <rect width="1200" height="630" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card-clip)">
    <rect width="1200" height="630" fill="url(#background)"/>
    <rect width="1200" height="630" fill="url(#warm-glow)"/>
    <rect width="1200" height="630" fill="url(#grid)"/>

    <g opacity="0.72">
      <circle cx="62" cy="136" r="1.1" fill="#f4f1ec" opacity="0.22"/>
      <circle cx="167" cy="97" r="0.8" fill="#ffe3c2" opacity="0.28"/>
      <circle cx="285" cy="139" r="1.4" fill="#f4f1ec" opacity="0.16"/>
      <circle cx="413" cy="79" r="0.8" fill="#cfe0ff" opacity="0.24"/>
      <circle cx="520" cy="158" r="1.2" fill="#f4f1ec" opacity="0.2"/>
      <circle cx="614" cy="82" r="0.9" fill="#f4f1ec" opacity="0.24"/>
      <circle cx="710" cy="142" r="1.5" fill="#ffe3c2" opacity="0.2"/>
      <circle cx="813" cy="71" r="0.8" fill="#f4f1ec" opacity="0.3"/>
      <circle cx="919" cy="153" r="1.2" fill="#cfe0ff" opacity="0.2"/>
      <circle cx="1046" cy="93" r="1.4" fill="#f4f1ec" opacity="0.24"/>
      <circle cx="1143" cy="180" r="0.8" fill="#ffe3c2" opacity="0.28"/>
      <circle cx="98" cy="255" r="1.3" fill="#cfe0ff" opacity="0.15"/>
      <circle cx="236" cy="222" r="0.8" fill="#f4f1ec" opacity="0.23"/>
      <circle cx="371" cy="266" r="1.1" fill="#f4f1ec" opacity="0.2"/>
      <circle cx="491" cy="231" r="0.8" fill="#ffe3c2" opacity="0.2"/>
      <circle cx="643" cy="263" r="1.5" fill="#f4f1ec" opacity="0.16"/>
      <circle cx="764" cy="221" r="0.9" fill="#cfe0ff" opacity="0.26"/>
      <circle cx="886" cy="278" r="1.1" fill="#f4f1ec" opacity="0.2"/>
      <circle cx="1012" cy="235" r="0.8" fill="#f4f1ec" opacity="0.28"/>
      <circle cx="1124" cy="307" r="1.4" fill="#ffe3c2" opacity="0.18"/>
      <circle cx="188" cy="402" r="0.8" fill="#f4f1ec" opacity="0.2"/>
      <circle cx="332" cy="368" r="1.2" fill="#cfe0ff" opacity="0.18"/>
      <circle cx="526" cy="397" r="0.9" fill="#f4f1ec" opacity="0.22"/>
      <circle cx="711" cy="351" r="1.3" fill="#ffe3c2" opacity="0.24"/>
      <circle cx="936" cy="391" r="0.8" fill="#f4f1ec" opacity="0.26"/>
      <circle cx="1098" cy="438" r="1.2" fill="#cfe0ff" opacity="0.18"/>
    </g>

    <g mask="url(#beam-entry-mask)">
      <path d="M-60 660 C340 585 690 420 1250 25" fill="none" stroke="url(#beam-spectrum-aura)" stroke-width="280" opacity="0.72" filter="url(#beam-blur-xl)"/>
      <path d="M-60 660 C340 585 690 420 1250 25" fill="none" stroke="url(#beam-spectrum-aura)" stroke-width="120" opacity="0.92" filter="url(#beam-blur-lg)"/>
      <path d="M-60 660 C340 585 690 420 1250 25" fill="none" stroke="url(#beam-ramp)" stroke-width="82" filter="url(#beam-blur-lg)"/>
      <path d="M-60 660 C340 585 690 420 1250 25" fill="none" stroke="url(#beam-spectrum-body)" stroke-width="44" filter="url(#beam-blur-sm)"/>
      <path d="M-60 660 C340 585 690 420 1250 25" fill="none" stroke="#ffffff" stroke-width="18" opacity="0.2" filter="url(#beam-blur-lg)"/>
      <path d="M-60 660 C340 585 690 420 1250 25" fill="none" stroke="#fff8ea" stroke-width="5" opacity="0.86" filter="url(#core-glow)"/>
      <path d="M-60 642 C340 567 690 402 1250 7" fill="none" stroke="#ff4a2d" stroke-width="2.4" stroke-dasharray="130 820" opacity="0.62"/>
      <path d="M-60 650 C340 575 690 410 1250 15" fill="none" stroke="#ff9438" stroke-width="2.1" stroke-dasharray="90 720" opacity="0.68"/>
      <path d="M-60 656 C340 581 690 416 1250 21" fill="none" stroke="#ffd76a" stroke-width="1.8" stroke-dasharray="75 620" opacity="0.72"/>
      <path d="M-60 666 C340 591 690 426 1250 31" fill="none" stroke="#7df0cf" stroke-width="1.8" stroke-dasharray="80 680" opacity="0.67"/>
      <path d="M-60 674 C340 599 690 434 1250 39" fill="none" stroke="#55b6ff" stroke-width="2.1" stroke-dasharray="105 760" opacity="0.64"/>
      <path d="M-60 682 C340 607 690 442 1250 47" fill="none" stroke="#8f6bff" stroke-width="2.4" stroke-dasharray="120 800" opacity="0.58"/>
    </g>

    <g transform="translate(1108 123)">
      <circle r="170" fill="url(#flare-glow)" opacity="0.84"/>
      <ellipse rx="194" ry="10" fill="url(#flare-glow)" opacity="0.78" transform="rotate(-35)"/>
      <circle r="46" fill="url(#flare-glow)"/>
    </g>

    <circle cx="721" cy="409" r="2.2" fill="#fff8ea"/>
    <circle cx="823" cy="342" r="1.5" fill="#fff8ea" opacity="0.76"/>
    <circle cx="914" cy="278" r="2.5" fill="#fff8ea" opacity="0.9"/>
    <circle cx="1014" cy="201" r="1.7" fill="#fff8ea" opacity="0.78"/>

    <rect x="0" y="0" width="720" height="630" fill="url(#copy-scrim)"/>
    <path d="M0 112H1200" stroke="#ffffff" stroke-opacity="0.07"/>

    <g transform="translate(70 55)">
      <rect width="34" height="34" transform="rotate(45 17 17)" fill="#eb3f33"/>
      <rect x="9" y="9" width="16" height="16" transform="rotate(45 17 17)" fill="#11100f"/>
      <text x="58" y="27" fill="#f4f1ec" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="27" font-weight="700" letter-spacing="5">BIFROST</text>
    </g>

    <g transform="translate(70 212)">
      <text fill="#f4f1ec" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="74" font-weight="720" letter-spacing="-2.5">
        <tspan x="0" y="0">Code intelligence</tspan>
        <tspan x="0" y="84" fill="#eb3f33">for AI.</tspan>
      </text>
      <text x="2" y="182" fill="#cbc4b7" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="500">
        <tspan x="2">Structural queries  +  Multi-language analysis</tspan>
        <tspan x="2" dy="34">Repository-scale, local-first code intelligence</tspan>
      </text>
    </g>

    <g transform="translate(70 562)">
      <rect x="0" y="-12" width="10" height="10" transform="rotate(45 5 -7)" fill="#eb3f33"/>
      <text x="24" y="0" fill="#d1cbc4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" letter-spacing="1.2">BIFROST.BROKK.AI</text>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="628" rx="18" fill="none" stroke="#35312d" stroke-width="2"/>
</svg>
