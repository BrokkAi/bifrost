<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Bifrost proof and completeness contract</title>
  <desc id="desc">A two-by-two matrix has completeness on the horizontal axis and proof on the vertical axis. Proven and complete is strong positive evidence and can support scoped absence when empty. Proven and partial is a valid positive with an open frontier. Unproven and complete is a fully enumerated candidate set without exact selection. Unproven and partial is bounded candidate evidence. Separate terminal outcomes never support a clean zero.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#081521"/><stop offset="1" stop-color="#102b36"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#02070b" flood-opacity="0.45"/></filter>
    <style>.h{font:700 23px 'JetBrains Mono',ui-monospace,monospace;fill:#effaf8}.t{font:600 17px 'JetBrains Mono',ui-monospace,monospace;fill:#effaf8}.s{font:500 14px 'JetBrains Mono',ui-monospace,monospace;fill:#bfd8d5}.axis{font:600 15px 'JetBrains Mono',ui-monospace,monospace;fill:#8fc9c2}.cell{stroke-width:2}.chip{fill:#0d242c;stroke:#7fa9a6;stroke-width:1.5}</style>
  </defs>
  <rect width="1200" height="720" rx="22" fill="url(#bg)"/>
  <text x="60" y="55" class="h">EVIDENCE QUALITY HAS TWO INDEPENDENT AXES</text>
  <text x="520" y="98" class="axis">COMPLETENESS</text>
  <text x="410" y="128" text-anchor="middle" class="t">Partial</text>
  <text x="825" y="128" text-anchor="middle" class="t">Complete</text>
  <text x="98" y="316" transform="rotate(-90 98 316)" class="axis">PROOF</text>
  <text x="150" y="234" text-anchor="middle" class="t">Proven</text>
  <text x="150" y="430" text-anchor="middle" class="t">Unproven</text>

  <g filter="url(#shadow)">
    <rect x="220" y="150" width="380" height="170" rx="14" fill="#153c3d" stroke="#66d4c2" class="cell"/>
    <text x="410" y="190" text-anchor="middle" class="t">Known edge, open frontier</text>
    <text x="410" y="224" text-anchor="middle" class="s">Safe positive evidence</text>
    <text x="410" y="250" text-anchor="middle" class="s">Not an exhaustive edge set</text>
    <text x="410" y="287" text-anchor="middle" class="s">empty does not mean absent</text>

    <rect x="620" y="150" width="410" height="170" rx="14" fill="#17483f" stroke="#7ce3a3" class="cell"/>
    <text x="825" y="190" text-anchor="middle" class="t">Established and covered</text>
    <text x="825" y="224" text-anchor="middle" class="s">Strong positive evidence</text>
    <text x="825" y="250" text-anchor="middle" class="s">An empty result may support absence</text>
    <text x="825" y="287" text-anchor="middle" class="s">only inside the exact request scope</text>

    <rect x="220" y="340" width="380" height="170" rx="14" fill="#302d2b" stroke="#d6aa78" class="cell"/>
    <text x="410" y="380" text-anchor="middle" class="t">Candidate plus open frontier</text>
    <text x="410" y="414" text-anchor="middle" class="s">Useful bounded review input</text>
    <text x="410" y="440" text-anchor="middle" class="s">Neither exact nor exhaustive</text>
    <text x="410" y="477" text-anchor="middle" class="s">retain both reasons</text>

    <rect x="620" y="340" width="410" height="170" rx="14" fill="#3b3325" stroke="#f6c56f" class="cell"/>
    <text x="825" y="380" text-anchor="middle" class="t">Covered candidate set</text>
    <text x="825" y="414" text-anchor="middle" class="s">Every candidate was considered</text>
    <text x="825" y="440" text-anchor="middle" class="s">Exact selection remains unproven</text>
    <text x="825" y="477" text-anchor="middle" class="s">do not promote candidates to facts</text>
  </g>

  <text x="60" y="566" class="h">TERMINAL REQUEST OUTCOMES</text>
  <g>
    <rect x="60" y="592" width="170" height="64" rx="10" class="chip"/><text x="145" y="630" text-anchor="middle" class="s">ambiguous</text>
    <rect x="245" y="592" width="170" height="64" rx="10" class="chip"/><text x="330" y="630" text-anchor="middle" class="s">unknown</text>
    <rect x="430" y="592" width="170" height="64" rx="10" class="chip"/><text x="515" y="630" text-anchor="middle" class="s">unsupported</text>
    <rect x="615" y="592" width="170" height="64" rx="10" class="chip"/><text x="700" y="630" text-anchor="middle" class="s">budget exhausted</text>
    <rect x="800" y="592" width="170" height="64" rx="10" class="chip"/><text x="885" y="630" text-anchor="middle" class="s">cancelled</text>
    <rect x="985" y="592" width="155" height="64" rx="10" class="chip"/><text x="1062" y="630" text-anchor="middle" class="s">failed</text>
  </g>
  <text x="600" y="690" text-anchor="middle" class="axis">These may retain partial positives. None supports a clean zero.</text>
</svg>
