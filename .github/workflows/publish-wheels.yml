name: Publish wheels

on:
  workflow_call:
    inputs:
      tag:
        description: Validated release tag
        required: true
        type: string
      version:
        description: Validated package version
        required: true
        type: string
      commit:
        description: Immutable commit selected by the validated release tag
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout validated source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ inputs.commit }}

      - name: Verify release tag still selects the validated commit
        run: bash scripts/verify-release-tag-commit.sh "${{ inputs.tag }}" "${{ inputs.commit }}"

      - name: Download wheel artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Download source distribution
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: sdist
          path: dist

      - name: Confirm validated release identity
        run: echo "Publishing ${{ inputs.tag }} (${{ inputs.version }}) from ${{ inputs.commit }}"

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          packages-dir: dist
