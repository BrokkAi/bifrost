name: Publish qualified npm archives

run-name: Publish npm ${{ inputs.release_tag }} [${{ inputs.dispatch_nonce }}]

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing Bifrost release tag
        required: true
        type: string
      release_version:
        description: Version bound to the release tag
        required: true
        type: string
      release_commit:
        description: Exact commit selected by the release tag
        required: true
        type: string
      qualification_run_id:
        description: Readiness run containing the immutable bundle
        required: true
        type: string
      qualification_run_attempt:
        description: Readiness run attempt recorded in the manifest
        required: true
        type: string
      qualification_artifact_id:
        description: Exact readiness artifact ID
        required: true
        type: string
      qualification_artifact_digest:
        description: Exact readiness artifact digest
        required: true
        type: string
      qualification_manifest_sha256:
        description: SHA-256 of the qualification manifest
        required: true
        type: string
      dispatch_nonce:
        description: Parent release run identity used for deterministic correlation
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-npm-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish exact qualified npm archives
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: npm-publish
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_VERSION: ${{ inputs.release_version }}
      RELEASE_COMMIT: ${{ inputs.release_commit }}
      QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
      QUALIFICATION_RUN_ATTEMPT: ${{ inputs.qualification_run_attempt }}
      QUALIFICATION_ARTIFACT_ID: ${{ inputs.qualification_artifact_id }}
      QUALIFICATION_ARTIFACT_DIGEST: ${{ inputs.qualification_artifact_digest }}
      QUALIFICATION_MANIFEST_SHA256: ${{ inputs.qualification_manifest_sha256 }}
    steps:
      - name: Checkout exact npm publication scripts
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ inputs.release_commit }}

      - name: Set up Node for trusted npm publishing
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify release tag still selects the exact commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          tag_ref="refs/tags/$RELEASE_TAG"
          remote_refs="$(git ls-remote --tags origin "${tag_ref}*")"
          actual_commit="$(awk -v tag_ref="$tag_ref" '
            $2 == (tag_ref "^{}") { print $1; found = 1; exit }
            $2 == tag_ref { fallback = $1 }
            END { if (!found && fallback) print fallback }
          ' <<< "$remote_refs")"
          test "$actual_commit" = "$RELEASE_COMMIT"

      - name: Confirm readiness artifact identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${QUALIFICATION_ARTIFACT_ID}" > "$RUNNER_TEMP/qualification-artifact.json"
          jq -e --arg name "release-qualification-${RELEASE_COMMIT}-v${RELEASE_VERSION}" \
            --arg digest "$QUALIFICATION_ARTIFACT_DIGEST" \
            '.name == $name and .digest == $digest and .expired == false' \
            "$RUNNER_TEMP/qualification-artifact.json" >/dev/null

      - name: Download exact qualification artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ inputs.qualification_artifact_id }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.qualification_run_id }}
          github-token: ${{ github.token }}
          path: qualification
          merge-multiple: true

      - name: Verify every qualified byte and identity
        run: >-
          node scripts/verify-qualified-release.mjs verify
          --bundle qualification
          --manifest qualification/release-qualification.json
          --repository "$GITHUB_REPOSITORY"
          --commit "$RELEASE_COMMIT"
          --version "$RELEASE_VERSION"
          --run-id "$QUALIFICATION_RUN_ID"
          --run-attempt "$QUALIFICATION_RUN_ATTEMPT"
          --manifest-sha256 "$QUALIFICATION_MANIFEST_SHA256"

      - name: Stage exact qualified npm archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/npm-qualified"
          mapfile -t files < <(jq -r '.files[] | select(.path | startswith("brokkai-bifrost-") and endswith(".tgz")) | .path' qualification/release-qualification.json)
          test "${#files[@]}" -eq 8
          for file in "${files[@]}"; do cp "qualification/$file" "$RUNNER_TEMP/npm-qualified/"; done

      - name: Install npm trusted-publishing client
        run: npm install --global npm@11.19.0

      - name: Reject existing npm versions with a different qualified checksum
        shell: bash
        run: |
          set -euo pipefail
          for tarball in "$RUNNER_TEMP"/npm-qualified/*.tgz; do
            package="$(tar -xzOf "$tarball" package/package.json | jq -r '.name')"
            version="$(tar -xzOf "$tarball" package/package.json | jq -r '.version')"
            local_sha1="$(sha1sum "$tarball" | awk '{print $1}')"
            if published_json="$(npm view "${package}@${version}" dist.shasum --json 2>/dev/null)"; then
              published_sha1="$(jq -r 'if type == "string" then . else empty end' <<< "$published_json")"
              test -n "$published_sha1"
              test "$published_sha1" = "$local_sha1"
            fi
          done

      - name: Publish qualified archives without packaging
        env:
          # Keep npm on its OIDC trusted-publishing path. setup-node's
          # registry-url option writes a classic token entry to .npmrc,
          # which makes npm report a misleading 404 for OIDC publishes.
          NODE_AUTH_TOKEN: ""
          NPM_CONFIG_PROVENANCE: "true"
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          unset NODE_AUTH_TOKEN
          test -z "${NODE_AUTH_TOKEN+x}"
          npm run publish-release --prefix npm -- \
            --dist "$RUNNER_TEMP/npm-qualified" \
            --release-tag "$RELEASE_TAG" \
            --yes-publish
