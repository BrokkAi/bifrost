name: Publish crate

on:
  workflow_call:
    inputs:
      tag:
        description: Validated release tag
        required: true
        type: string
      version:
        description: Validated Cargo package version
        required: true
        type: string
      commit:
        description: Immutable commit selected by the validated release tag
        required: true
        type: string
      package:
        description: Cargo package to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: cargo publish ${{ inputs.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_COMMIT: ${{ inputs.commit }}
      CRATE_PACKAGE: ${{ inputs.package }}
    steps:
      - name: Checkout validated source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ inputs.commit }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Confirm validated release identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          tag_ref="refs/tags/$RELEASE_TAG"
          remote_refs="$(git ls-remote --tags origin "${tag_ref}*")"
          actual_commit="$(awk -v tag_ref="$tag_ref" '
            $2 == (tag_ref "^{}") { print $1; found = 1; exit }
            $2 == tag_ref { fallback = $1 }
            END { if (!found && fallback) print fallback }
          ' <<< "$remote_refs")"
          test -n "$actual_commit"
          test "$actual_commit" = "$RELEASE_COMMIT"
          echo "Publishing $CRATE_PACKAGE from $RELEASE_TAG ($RELEASE_VERSION) at $RELEASE_COMMIT"

      - name: Package exact registry payload
        id: package
        shell: bash
        run: |
          cargo package --locked --no-verify --package "$CRATE_PACKAGE"
          archive="target/package/${CRATE_PACKAGE}-${RELEASE_VERSION}.crate"
          test -f "$archive"
          echo "checksum=$(sha256sum "$archive" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Check whether exact crate version is already published
        id: existing
        shell: bash
        env:
          EXPECTED_CHECKSUM: ${{ steps.package.outputs.checksum }}
        run: |
          set -euo pipefail
          endpoint="https://crates.io/api/v1/crates/${CRATE_PACKAGE}/${RELEASE_VERSION}"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          status="$(curl --silent --show-error --location --output "$response_file" --write-out '%{http_code}' --user-agent 'cargo/1.85.0' "$endpoint")"

          case "$status" in
            200)
              actual_checksum="$(jq -r '.version.checksum // empty' "$response_file")"
              test -n "$actual_checksum"
              if [[ "$actual_checksum" != "$EXPECTED_CHECKSUM" ]]; then
                echo "Registry checksum mismatch for existing ${CRATE_PACKAGE} ${RELEASE_VERSION}: expected ${EXPECTED_CHECKSUM}, got ${actual_checksum}" >&2
                exit 1
              fi
              echo "${CRATE_PACKAGE} ${RELEASE_VERSION} is already published with the expected checksum"
              echo "already-published=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "${CRATE_PACKAGE} ${RELEASE_VERSION} is not yet published"
              echo "already-published=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unexpected crates.io response ${status} while checking ${CRATE_PACKAGE} ${RELEASE_VERSION}" >&2
              cat "$response_file" >&2
              exit 1
              ;;
          esac

      - name: Authenticate to crates.io (trusted publishing)
        id: auth
        if: steps.existing.outputs.already-published != 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish
        if: steps.existing.outputs.already-published != 'true'
        run: cargo publish --locked --package "$CRATE_PACKAGE"
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Verify exact registry version and checksum
        shell: bash
        env:
          EXPECTED_CHECKSUM: ${{ steps.package.outputs.checksum }}
        run: |
          set -euo pipefail
          endpoint="https://crates.io/api/v1/crates/${CRATE_PACKAGE}/${RELEASE_VERSION}"
          max_attempts=30

          for ((attempt = 1; attempt <= max_attempts; attempt++)); do
            response="$(curl --fail --silent --show-error --user-agent 'cargo/1.85.0' "$endpoint" 2>/dev/null || true)"
            checksum="$(jq -r '.version.checksum // empty' <<<"$response")"
            if [[ -n "$checksum" ]]; then
              if [[ "$checksum" != "$EXPECTED_CHECKSUM" ]]; then
                echo "Registry checksum mismatch for ${CRATE_PACKAGE} ${RELEASE_VERSION}: expected ${EXPECTED_CHECKSUM}, got ${checksum}" >&2
                exit 1
              fi
              echo "Registry exposes ${CRATE_PACKAGE} ${RELEASE_VERSION} with checksum ${checksum}"
              exit 0
            fi

            if (( attempt < max_attempts )); then
              delay=$((attempt < 5 ? attempt * 2 : 10))
              echo "Waiting ${delay}s for crates.io to expose ${CRATE_PACKAGE} ${RELEASE_VERSION} (attempt ${attempt}/${max_attempts})"
              sleep "$delay"
            fi
          done

          echo "crates.io did not expose ${CRATE_PACKAGE} ${RELEASE_VERSION} within the bounded retry window" >&2
          exit 1
