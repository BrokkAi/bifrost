name: Publish crate

on:
  workflow_call:
    inputs:
      tag:
        description: Validated release tag
        required: true
        type: string
      version:
        description: Validated Cargo package version
        required: true
        type: string
      commit:
        description: Immutable commit selected by the validated release tag
        required: true
        type: string
      package:
        description: Cargo package to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: cargo publish ${{ inputs.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_COMMIT: ${{ inputs.commit }}
      CRATE_PACKAGE: ${{ inputs.package }}
    steps:
      - name: Checkout validated source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ inputs.commit }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Confirm validated release identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          tag_ref="refs/tags/$RELEASE_TAG"
          remote_refs="$(git ls-remote --tags origin "${tag_ref}*")"
          actual_commit="$(awk -v tag_ref="$tag_ref" '
            $2 == (tag_ref "^{}") { print $1; found = 1; exit }
            $2 == tag_ref { fallback = $1 }
            END { if (!found && fallback) print fallback }
          ' <<< "$remote_refs")"
          test -n "$actual_commit"
          test "$actual_commit" = "$RELEASE_COMMIT"
          echo "Publishing $CRATE_PACKAGE from $RELEASE_TAG ($RELEASE_VERSION) at $RELEASE_COMMIT"

      - name: Package exact registry payload
        id: package
        shell: bash
        run: |
          cargo package --locked --no-verify --package "$CRATE_PACKAGE"
          archive="target/package/${CRATE_PACKAGE}-${RELEASE_VERSION}.crate"
          test -f "$archive"
          echo "checksum=$(sha256sum "$archive" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Authenticate to crates.io (trusted publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish
        run: cargo publish --locked --package "$CRATE_PACKAGE"
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Verify exact registry version and checksum
        run: >
          bash scripts/wait-for-crate-version.sh
          "$CRATE_PACKAGE"
          "$RELEASE_VERSION"
          "${{ steps.package.outputs.checksum }}"
