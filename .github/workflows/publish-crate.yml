name: Publish crate

on:
  workflow_call:
    inputs:
      tag:
        description: Validated release tag
        required: true
        type: string
      version:
        description: Validated Cargo package version
        required: true
        type: string
      commit:
        description: Immutable commit selected by the validated release tag
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout validated source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ inputs.commit }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Confirm validated release identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ inputs.commit }}"
          bash scripts/verify-release-tag-commit.sh "${{ inputs.tag }}" "${{ inputs.commit }}"
          echo "Publishing ${{ inputs.tag }} (${{ inputs.version }}) from ${{ inputs.commit }}"

      - name: Authenticate to crates.io (trusted publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
