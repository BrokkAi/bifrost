name: CI

on:
  push:
    branches: [master]
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-impact:
    name: ci impact
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      schema_version: ${{ steps.classify.outputs.schema_version }}
      mode: ${{ steps.classify.outputs.mode }}
      selected: ${{ steps.classify.outputs.selected }}
      dependency_licenses: ${{ steps.classify.outputs.dependency_licenses }}
      crate_package: ${{ steps.classify.outputs.crate_package }}
      agent_plugin: ${{ steps.classify.outputs.agent_plugin }}
      external_fixture: ${{ steps.classify.outputs.external_fixture }}
      vscode: ${{ steps.classify.outputs.vscode }}
      pi_package: ${{ steps.classify.outputs.pi_package }}
      rust: ${{ steps.classify.outputs.rust }}
      python: ${{ steps.classify.outputs.python }}
      rql_runtime: ${{ steps.classify.outputs.rql_runtime }}
      mcp_contract: ${{ steps.classify.outputs.mcp_contract }}
      lsp_contract: ${{ steps.classify.outputs.lsp_contract }}
      policy_pack: ${{ steps.classify.outputs.policy_pack }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify validation impact
        id: classify
        env:
          CI_IMPACT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          node scripts/ci-impact.mjs
          --event "$GITHUB_EVENT_NAME"
          --ref "$GITHUB_REF"
          --base "$CI_IMPACT_BASE_SHA"
          --head "$GITHUB_SHA"
          --output "$GITHUB_OUTPUT"
          --summary "$GITHUB_STEP_SUMMARY"

  quick-policy:
    name: quick policy
    needs: ci-impact
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: 0.11.31
          checksum: 8cc1cd82d434ec565376f98bd938d4b715b5791a80ff2d3aa78821cf85091b4b
          enable-cache: false
        timeout-minutes: 2

      - name: Audit GitHub Actions
        run: node scripts/ci-timing.mjs --label quick-policy-actions-audit -- bash scripts/check-github-actions-security.sh
        timeout-minutes: 2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.0
          components: rustfmt

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Check formatting
        run: node scripts/ci-timing.mjs --label quick-policy-format -- cargo fmt --check

      - name: Test repository policy
        run: >-
          node scripts/ci-timing.mjs --label quick-policy-node-tests -- node --test
          scripts/check-workspace-dependencies.test.mjs scripts/ci-impact.test.mjs scripts/ci-timing.test.mjs scripts/ci-impact-workflow.test.mjs
          scripts/github-actions-policy.test.mjs scripts/release-promotion-workflow.test.mjs scripts/release-version.test.mjs
          plugins/bifrost-agent/test/sync-release-version.test.mjs npm/test/*.test.mjs

      - name: Check release metadata projections
        run: node scripts/ci-timing.mjs --label quick-policy-release-metadata -- node scripts/release-version.mjs check

  lint:
    name: lint
    needs: [ci-impact, quick-policy]
    if: needs.ci-impact.outputs.mode != 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.0
          components: clippy

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: lint-all-features

      - name: Cargo clippy
        run: node scripts/ci-timing.mjs --label lint-all-features -- cargo clippy --all-targets --all-features -- -D warnings

      # Unused-dependency gate (#1733). cargo-machete is a manifest + source
      # scan, so it needs no compilation; the rust-cache step above keeps the
      # installed binary, making the install a no-op on warm caches.
      - name: Install pinned cargo-machete
        run: node scripts/ci-timing.mjs --label lint-machete-install -- cargo install --locked cargo-machete --version 0.9.2

      - name: Check unused dependencies
        run: node scripts/ci-timing.mjs --label lint-unused-dependencies -- cargo machete

  pinned-jvm-semantic-packs:
    name: pinned JVM semantic-pack bundle
    needs: [ci-impact, quick-policy, lint]
    if: needs.ci-impact.outputs.mode != 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.0

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: pinned-jvm-semantic-packs

      - name: Generate and verify pinned JVM semantic packs
        run: >-
          node scripts/ci-timing.mjs --label pinned-jvm-semantic-packs --
          bash scripts/build-pinned-jvm-semantic-packs.sh
          "${RUNNER_TEMP}/bifrost-semantic-packs" "${RUNNER_TEMP}"

  dependency-licenses:
    name: dependency licenses
    needs: [ci-impact, quick-policy, lint]
    if: needs.ci-impact.outputs.dependency_licenses == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Install pinned license tools
        run: >-
          node scripts/ci-timing.mjs --label dependency-license-install -- bash -lc
          'cargo install --locked cargo-about --version 0.9.1 --features cli && cargo install --locked cargo-deny --version 0.20.2'

      - name: Check all-feature license policy
        run: node scripts/ci-timing.mjs --label dependency-license-check -- cargo deny --config licenses/deny.toml --locked check licenses

      - name: Generate Rust notice report
        run: >-
          node scripts/ci-timing.mjs --label dependency-notice-report -- bash -lc
          'scripts/generate-rust-third-party-notices.sh /tmp/THIRD_PARTY_LICENSES.html && node scripts/generate-supplemental-third-party-notices.mjs /tmp/SUPPLEMENTAL_THIRD_PARTY_NOTICES.txt && cmp licenses/SUPPLEMENTAL_THIRD_PARTY_NOTICES.txt /tmp/SUPPLEMENTAL_THIRD_PARTY_NOTICES.txt'

  crate-package:
    name: crate package
    needs: [ci-impact, quick-policy, lint]
    if: needs.ci-impact.outputs.crate_package == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.0

      - name: Check publishable workspace package set
        run: node scripts/ci-timing.mjs --label crate-package -- bash scripts/check-workspace-packages.sh

  rql-runtime:
    name: RQL runtime
    needs: [ci-impact, quick-policy, lint]
    if: needs.ci-impact.outputs.rql_runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.0

      - name: Run RQL runtime tests
        run: >-
          node scripts/ci-timing.mjs --label rql-runtime -- cargo test
          -p brokk-bifrost-runtime --all-features

      - name: Run structural query contract tests
        run: >-
          node scripts/ci-timing.mjs --label structural-query-contract -- cargo test
          --features nlp,python --test suite_cross_language --
          structural_search_cross_language::
          structural_search_planner:: structural_search_python::

  mcp-contract:
    name: MCP contract (${{ matrix.host }})
    needs: [ci-impact, quick-policy, lint]
    if: needs.ci-impact.outputs.mcp_contract == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: rmcp
            selector: 'on'
          - host: legacy rollback
            selector: 'off'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.0

      - name: Run MCP contract tests
        env:
          BIFROST_MCP_RMCP: ${{ matrix.selector }}
        run: node scripts/ci-timing.mjs --label mcp-contract -- cargo test -p brokk-bifrost-mcp --features nlp

  analysis-unit:
    # The workspace sets default-members = ["."], so the main rust job's bare
    # `cargo test` runs only the facade package: no other job executes the
    # analysis crate's unit tests or doctests, which let broken unit tests
    # ride green CI (#1440 broke two cpp dispatch pins, the v0.8.18 release
    # staled a scala epoch pin, and a kotlin doctest never compiled). This
    # job is that missing gate. No --target on purpose: cargo skips doctests
    # when --target is passed.
    name: Analysis, policy, and nlp unit tests
    needs: [ci-impact, quick-policy, lint]
    if: needs.ci-impact.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.0

      # core was peeled out of the analysis crate in #1549 and carries the model
      # layer's unit tests with it.
      - name: Run core unit tests
        run: node scripts/ci-timing.mjs --label core-unit -- cargo test -p brokk-bifrost-core --lib

      - name: Run analysis unit tests
        run: node scripts/ci-timing.mjs --label analysis-unit -- cargo test -p brokk-bifrost-analysis --lib

      - name: Run analysis doctests
        run: node scripts/ci-timing.mjs --label analysis-doc -- cargo test -p brokk-bifrost-analysis --doc

      # policy and nlp were peeled out of the analysis crate in #1548. They
      # carry their own unit tests and would otherwise inherit exactly the
      # blind spot this job exists to close.
      - name: Run policy unit tests
        run: node scripts/ci-timing.mjs --label policy-unit -- cargo test -p brokk-bifrost-policy --lib

      - name: Run policy doctests
        run: node scripts/ci-timing.mjs --label policy-doc -- cargo test -p brokk-bifrost-policy --doc

      # The sidecar spawn tests exec `uv run`, so the runner needs uv on PATH.
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: 0.11.31
          checksum: 8cc1cd82d434ec565376f98bd938d4b715b5791a80ff2d3aa78821cf85091b4b
          enable-cache: false

      - name: Run nlp unit tests
        env:
          BIFROST_SEMANTIC_INDEX: 'off'
        run: node scripts/ci-timing.mjs --label nlp-unit -- cargo test -p brokk-bifrost-nlp --lib

  lsp-contract:
    name: LSP contract
    needs: [ci-impact, quick-policy, lint]
    if: needs.ci-impact.outputs.lsp_contract == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.0

      - name: Run LSP contract tests
        run: node scripts/ci-timing.mjs --label lsp-contract -- cargo test -p brokk-bifrost-lsp --all-features

  policy-pack:
    name: policy pack
    needs: [ci-impact, quick-policy, lint]
    if: needs.ci-impact.outputs.policy_pack == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.0

      - name: Run policy-pack tests
        run: >-
          node scripts/ci-timing.mjs --label policy-pack -- cargo test --features nlp,python
          --test suite_bench_policy --
          builtin_policy_pack:: bifrost_policy_cli:: policy_loading::
          policy_loading_workspace:: policy_match_evaluation:: policy_rendering::
          policy_sarif_rendering:: policy_source::

  agent-plugin:
    name: agent plugin (${{ matrix.os }})
    needs: [ci-impact, quick-policy]
    if: needs.ci-impact.outputs.agent_plugin == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Test launcher
        run: node scripts/ci-timing.mjs --label agent-plugin-launcher -- node --test plugins/bifrost-agent/test/launcher.test.mjs

      - name: Validate manifests
        run: node scripts/ci-timing.mjs --label agent-plugin-manifests -- node scripts/check-codex-plugin-manifest.mjs

  external-fixture:
    name: ${{ matrix.name }} fixture provenance
    needs: [ci-impact, quick-policy, lint]
    if: needs.ci-impact.outputs.external_fixture == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - fixture: csharp
            name: C# external
          - fixture: java
            name: Java class
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up .NET
        if: matrix.fixture == 'csharp'
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 8.0.418

      - name: Set up Java
        if: matrix.fixture == 'java'
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21.0.8+9.0.LTS'

      - name: Rebuild and verify C# external fixture
        if: matrix.fixture == 'csharp'
        run: node scripts/ci-timing.mjs --label csharp-fixture -- bash scripts/verify-csharp-external-fixture.sh

      - name: Rebuild and verify Java class fixture
        if: matrix.fixture == 'java'
        run: node scripts/ci-timing.mjs --label java-fixture -- bash scripts/verify-java-class-fixture.sh

  vscode:
    name: vscode
    needs: [ci-impact, quick-policy]
    if: needs.ci-impact.outputs.vscode == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install extension dependencies
        run: node ../../scripts/ci-timing.mjs --label vscode-install -- npm ci
        working-directory: editors/vscode

      - name: Check extension
        run: node ../../scripts/ci-timing.mjs --label vscode-test -- npm test
        working-directory: editors/vscode

      - name: Package and inspect extension notices
        shell: bash
        working-directory: editors/vscode
        run: >-
          node ../../scripts/ci-timing.mjs --label vscode-package -- bash -lc
          'npx --no-install vsce package --out /tmp/bifrost-ci.vsix && unzip -Z1 /tmp/bifrost-ci.vsix > /tmp/bifrost-vsix-files.txt && grep -Fx "extension/LICENSE.md" /tmp/bifrost-vsix-files.txt && grep -Fx "extension/GPL-3.0.md" /tmp/bifrost-vsix-files.txt && grep -Fx "extension/SOURCE.md" /tmp/bifrost-vsix-files.txt && grep -Fx "extension/THIRD_PARTY_LICENSES.txt" /tmp/bifrost-vsix-files.txt'

  pi-package:
    name: Pi package (${{ matrix.os }})
    needs: [ci-impact, quick-policy]
    if: needs.ci-impact.outputs.pi_package == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugins/bifrost-agent/package-lock.json

      - name: Install package dependencies
        run: node ../../scripts/ci-timing.mjs --label pi-install -- npm ci
        working-directory: plugins/bifrost-agent

      - name: Check package
        run: node ../../scripts/ci-timing.mjs --label pi-check -- npm run check
        working-directory: plugins/bifrost-agent

      - name: Test package
        run: node ../../scripts/ci-timing.mjs --label pi-test -- npm test
        working-directory: plugins/bifrost-agent

      - name: Test packed package install
        run: node ../../scripts/ci-timing.mjs --label pi-packed-install -- npm run test:packed
        working-directory: plugins/bifrost-agent

      - name: Validate shared plugin manifests
        run: node scripts/ci-timing.mjs --label pi-manifests -- node scripts/check-codex-plugin-manifest.mjs

  rust:
    name: rust (${{ matrix.target }})
    needs: [ci-impact, quick-policy, lint]
    if: needs.ci-impact.outputs.rust == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
      ANDROID_API: '21'
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            can-test: true
            rustflags: '-C linker-features=-lld'
            test-args: '--jobs 1'
            cargo-flags: '--features nlp'
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            can-test: true
            rustflags: ''
            test-args: ''
            cargo-flags: '--features nlp'
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            can-test: true
            rustflags: ''
            test-args: ''
            cargo-flags: '--features nlp'
          - target: aarch64-pc-windows-msvc
            runner: windows-latest
            can-test: false
            rustflags: ''
            test-args: ''
            cargo-flags: '--features nlp'
          - target: aarch64-linux-android
            runner: ubuntu-latest
            can-test: false
            rustflags: ''
            test-args: ''
            cargo-flags: ''
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android NDK
        if: matrix.target == 'aarch64-linux-android'
        id: setup-ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        with:
          ndk-version: r27d
          add-to-path: false

      - name: Configure Android toolchain
        if: matrix.target == 'aarch64-linux-android'
        shell: bash
        run: |
          toolchain_bin="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          api="${ANDROID_API}"
          {
            echo "CC_aarch64_linux_android=${toolchain_bin}/aarch64-linux-android${api}-clang"
            echo "CXX_aarch64_linux_android=${toolchain_bin}/aarch64-linux-android${api}-clang++"
            echo "AR_aarch64_linux_android=${toolchain_bin}/llvm-ar"
            echo "RANLIB_aarch64_linux_android=${toolchain_bin}/llvm-ranlib"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${toolchain_bin}/aarch64-linux-android${api}-clang"
          } >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.0
          components: clippy
          targets: ${{ matrix.target }}

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.target }}

      - name: Cargo clippy
        run: >-
          node scripts/ci-timing.mjs --label rust-clippy-${{ matrix.target }} -- cargo clippy --all-targets
          ${{ matrix.cargo-flags }} --target ${{ matrix.target }} -- -D warnings

      - name: Install uv
        if: matrix.can-test
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: 0.11.31
          python-version: '3.12'
          enable-cache: false

      - name: Cargo test
        if: matrix.can-test
        run: >-
          node scripts/ci-timing.mjs --label rust-test-${{ matrix.target }} -- cargo test --target
          ${{ matrix.target }} ${{ matrix.cargo-flags }} ${{ matrix.test-args }}

      - name: Semantic pack distribution tests
        if: matrix.can-test
        run: >-
          node scripts/ci-timing.mjs --label semantic-pack-test-${{ matrix.target }} -- cargo test
          -p brokk-bifrost-semantic-packs --target ${{ matrix.target }} ${{ matrix.test-args }}

  python:
    name: python (${{ matrix.target }})
    needs: [ci-impact, quick-policy, lint]
    if: needs.ci-impact.outputs.python == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            rustflags: ''
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            rustflags: ''
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            rustflags: ''
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.target }}

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: python-${{ matrix.target }}

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: 0.11.31
          python-version: '3.12'

      - name: Run Python tests
        run: node scripts/ci-timing.mjs --label python-${{ matrix.target }} -- bash scripts/test_python.sh

  pr-verification:
    name: PR verification
    if: ${{ always() && !cancelled() }}
    needs:
      - ci-impact
      - quick-policy
      - lint
      - dependency-licenses
      - crate-package
      - rql-runtime
      - mcp-contract
      - lsp-contract
      - policy-pack
      - agent-plugin
      - external-fixture
      - vscode
      - pi-package
      - rust
      - python
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI_IMPACT_RESULT: ${{ needs.ci-impact.result }}
      QUICK_POLICY_RESULT: ${{ needs.quick-policy.result }}
      LINT_SELECTED: ${{ needs.ci-impact.outputs.mode != 'docs' }}
      LINT_RESULT: ${{ needs.lint.result }}
      DEPENDENCY_LICENSES_SELECTED: ${{ needs.ci-impact.outputs.dependency_licenses }}
      DEPENDENCY_LICENSES_RESULT: ${{ needs.dependency-licenses.result }}
      CRATE_PACKAGE_SELECTED: ${{ needs.ci-impact.outputs.crate_package }}
      CRATE_PACKAGE_RESULT: ${{ needs.crate-package.result }}
      RQL_RUNTIME_SELECTED: ${{ needs.ci-impact.outputs.rql_runtime }}
      RQL_RUNTIME_RESULT: ${{ needs.rql-runtime.result }}
      MCP_CONTRACT_SELECTED: ${{ needs.ci-impact.outputs.mcp_contract }}
      MCP_CONTRACT_RESULT: ${{ needs.mcp-contract.result }}
      LSP_CONTRACT_SELECTED: ${{ needs.ci-impact.outputs.lsp_contract }}
      LSP_CONTRACT_RESULT: ${{ needs.lsp-contract.result }}
      POLICY_PACK_SELECTED: ${{ needs.ci-impact.outputs.policy_pack }}
      POLICY_PACK_RESULT: ${{ needs.policy-pack.result }}
      AGENT_PLUGIN_SELECTED: ${{ needs.ci-impact.outputs.agent_plugin }}
      AGENT_PLUGIN_RESULT: ${{ needs.agent-plugin.result }}
      EXTERNAL_FIXTURE_SELECTED: ${{ needs.ci-impact.outputs.external_fixture }}
      EXTERNAL_FIXTURE_RESULT: ${{ needs.external-fixture.result }}
      VSCODE_SELECTED: ${{ needs.ci-impact.outputs.vscode }}
      VSCODE_RESULT: ${{ needs.vscode.result }}
      PI_PACKAGE_SELECTED: ${{ needs.ci-impact.outputs.pi_package }}
      PI_PACKAGE_RESULT: ${{ needs.pi-package.result }}
      RUST_SELECTED: ${{ needs.ci-impact.outputs.rust }}
      RUST_RESULT: ${{ needs.rust.result }}
      PYTHON_SELECTED: ${{ needs.ci-impact.outputs.python }}
      PYTHON_RESULT: ${{ needs.python.result }}
      SCHEMA_VERSION: ${{ needs.ci-impact.outputs.schema_version }}
      MODE: ${{ needs.ci-impact.outputs.mode }}
      SELECTED: ${{ needs.ci-impact.outputs.selected }}
    steps:
      - name: Verify selected validation
        shell: bash
        run: |
          set -euo pipefail
          failures=0

          check_result() {
            local name="$1"
            local selected="$2"
            local result="$3"
            printf '| %s | %s | %s |\n' "$name" "$selected" "$result" >> "$GITHUB_STEP_SUMMARY"
            if [ "$selected" = "true" ] && [ "$result" != "success" ]; then
              echo "selected check $name finished as $result" >&2
              failures=1
            fi
          }

          {
            echo '## PR verification'
            echo
            echo "Schema version: \`${SCHEMA_VERSION:-unavailable}\`  "
            echo "Selection mode: \`${MODE:-unavailable}\`  "
            echo "Selected components: \`${SELECTED:-unavailable}\`"
            echo
            echo '| Check | Selected | Result |'
            echo '| --- | --- | --- |'
          } >> "$GITHUB_STEP_SUMMARY"

          check_result 'ci impact' true "$CI_IMPACT_RESULT"
          check_result 'quick policy' true "$QUICK_POLICY_RESULT"
          check_result 'lint' "$LINT_SELECTED" "$LINT_RESULT"
          check_result 'dependency licenses' "$DEPENDENCY_LICENSES_SELECTED" "$DEPENDENCY_LICENSES_RESULT"
          check_result 'crate package' "$CRATE_PACKAGE_SELECTED" "$CRATE_PACKAGE_RESULT"
          check_result 'RQL runtime' "$RQL_RUNTIME_SELECTED" "$RQL_RUNTIME_RESULT"
          check_result 'MCP contract' "$MCP_CONTRACT_SELECTED" "$MCP_CONTRACT_RESULT"
          check_result 'LSP contract' "$LSP_CONTRACT_SELECTED" "$LSP_CONTRACT_RESULT"
          check_result 'policy pack' "$POLICY_PACK_SELECTED" "$POLICY_PACK_RESULT"
          check_result 'agent plugin' "$AGENT_PLUGIN_SELECTED" "$AGENT_PLUGIN_RESULT"
          check_result 'external fixture' "$EXTERNAL_FIXTURE_SELECTED" "$EXTERNAL_FIXTURE_RESULT"
          check_result 'VS Code' "$VSCODE_SELECTED" "$VSCODE_RESULT"
          check_result 'Pi package' "$PI_PACKAGE_SELECTED" "$PI_PACKAGE_RESULT"
          check_result 'Rust matrix' "$RUST_SELECTED" "$RUST_RESULT"
          check_result 'Python matrix' "$PYTHON_SELECTED" "$PYTHON_RESULT"

          exit "$failures"
