name: Public CI

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.96.0
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace metadata
        run: cargo metadata --locked --no-deps --format-version 1

      - name: Run source-owned unit tests
        run: cargo test --workspace --lib --locked

      - name: Run public doctests
        run: cargo test --workspace --doc --locked

      - name: Check release metadata
        run: node scripts/release-version.mjs check

      # Before v0.10.0, add deliberately small public CLI, MCP, LSP, and
      # embedded semantic-pack contract smokes. Do not copy the private
      # assurance corpus to satisfy this gate.
