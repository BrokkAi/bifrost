name: Public CI

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-doctests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Exact public compilation passed on 16 GiB with two compiler jobs.
    # Bound overlapping rustc/link processes; test scheduling stays unchanged.
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Cache public Rust dependencies
        id: rust-cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: public-source-contract-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.cargo/config.toml', '.config/**', '.github/workflows/ci.yml') }}
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST ImageOS ImageVersion
          cache-bin: false
          cache-workspace-crates: false
          cache-on-failure: false
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Record dependency cache and initial runner storage
        run: |
          echo "dependency-cache-hit=${{ steps.rust-cache.outputs.cache-hit }}"
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          free -b

      - name: Install uv for source-owned sidecar tests
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace metadata
        run: cargo metadata --locked --no-deps --format-version 1

      - name: Run source-owned unit tests
        env:
          JAVA_HOME: ''
        run: /usr/bin/time -v cargo test --workspace --lib --locked

      - name: Record runner storage after unit tests
        if: always()
        run: df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"

      - name: Run public doctests
        run: /usr/bin/time -v cargo test --workspace --doc --locked

      - name: Record runner storage after doctests
        if: always()
        run: df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"

  mcp-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Exact public compilation passed on 16 GiB with two compiler jobs.
    # Bound overlapping rustc/link processes; test scheduling stays unchanged.
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Cache public Rust dependencies
        id: rust-cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: public-source-contract-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.cargo/config.toml', '.config/**', '.github/workflows/ci.yml') }}
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST ImageOS ImageVersion
          cache-bin: false
          cache-workspace-crates: false
          cache-on-failure: false
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Record dependency cache and initial runner storage
        run: |
          echo "dependency-cache-hit=${{ steps.rust-cache.outputs.cache-hit }}"
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          free -b

      - name: Install uv for MCP sidecar tests
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Run MCP binary and integration contract tests
        env:
          JAVA_HOME: ''
        # Workspace libraries run in unit-doctests. Select every MCP binary and
        # integration target here, in one invocation with one feature graph.
        run: |
          python3 - <<'PYTEST'
          import json
          import subprocess

          metadata = json.loads(subprocess.check_output([
              'cargo', 'metadata', '--locked', '--no-deps', '--format-version', '1',
          ]))
          mcp = next(p for p in metadata['packages'] if p['name'] == 'brokk-bifrost-mcp')
          command = ['/usr/bin/time', '-v', 'cargo', 'test', '--workspace', '--locked']
          targets = []
          for target in mcp['targets']:
              kind = target['kind']
              assert kind in [['lib'], ['bin'], ['test']], f'Unreviewed MCP target: {target}'
              if target['test'] and kind in [['bin'], ['test']]:
                  command.extend(['--bin' if kind == ['bin'] else '--test', target['name']])
                  targets.append(target['name'])
          assert targets, f'Missing MCP binary and integration targets: {mcp}'
          print(f'MCP contract targets: {targets}', flush=True)
          subprocess.run(command, check=True)
          PYTEST

      - name: Record runner storage after MCP tests
        if: always()
        run: df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Install MCP conformance harness
        run: npm ci --prefix crates/bifrost-mcp/tests/conformance

      - name: Run MCP conformance harness
        env:
          BIFROST_MCP_SERVER_BIN: ${{ github.workspace }}/target/debug/bifrost-mcp-test-server
        run: node crates/bifrost-mcp/tests/conformance/run.mjs --ci

      - name: Check release metadata
        run: node scripts/public/release-version.mjs check

      # The published MCP and LSP suites plus the conformance gate above now
      # cover those two protocol surfaces. Before v0.10.0, add deliberately
      # small public CLI and embedded semantic-pack contract smokes. Do not
      # copy the private assurance corpus to satisfy this gate.

  source-contract:
    needs: [unit-doctests, mcp-contract]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every public source check
        env:
          UNIT_RESULT: ${{ needs.unit-doctests.result }}
          MCP_RESULT: ${{ needs.mcp-contract.result }}
        run: |
          test "$UNIT_RESULT" = success
          test "$MCP_RESULT" = success
