name: Build release wheels

on:
  workflow_call:
    inputs:
      tag:
        description: Validated release tag
        required: true
        type: string
      version:
        description: Validated package version
        required: true
        type: string
      commit:
        description: Immutable commit selected by the validated release tag
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            kind: linux
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            kind: linux
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            kind: macos
          - target: aarch64-apple-darwin
            runner: macos-latest
            kind: macos
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            kind: windows
    steps:
      - name: Checkout validated source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ inputs.commit }}

      - name: Download Rust notice report
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: rust-third-party-licenses
          path: licenses

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.kind == 'linux' && '2014' || 'auto' }}
          args: --release --locked --out dist
          rust-toolchain: '1.96.0'

      - name: Upload wheel artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: build sdist
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout validated source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ inputs.commit }}

      - name: Download Rust notice report
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: rust-third-party-licenses
          path: licenses

      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  verify:
    name: verify wheel and sdist versions
    needs: [build, sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Download source distribution
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: sdist
          path: dist

      - name: Verify built artifacts carry the tagged version
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          shopt -s nullglob
          artifacts=(dist/*.whl dist/*.tar.gz)
          if [ ${#artifacts[@]} -eq 0 ]; then
            echo "No artifacts found in dist/" >&2
            exit 1
          fi
          bad=0
          for f in "${artifacts[@]}"; do
            case "$(basename "$f")" in
              *-"${EXPECTED_VERSION}"-*|*-"${EXPECTED_VERSION}".tar.gz) ;;
              *) echo "Artifact $(basename "$f") does not carry version $EXPECTED_VERSION" >&2; bad=1 ;;
            esac
          done
          [ "$bad" -eq 0 ] || exit 1
          echo "All ${#artifacts[@]} artifacts carry version $EXPECTED_VERSION"
