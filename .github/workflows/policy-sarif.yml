name: Policy and code-quality analysis

on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
  pull_request:
    paths-ignore:
      - 'docs/**'

permissions:
  contents: read
  security-events: write

concurrency:
  group: policy-sarif-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Bifrost policy and code-quality analysis
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    # A cold release-mode repository scan is primarily serial. Cache-invalidating
    # analyzer changes can require both sides of the PR diff to be rebuilt, so
    # keep enough wall-clock budget for the complete report and fail closed on
    # any incomplete analysis or finding-gate failure.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1

      - name: Cache Bifrost build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: policy-sarif
          cache-on-failure: true

      # rust-cache deliberately excludes workspace crates, so an exact cache
      # hit still recompiles both Bifrost binaries. Cache the final executables
      # separately under the repository's canonical compiled-input identity.
      - name: Resolve compiled-input identity
        id: compiled-inputs
        shell: bash
        run: |
          set -euo pipefail
          identity=$(git log -1 --format=%H -- \
            src crates resources Cargo.toml Cargo.lock build.rs \
            rust-toolchain.toml .cargo/config.toml)
          if [[ ! "${identity}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Unable to resolve the Bifrost compiled-input identity"
            exit 1
          fi
          echo "identity=${identity}" >> "${GITHUB_OUTPUT}"

      - name: Restore exact policy binaries
        id: policy-binaries
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/release/bifrost
            target/release/bifrost-semantic-pack
          key: bifrost-policy-binaries-v1-${{ runner.os }}-${{ runner.arch }}-rust-1.97.1-${{ steps.compiled-inputs.outputs.identity }}

      - name: Verify restored policy binaries
        if: steps.policy-binaries.outputs.cache-hit == 'true'
        shell: bash
        env:
          EXPECTED_IDENTITY: ${{ steps.compiled-inputs.outputs.identity }}
        run: |
          set -euo pipefail
          test -x target/release/bifrost
          test -x target/release/bifrost-semantic-pack
          actual=$(target/release/bifrost --build-identity)
          if [ "${actual}" != "${EXPECTED_IDENTITY}" ]; then
            echo "::error::Restored Bifrost reports build identity ${actual}, expected ${EXPECTED_IDENTITY}"
            exit 1
          fi
          set +e
          semantic_pack_usage=$(target/release/bifrost-semantic-pack 2>&1)
          semantic_pack_status=$?
          set -e
          if [ "${semantic_pack_status}" -ne 2 ] || [[ "${semantic_pack_usage}" != "error: usage:"* ]]; then
            echo "::error::Restored semantic-pack tool did not report its expected usage contract"
            printf '%s\n' "${semantic_pack_usage}"
            exit 1
          fi

      # Build both binaries with one feature graph. Running Cargo again for the
      # pack generator rebuilt shared dependencies with release-tooling enabled.
      - name: Build the release policy runner and semantic-pack tool
        if: steps.policy-binaries.outputs.cache-hit != 'true'
        run: >-
          cargo build --locked --release --bin bifrost --bin bifrost-semantic-pack
          -p brokk-bifrost -p brokk-bifrost-semantic-packs
          --features brokk-bifrost-semantic-packs/release-tooling

      - name: Save exact policy binaries
        if: steps.policy-binaries.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/release/bifrost
            target/release/bifrost-semantic-pack
          key: bifrost-policy-binaries-v1-${{ runner.os }}-${{ runner.arch }}-rust-1.97.1-${{ steps.compiled-inputs.outputs.identity }}

      - name: Generate and install pinned Python semantic pack
        env:
          BIFROST_SEMANTIC_PACK_BIN: ${{ github.workspace }}/target/release/bifrost-semantic-pack
          CACHE_ROOT: ${{ runner.temp }}/bifrost-python-semantic-pack-cache
        run: |
          bash scripts/public/build-pinned-python-semantic-packs.sh \
            "${RUNNER_TEMP}/bifrost-semantic-packs-python" \
            "${RUNNER_TEMP}" \
            "$CACHE_ROOT"

      - name: Scan with the built-in pack
        uses: ./.github/actions/policy-scan
        env:
          BIFROST_SEMANTIC_PACK_CACHE_ROOT: ${{ runner.temp }}/bifrost-python-semantic-pack-cache
        with:
          version: local
          policy-timings: true
          artifact-name: bifrost-code-smells-report
          category: bifrost-code-smells
          diff-base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          # The private source repository does not have GitHub Code Security enabled.
          # The scan still gates here; the projected public repository uploads SARIF.
          upload: ${{ !github.event.repository.private }}
