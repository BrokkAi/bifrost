name: policy-sarif

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  security-events: write

concurrency:
  group: policy-sarif-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: bifrost code-smells scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Scan with the built-in pack
        uses: ./.github/actions/policy-scan
        with:
          version: v0.9.1
          category: bifrost-code-smells
          diff-base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
