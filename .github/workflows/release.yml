name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

env:
  BIN_NAME: bifrost
  ANDROID_API: '21'

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release-context:
    name: validate release context
    uses: ./.github/workflows/release-context.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    permissions:
      contents: read

  notices:
    name: generate Rust notices
    needs: release-context
    uses: ./.github/workflows/rust-notices.yml
    with:
      ref: ${{ needs.release-context.outputs.commit }}
    permissions:
      contents: read

  crate-package:
    name: verify workspace package contents
    needs: release-context
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout validated source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ needs.release-context.outputs.commit }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Verify packaged workspace contents
        run: bash scripts/check-workspace-packages.sh

  semantic-pack-bundle:
    name: generate pinned JVM semantic packs
    needs: release-context
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout validated source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ needs.release-context.outputs.commit }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Generate and verify semantic-pack bundle
        shell: bash
        run: bash scripts/build-pinned-jvm-semantic-packs.sh "${RUNNER_TEMP}/bifrost-semantic-packs" "${RUNNER_TEMP}"

      - name: Package semantic-pack bundle
        shell: bash
        run: |
          mkdir -p dist
          mv "${RUNNER_TEMP}/bifrost-semantic-packs/measurements.json" \
            "dist/bifrost-semantic-packs-${{ needs.release-context.outputs.tag }}-measurements.json"
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            -C "${RUNNER_TEMP}" -cf - bifrost-semantic-packs \
            | gzip -n > "dist/bifrost-semantic-packs-${{ needs.release-context.outputs.tag }}.tar.gz"
          cd dist
          sha256sum "bifrost-semantic-packs-${{ needs.release-context.outputs.tag }}.tar.gz" \
            > "bifrost-semantic-packs-${{ needs.release-context.outputs.tag }}.tar.gz.sha256"

      - name: Upload semantic-pack bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: bifrost-semantic-packs
          path: |
            dist/bifrost-semantic-packs-${{ needs.release-context.outputs.tag }}.tar.gz
            dist/bifrost-semantic-packs-${{ needs.release-context.outputs.tag }}.tar.gz.sha256
            dist/bifrost-semantic-packs-${{ needs.release-context.outputs.tag }}-measurements.json
          if-no-files-found: error

  build-wheels:
    name: build and verify release wheels
    needs: [release-context, notices]
    uses: ./.github/workflows/build-wheels.yml
    with:
      tag: ${{ needs.release-context.outputs.tag }}
      version: ${{ needs.release-context.outputs.version }}
      commit: ${{ needs.release-context.outputs.commit }}
    permissions:
      contents: read

  build:
    name: build (${{ matrix.target }})
    needs: [release-context, notices]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            rust_targets: "x86_64-unknown-linux-gnu"
            runner: ubuntu-latest
            archive: tar.gz
          - target: x86_64-unknown-linux-musl
            rust_targets: "x86_64-unknown-linux-musl"
            runner: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            rust_targets: "aarch64-unknown-linux-gnu"
            runner: ubuntu-24.04-arm
            archive: tar.gz
          - target: aarch64-linux-android
            rust_targets: "aarch64-linux-android"
            runner: ubuntu-latest
            archive: tar.gz
          - target: universal-apple-darwin
            rust_targets: "x86_64-apple-darwin aarch64-apple-darwin"
            runner: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            rust_targets: "x86_64-pc-windows-msvc"
            runner: windows-latest
            archive: zip
          - target: aarch64-pc-windows-msvc
            rust_targets: "aarch64-pc-windows-msvc"
            runner: windows-latest
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ needs.release-context.outputs.commit }}

      - name: Download Rust notice report
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: rust-third-party-licenses
          path: licenses

      - name: Install Rust toolchain
        shell: bash
        run: rustup show

      - name: Install Rust targets
        shell: bash
        run: rustup target add ${{ matrix.rust_targets }}

      - name: Install musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y musl-tools

      - name: Set up Android NDK
        if: matrix.target == 'aarch64-linux-android'
        id: setup-ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        with:
          ndk-version: r27d
          add-to-path: false

      - name: Configure Android toolchain
        if: matrix.target == 'aarch64-linux-android'
        shell: bash
        run: |
          toolchain_bin="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          api="${ANDROID_API}"
          {
            echo "CC_aarch64_linux_android=${toolchain_bin}/aarch64-linux-android${api}-clang"
            echo "CXX_aarch64_linux_android=${toolchain_bin}/aarch64-linux-android${api}-clang++"
            echo "AR_aarch64_linux_android=${toolchain_bin}/llvm-ar"
            echo "RANLIB_aarch64_linux_android=${toolchain_bin}/llvm-ranlib"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${toolchain_bin}/aarch64-linux-android${api}-clang"
          } >> "$GITHUB_ENV"

      - name: Build
        if: matrix.target != 'universal-apple-darwin'
        run: cargo build --release --locked --bin ${{ env.BIN_NAME }} --target ${{ matrix.target }}

      - name: Build macOS universal binary
        if: matrix.target == 'universal-apple-darwin'
        shell: bash
        run: |
          cargo build --release --locked --bin "${BIN_NAME}" --target x86_64-apple-darwin
          cargo build --release --locked --bin "${BIN_NAME}" --target aarch64-apple-darwin
          mkdir -p "target/${{ matrix.target }}/release"
          lipo -create \
            "target/x86_64-apple-darwin/release/${BIN_NAME}" \
            "target/aarch64-apple-darwin/release/${BIN_NAME}" \
            -output "target/${{ matrix.target }}/release/${BIN_NAME}"
          lipo -info "target/${{ matrix.target }}/release/${BIN_NAME}"

      - name: Stage artifacts (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          stage="${BIN_NAME}-${{ needs.release-context.outputs.tag }}-${{ matrix.target }}"
          mkdir -p "dist/${stage}"
          cp "target/${{ matrix.target }}/release/${BIN_NAME}" "dist/${stage}/"
          cp LICENSE.md README.md licenses/GPL-3.0.md licenses/SOURCE.md licenses/THIRD_PARTY_LICENSES.html licenses/SUPPLEMENTAL_THIRD_PARTY_NOTICES.txt "dist/${stage}/"
          tar -C dist -czf "dist/${stage}.tar.gz" "${stage}"
          (cd dist && shasum -a 256 "${stage}.tar.gz" > "${stage}.tar.gz.sha256")

      - name: Stage artifacts (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $stage = "${env:BIN_NAME}-${{ needs.release-context.outputs.tag }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path "dist/$stage" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${env:BIN_NAME}.exe" "dist/$stage/"
          Copy-Item LICENSE.md, README.md, licenses/GPL-3.0.md, licenses/SOURCE.md, licenses/THIRD_PARTY_LICENSES.html, licenses/SUPPLEMENTAL_THIRD_PARTY_NOTICES.txt "dist/$stage/"
          Compress-Archive -Path "dist/$stage" -DestinationPath "dist/$stage.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "dist/$stage.zip").Hash.ToLower()
          "$hash  $stage.zip" | Out-File -Encoding ascii "dist/$stage.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  agent-plugin-package:
    name: stage agent plugin package
    needs: [release-context, build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ needs.release-context.outputs.commit }}

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Download release artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: dist
          merge-multiple: true

      - name: Prepare agent plugin release metadata
        run: >
          node scripts/prepare-vscode-extension-manifest.mjs
          --version "${{ needs.release-context.outputs.version }}"
          --plugin-release plugins/bifrost-agent/bifrost-release.json
          --dist dist

      - name: Generate Amp skill bundle
        run: node scripts/generate-amp-skill-bundle.mjs

      - name: Test agent plugin launcher
        run: node --test plugins/bifrost-agent/test/launcher.test.mjs

      - name: Validate agent plugin manifests
        run: node scripts/check-codex-plugin-manifest.mjs

      - name: Package agent plugin
        shell: bash
        run: |
          package_root="${RUNNER_TEMP}/bifrost-agent-package"
          mkdir -p "$package_root" dist
          cp -R plugins/bifrost-agent "$package_root/bifrost-agent"
          cp LICENSE.md licenses/GPL-3.0.md licenses/SOURCE.md "$package_root/bifrost-agent/"
          tar -C "$package_root" -czf "dist/bifrost-agent-${{ needs.release-context.outputs.tag }}.tar.gz" bifrost-agent

      - name: Upload staged agent plugin
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: bifrost-agent-package
          path: dist/bifrost-agent-${{ needs.release-context.outputs.tag }}.tar.gz
          if-no-files-found: error

  agent-plugin-prepublish-smoke:
    name: prepublication agent plugin smoke
    needs: [release-context, build, agent-plugin-package]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ needs.release-context.outputs.commit }}

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Download built Linux binary
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ env.BIN_NAME }}-x86_64-unknown-linux-gnu
          path: ${{ runner.temp }}/bifrost-linux-release

      - name: Download staged agent plugin
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: bifrost-agent-package
          path: ${{ runner.temp }}/bifrost-agent-prepublish

      - name: Extract staged agent plugin
        shell: bash
        run: |
          package_dir="${RUNNER_TEMP}/bifrost-agent-prepublish"
          archive="$(find "$package_dir" -maxdepth 1 -type f -name 'bifrost-agent-*.tar.gz' -print -quit)"
          test -n "$archive"
          tar -C "$package_dir" -xzf "$archive"

      - name: Extract built Linux binary
        id: binary
        shell: bash
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/bifrost-linux-release
        run: |
          archive="$(find "$ARTIFACT_DIR" -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "$archive"
          tar -C "$ARTIFACT_DIR" -xzf "$archive"
          binary="$(find "$ARTIFACT_DIR" -type f -name "${BIN_NAME}" -print -quit)"
          test -n "$binary"
          chmod +x "$binary"
          echo "path=$binary" >> "$GITHUB_OUTPUT"

      - name: Smoke staged agent plugin with built binary
        shell: bash
        env:
          BIFROST_MCP_RMCP: 'on'
        run: >
          node scripts/smoke-agent-plugin-release.mjs
          --plugin-dir "${RUNNER_TEMP}/bifrost-agent-prepublish/bifrost-agent"
          --cache-dir "${RUNNER_TEMP}/bifrost-agent-prepublish-cache"
          --binary-path "${{ steps.binary.outputs.path }}"

  promotion-evidence:
    name: promotion evidence
    needs:
      - release-context
      - crate-package
      - semantic-pack-bundle
      - build-wheels
      - build
      - agent-plugin-package
      - agent-plugin-prepublish-smoke
      - pi-package
      - vscode-package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout validated source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ needs.release-context.outputs.commit }}

      - name: Verify release tag still selects the validated commit
        # Recovery dispatches run this workflow revision while checking out the
        # immutable release source, so keep the verifier in this workflow.
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.release-context.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.release-context.outputs.commit }}
        run: |
          tag_ref="refs/tags/$RELEASE_TAG"
          remote_refs="$(git ls-remote --tags origin "${tag_ref}*")"
          actual_commit="$(awk -v tag_ref="$tag_ref" '
            $2 == (tag_ref "^{}") { print $1; found = 1; exit }
            $2 == tag_ref { fallback = $1 }
            END { if (!found && fallback) print fallback }
          ' <<< "$remote_refs")"
          test -n "$actual_commit"
          test "$actual_commit" = "$RELEASE_COMMIT"

      - name: Record validated release identity
        shell: bash
        run: |
          echo "Validated release ${{ needs.release-context.outputs.tag }} (${{ needs.release-context.outputs.version }})"
          echo "Source commit: ${{ needs.release-context.outputs.commit }}"

  release:
    name: release
    needs: [release-context, promotion-evidence]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ needs.release-context.outputs.commit }}

      - name: Download all artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: dist
          merge-multiple: true

      - name: Verify release tag still selects the validated commit
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.release-context.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.release-context.outputs.commit }}
        run: |
          tag_ref="refs/tags/$RELEASE_TAG"
          remote_refs="$(git ls-remote --tags origin "${tag_ref}*")"
          actual_commit="$(awk -v tag_ref="$tag_ref" '
            $2 == (tag_ref "^{}") { print $1; found = 1; exit }
            $2 == tag_ref { fallback = $1 }
            END { if (!found && fallback) print fallback }
          ' <<< "$remote_refs")"
          test -n "$actual_commit"
          test "$actual_commit" = "$RELEASE_COMMIT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.release-context.outputs.tag }}
          name: ${{ needs.release-context.outputs.tag }}
          generate_release_notes: true
          overwrite_files: false
          files: |
            dist/${{ env.BIN_NAME }}-${{ needs.release-context.outputs.tag }}-*.tar.gz
            dist/${{ env.BIN_NAME }}-${{ needs.release-context.outputs.tag }}-*.zip
            dist/${{ env.BIN_NAME }}-${{ needs.release-context.outputs.tag }}-*.sha256
            dist/bifrost-semantic-packs-${{ needs.release-context.outputs.tag }}.tar.gz
            dist/bifrost-semantic-packs-${{ needs.release-context.outputs.tag }}.tar.gz.sha256

  publish-crate-core:
    name: publish core crate after promotion evidence
    needs: [release-context, promotion-evidence]
    uses: ./.github/workflows/publish-crate.yml
    with:
      tag: ${{ needs.release-context.outputs.tag }}
      version: ${{ needs.release-context.outputs.version }}
      commit: ${{ needs.release-context.outputs.commit }}
      package: brokk-bifrost-core
    permissions:
      contents: read
      id-token: write

  publish-crate-go:
    name: publish go language crate after core
    needs: [release-context, promotion-evidence, publish-crate-core]
    uses: ./.github/workflows/publish-crate.yml
    with:
      tag: ${{ needs.release-context.outputs.tag }}
      version: ${{ needs.release-context.outputs.version }}
      commit: ${{ needs.release-context.outputs.commit }}
      package: brokk-bifrost-go
    permissions:
      contents: read
      id-token: write

  publish-crate-analysis:
    name: publish analysis crate after core and go
    needs: [release-context, promotion-evidence, publish-crate-core, publish-crate-go]
    uses: ./.github/workflows/publish-crate.yml
    with:
      tag: ${{ needs.release-context.outputs.tag }}
      version: ${{ needs.release-context.outputs.version }}
      commit: ${{ needs.release-context.outputs.commit }}
      package: brokk-bifrost-analysis
    permissions:
      contents: read
      id-token: write

  publish-crate-policy:
    name: publish policy crate after analysis
    needs: [release-context, publish-crate-analysis]
    uses: ./.github/workflows/publish-crate.yml
    with:
      tag: ${{ needs.release-context.outputs.tag }}
      version: ${{ needs.release-context.outputs.version }}
      commit: ${{ needs.release-context.outputs.commit }}
      package: brokk-bifrost-policy
    permissions:
      contents: read
      id-token: write

  publish-crate-nlp:
    name: publish nlp crate after analysis
    needs: [release-context, publish-crate-analysis]
    uses: ./.github/workflows/publish-crate.yml
    with:
      tag: ${{ needs.release-context.outputs.tag }}
      version: ${{ needs.release-context.outputs.version }}
      commit: ${{ needs.release-context.outputs.commit }}
      package: brokk-bifrost-nlp
    permissions:
      contents: read
      id-token: write

  publish-crate-runtime:
    name: publish runtime crate after policy
    needs: [release-context, publish-crate-policy]
    uses: ./.github/workflows/publish-crate.yml
    with:
      tag: ${{ needs.release-context.outputs.tag }}
      version: ${{ needs.release-context.outputs.version }}
      commit: ${{ needs.release-context.outputs.commit }}
      package: brokk-bifrost-runtime
    permissions:
      contents: read
      id-token: write

  publish-crate-semantic-packs:
    name: publish semantic packs crate after analysis
    needs: [release-context, publish-crate-analysis]
    uses: ./.github/workflows/publish-crate.yml
    with:
      tag: ${{ needs.release-context.outputs.tag }}
      version: ${{ needs.release-context.outputs.version }}
      commit: ${{ needs.release-context.outputs.commit }}
      package: brokk-bifrost-semantic-packs
    permissions:
      contents: read
      id-token: write

  publish-crate-mcp:
    name: publish MCP crate after runtime
    needs: [release-context, publish-crate-runtime, publish-crate-nlp]
    uses: ./.github/workflows/publish-crate.yml
    with:
      tag: ${{ needs.release-context.outputs.tag }}
      version: ${{ needs.release-context.outputs.version }}
      commit: ${{ needs.release-context.outputs.commit }}
      package: brokk-bifrost-mcp
    permissions:
      contents: read
      id-token: write

  publish-crate-lsp:
    name: publish LSP crate after runtime
    needs: [release-context, publish-crate-runtime]
    uses: ./.github/workflows/publish-crate.yml
    with:
      tag: ${{ needs.release-context.outputs.tag }}
      version: ${{ needs.release-context.outputs.version }}
      commit: ${{ needs.release-context.outputs.commit }}
      package: brokk-bifrost-lsp
    permissions:
      contents: read
      id-token: write

  publish-crate-facade:
    name: publish facade crate after hosts
    needs: [release-context, publish-crate-mcp, publish-crate-lsp, publish-crate-semantic-packs, publish-crate-nlp]
    uses: ./.github/workflows/publish-crate.yml
    with:
      tag: ${{ needs.release-context.outputs.tag }}
      version: ${{ needs.release-context.outputs.version }}
      commit: ${{ needs.release-context.outputs.commit }}
      package: brokk-bifrost
    permissions:
      contents: read
      id-token: write

  publish-wheels:
    name: publish wheels after promotion evidence
    needs: [release-context, promotion-evidence]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.release-context.outputs.tag }}
      RELEASE_VERSION: ${{ needs.release-context.outputs.version }}
      RELEASE_COMMIT: ${{ needs.release-context.outputs.commit }}
    steps:
      - name: Checkout validated source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ needs.release-context.outputs.commit }}

      - name: Verify release tag still selects the validated commit
        shell: bash
        run: |
          tag_ref="refs/tags/$RELEASE_TAG"
          remote_refs="$(git ls-remote --tags origin "${tag_ref}*")"
          actual_commit="$(awk -v tag_ref="$tag_ref" '
            $2 == (tag_ref "^{}") { print $1; found = 1; exit }
            $2 == tag_ref { fallback = $1 }
            END { if (!found && fallback) print fallback }
          ' <<< "$remote_refs")"
          test -n "$actual_commit"
          test "$actual_commit" = "$RELEASE_COMMIT"

      - name: Download wheel artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Download source distribution
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: sdist
          path: dist

