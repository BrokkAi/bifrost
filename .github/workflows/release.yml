  sync-agent-plugin-release-metadata:
    name: sync generated release metadata
    needs: [release-context, publish-vscode, agent-plugin-release-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    concurrency:
      group: release-metadata-master
      cancel-in-progress: false
    steps:
      - name: Checkout master
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: master

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Confirm master is the released version
        env:
          RELEASE_TAG: ${{ needs.release-context.outputs.tag }}
        run: node scripts/release-version.mjs check --tag "$RELEASE_TAG"

      - name: Download release artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: dist
          merge-multiple: true

      - name: Prepare generated release metadata
        run: >
          node scripts/prepare-vscode-extension-manifest.mjs
          --version "${{ needs.release-context.outputs.version }}"
          --manifest editors/vscode/package.json
          --plugin-release plugins/bifrost-agent/bifrost-release.json
          --dist dist

      - name: Regenerate Amp skill bundle
        run: node scripts/generate-amp-skill-bundle.mjs

      - name: Validate synchronized release projections
        run: node scripts/release-version.mjs check

      - name: Validate agent plugin manifests
        run: node scripts/check-codex-plugin-manifest.mjs

      - name: Reject non-metadata generated changes
        shell: bash
        run: |
          allowed_canonical="plugins/bifrost-agent/bifrost-release.json"
          allowed_amp="plugins/bifrost-agent/amp-skills/bifrost-code-intelligence/bifrost-release.json"
          allowed_vscode="editors/vscode/package.json"
          while IFS= read -r changed_file; do
            [ -z "$changed_file" ] && continue
            if [ "$changed_file" != "$allowed_canonical" ] && \
              [ "$changed_file" != "$allowed_amp" ] && \
              [ "$changed_file" != "$allowed_vscode" ]; then
              echo "Refusing to commit unexpected generated change: $changed_file" >&2
              exit 1
            fi
          done < <(git diff --name-only)

      - name: Commit generated metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Generated agent plugin metadata is already current."
            exit 0
          fi
          git add -- plugins/bifrost-agent/bifrost-release.json \
            plugins/bifrost-agent/amp-skills/bifrost-code-intelligence/bifrost-release.json \
            editors/vscode/package.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync release metadata for ${{ needs.release-context.outputs.tag }}"
          gh auth setup-git
          git push origin HEAD:master

  release-summary:
    name: release promotion summary
    if: ${{ always() }}
    needs:
      - release-context
      - crate-package
      - semantic-pack-bundle
      - build-wheels
      - build
      - agent-plugin-package
      - agent-plugin-prepublish-smoke
      - agent-plugin-release-smoke
      - pi-package
      - vscode-package
      - promotion-evidence
      - release
      - publish-crate-analysis
      - publish-crate-policy
      - publish-crate-nlp
      - publish-crate-semantic-packs
      - publish-crate-runtime
      - publish-crate-mcp
      - publish-crate-lsp
      - publish-crate-facade
      - publish-wheels
      - publish-agent-plugin
      - publish-pi-package
      - attach-vscode
      - publish-vscode
      - publish-open-vsx
      - sync-agent-plugin-release-metadata
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.release-context.outputs.tag }}
      RELEASE_VERSION: ${{ needs.release-context.outputs.version }}
      RELEASE_COMMIT: ${{ needs.release-context.outputs.commit }}
      CRATE_PACKAGE: ${{ needs.crate-package.result }}
      SEMANTIC_PACK_BUNDLE: ${{ needs.semantic-pack-bundle.result }}
      WHEEL_BUILD: ${{ needs.build-wheels.result }}
      CLI_BUILD: ${{ needs.build.result }}
      AGENT_PACKAGE: ${{ needs.agent-plugin-package.result }}
      AGENT_PREPUBLISH_SMOKE: ${{ needs.agent-plugin-prepublish-smoke.result }}
      AGENT_PACKAGED_SMOKE: ${{ needs.agent-plugin-release-smoke.result }}
      PI_BUILD: ${{ needs.pi-package.result }}
      VSCODE_BUILD: ${{ needs.vscode-package.result }}
      PROMOTION_EVIDENCE: ${{ needs.promotion-evidence.result }}
      GITHUB_RELEASE: ${{ needs.release.result }}
      CRATE_ANALYSIS: ${{ needs.publish-crate-analysis.result }}
      CRATE_POLICY: ${{ needs.publish-crate-policy.result }}
      CRATE_NLP: ${{ needs.publish-crate-nlp.result }}
      CRATE_SEMANTIC_PACKS: ${{ needs.publish-crate-semantic-packs.result }}
      CRATE_RUNTIME: ${{ needs.publish-crate-runtime.result }}
      CRATE_MCP: ${{ needs.publish-crate-mcp.result }}
      CRATE_LSP: ${{ needs.publish-crate-lsp.result }}
      CRATE_FACADE: ${{ needs.publish-crate-facade.result }}
      WHEELS: ${{ needs.publish-wheels.result }}
      AGENT_PLUGIN: ${{ needs.publish-agent-plugin.result }}
      PI_PACKAGE: ${{ needs.publish-pi-package.result }}
      VSCODE_ATTACHMENT: ${{ needs.attach-vscode.result }}
      VSCODE: ${{ needs.publish-vscode.result }}
      OPEN_VSX: ${{ needs.publish-open-vsx.result }}
      METADATA_SYNC: ${{ needs.sync-agent-plugin-release-metadata.result }}
    steps:
      - name: Write promotion outcome and recovery guidance
        shell: bash
        run: |
          {
