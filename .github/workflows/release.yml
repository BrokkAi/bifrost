name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to promote (for example v0.10.3)
        required: true
        type: string
      qualification_run_id:
        description: Optional exact Release readiness run ID for recovery
        required: false
        type: string

permissions:
  contents: read
  actions: read

env:
  PUBLIC_REPOSITORY: BrokkAi/bifrost

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release-context:
    name: validate release context
    if: ${{ github.repository == 'BrokkAi/bifrost' && github.event.repository.private == false }}
    uses: ./.github/workflows/release-context.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    permissions:
      contents: read
      actions: read

  resolve-qualification:
    name: resolve exact readiness run
    needs: release-context
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      run_id: ${{ steps.select.outputs.run_id }}
      run_attempt: ${{ steps.select.outputs.run_attempt }}
      artifact_id: ${{ steps.select.outputs.artifact_id }}
      artifact_digest: ${{ steps.select.outputs.artifact_digest }}
      artifact_name: ${{ steps.select.outputs.artifact_name }}
    env:
      RELEASE_TAG: ${{ needs.release-context.outputs.tag }}
      RELEASE_VERSION: ${{ needs.release-context.outputs.version }}
      RELEASE_COMMIT: ${{ needs.release-context.outputs.commit }}
      QUALIFICATION_RUN_ID_INPUT: ${{ inputs.qualification_run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ needs.release-context.outputs.commit }}

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Collect readiness run and artifact evidence
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/release-readiness.yml/runs?head_sha=${RELEASE_COMMIT}&status=completed&per_page=100" \
            > "$RUNNER_TEMP/readiness-runs-api.json"
          gh api --paginate --slurp \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=release-qualification-${RELEASE_COMMIT}-v${RELEASE_VERSION}&per_page=100" \
            > "$RUNNER_TEMP/readiness-artifacts-api.json"
          jq '{workflow_runs: [.[] | .workflow_runs[] |
              {id, path, status, conclusion, head_sha, run_attempt,
               repository: {full_name: .repository.full_name}}]}' \
            "$RUNNER_TEMP/readiness-runs-api.json" > "$RUNNER_TEMP/readiness-runs.json"
          jq '{artifacts: [.[] | .artifacts[] |
              select(.workflow_run.id != null) |
              {id, name, expired, expires_at, workflow_run: {id: .workflow_run.id}}]}' \
            "$RUNNER_TEMP/readiness-artifacts-api.json" > "$RUNNER_TEMP/readiness-artifacts.json"

      - name: Select one exact readiness run
        id: select
        shell: bash
        run: |
          set -euo pipefail
          selection_args=(
            select-run
            --runs "$RUNNER_TEMP/readiness-runs.json"
            --artifacts "$RUNNER_TEMP/readiness-artifacts.json"
            --repository "$PUBLIC_REPOSITORY"
            --commit "$RELEASE_COMMIT"
            --version "$RELEASE_VERSION"
          )
          if [[ -n "${QUALIFICATION_RUN_ID_INPUT:-}" ]]; then
            selection_args+=(--run-id "$QUALIFICATION_RUN_ID_INPUT")
          fi
          node scripts/release-qualification.mjs "${selection_args[@]}" > "$RUNNER_TEMP/qualification-selection.json"
          artifact_id="$(jq -r '.artifactId' "$RUNNER_TEMP/qualification-selection.json")"
          run_id="$(jq -r '.runId' "$RUNNER_TEMP/qualification-selection.json")"
          run_attempt="$(jq -r '.runAttempt' "$RUNNER_TEMP/qualification-selection.json")"
          artifact_name="$(jq -r '.artifact.name' "$RUNNER_TEMP/qualification-selection.json")"
          artifact_digest="$(jq -r --argjson id "$artifact_id" \
            '[.[] | .artifacts[] | select(.id == $id) | (.digest // "")] | unique | if length == 1 then .[0] else "" end' \
            "$RUNNER_TEMP/readiness-artifacts-api.json")"
          expected_name="release-qualification-${RELEASE_COMMIT}-v${RELEASE_VERSION}"
          test "$artifact_name" = "$expected_name"
          [[ "$artifact_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            echo "run_id=$run_id"
            echo "run_attempt=$run_attempt"
            echo "artifact_id=$artifact_id"
            echo "artifact_digest=$artifact_digest"
            echo "artifact_name=$artifact_name"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Qualification selected"
            echo
            echo "- Tag: \`$RELEASE_TAG\`"
            echo "- Version: \`$RELEASE_VERSION\`"
            echo "- Commit: \`$RELEASE_COMMIT\`"
            echo "- Readiness run: \`$run_id\` (attempt \`$run_attempt\`)"
            echo "- Artifact: \`$artifact_name\` (\`$artifact_id\`)"
            echo "- Artifact digest: \`$artifact_digest\`"
          } >> "$GITHUB_STEP_SUMMARY"

  promote-qualification:
    name: download and verify qualification bundle
    needs: [release-context, resolve-qualification]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      run_id: ${{ needs.resolve-qualification.outputs.run_id }}
      run_attempt: ${{ needs.resolve-qualification.outputs.run_attempt }}
      artifact_id: ${{ needs.resolve-qualification.outputs.artifact_id }}
      artifact_digest: ${{ needs.resolve-qualification.outputs.artifact_digest }}
      artifact_name: ${{ needs.resolve-qualification.outputs.artifact_name }}
      manifest_sha256: ${{ steps.verify.outputs.manifest_sha256 }}
    env:
      RELEASE_TAG: ${{ needs.release-context.outputs.tag }}
      RELEASE_VERSION: ${{ needs.release-context.outputs.version }}
      RELEASE_COMMIT: ${{ needs.release-context.outputs.commit }}
      QUALIFICATION_RUN_ID: ${{ needs.resolve-qualification.outputs.run_id }}
      QUALIFICATION_RUN_ATTEMPT: ${{ needs.resolve-qualification.outputs.run_attempt }}
      QUALIFICATION_ARTIFACT_ID: ${{ needs.resolve-qualification.outputs.artifact_id }}
      QUALIFICATION_ARTIFACT_DIGEST: ${{ needs.resolve-qualification.outputs.artifact_digest }}
      QUALIFICATION_ARTIFACT_NAME: ${{ needs.resolve-qualification.outputs.artifact_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ needs.release-context.outputs.commit }}

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Confirm artifact ID and digest before download
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${QUALIFICATION_ARTIFACT_ID}" > "$RUNNER_TEMP/qualification-artifact.json"
          jq -e --arg name "$QUALIFICATION_ARTIFACT_NAME" \
            --arg digest "$QUALIFICATION_ARTIFACT_DIGEST" \
            '.name == $name and .digest == $digest and .expired == false' \
            "$RUNNER_TEMP/qualification-artifact.json" >/dev/null

      - name: Download exact readiness artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ needs.resolve-qualification.outputs.artifact_id }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve-qualification.outputs.run_id }}
          github-token: ${{ github.token }}
          path: qualification
          merge-multiple: true

      - name: Verify every qualified byte and identity
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-qualified-release.mjs verify \
            --bundle qualification \
            --manifest qualification/release-qualification.json \
            --repository "$PUBLIC_REPOSITORY" \
            --commit "$RELEASE_COMMIT" \
            --version "$RELEASE_VERSION" \
            --run-id "$QUALIFICATION_RUN_ID" \
            --run-attempt "$QUALIFICATION_RUN_ATTEMPT" \
            --output "$RUNNER_TEMP/verified-qualification.json"
          manifest_sha256="$(sha256sum qualification/release-qualification.json | awk '{print $1}')"
          echo "manifest_sha256=$manifest_sha256" >> "$GITHUB_OUTPUT"
          {
            echo "## Qualification bytes verified"
            echo
            echo "- Manifest: \`qualification/release-qualification.json\`"
            echo "- Manifest SHA-256: \`$manifest_sha256\`"
            echo "- Artifact ID: \`$QUALIFICATION_ARTIFACT_ID\`"
            echo "- Artifact digest: \`$QUALIFICATION_ARTIFACT_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: create GitHub Release from qualified assets
    needs: [release-context, promote-qualification]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: ${{ needs.release-context.outputs.tag }}
      RELEASE_VERSION: ${{ needs.release-context.outputs.version }}
      RELEASE_COMMIT: ${{ needs.release-context.outputs.commit }}
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ needs.release-context.outputs.commit }}

      - name: Download qualified release bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ needs.promote-qualification.outputs.artifact_id }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.promote-qualification.outputs.run_id }}
          github-token: ${{ github.token }}
          path: qualification
          merge-multiple: true

      - name: Verify tag still selects the qualified commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          tag_ref="refs/tags/$RELEASE_TAG"
          remote_refs="$(git ls-remote --tags origin "${tag_ref}*")"
          actual_commit="$(awk -v tag_ref="$tag_ref" '
            $2 == (tag_ref "^{}") { print $1; found = 1; exit }
            $2 == tag_ref { fallback = $1 }
            END { if (!found && fallback) print fallback }
          ' <<< "$remote_refs")"
          test "$actual_commit" = "$RELEASE_COMMIT"

      - name: Select exact qualified GitHub assets
        id: assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/release-assets.txt"
          jq -r '.files[] |
            select((.path | test("^bifrost-v.*\\.(tar\\.gz|zip)(\\.sha256)?$")) or
                   (.path | test("^bifrost-semantic-packs-.*\\.(tar\\.gz|json)(\\.sha256)?$")) or
                   (.path | test("^(bifrost-agent-.*\\.tar\\.gz|brokk-bifrost-agent-.*\\.tgz|bifrost-vscode-.*\\.vsix)$"))) |
            "qualification/" + .path' qualification/release-qualification.json > "$assets"
          test -s "$assets"
          release_json="$RUNNER_TEMP/github-release.json"
          release_status="$RUNNER_TEMP/github-release-status.txt"
          curl --silent --show-error --location \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --output "$release_json" \
            --write-out '%{http_code}' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            > "$release_status"
          status="$(tr -d '[:space:]' < "$release_status")"
          if [[ "$status" == 200 ]]; then
            missing="$RUNNER_TEMP/release-assets-missing.txt"
            : > "$missing"
            while IFS= read -r file; do
              name="$(basename "$file")"
              digest="$(sha256sum "$file" | awk '{print $1}')"
              existing="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | (.digest // "")' "$release_json")"
              if [[ -z "$existing" ]]; then
                printf '%s\n' "$file" >> "$missing"
                continue
              fi
              test "$existing" = "sha256:$digest"
            done < "$assets"
            mv "$missing" "$assets"
          elif [[ "$status" != 404 ]]; then
            echo "Unexpected GitHub release lookup status: $status" >&2
            exit 1
          fi
          if [[ -s "$assets" ]]; then
            echo "upload=true" >> "$GITHUB_OUTPUT"
          else
            echo "upload=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "files<<EOF"
            cat "$assets"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release without overwriting assets
        if: steps.assets.outputs.upload == 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.release-context.outputs.tag }}
          name: ${{ needs.release-context.outputs.tag }}
          generate_release_notes: true
          overwrite_files: false
          files: ${{ steps.assets.outputs.files }}

  publish-wheels:
    name: publish qualified wheels and sdist
    needs: [release-context, promote-qualification]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.release-context.outputs.version }}
    steps:
      - name: Download qualified release bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ needs.promote-qualification.outputs.artifact_id }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.promote-qualification.outputs.run_id }}
          github-token: ${{ github.token }}
          path: qualification
          merge-multiple: true

      - name: Stage exact qualified Python files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pypi-dist"
          mapfile -t files < <(jq -r '.files[] | select(
            (.path | startswith("brokk_bifrost_searchtools-") and (endswith(".whl") or endswith(".tar.gz"))) or
            (.path | startswith("brokk_bifrost-") and endswith(".whl"))) | .path' qualification/release-qualification.json)
          test "${#files[@]}" -eq 11
          for file in "${files[@]}"; do cp "qualification/$file" "$RUNNER_TEMP/pypi-dist/"; done

      - name: Check existing PyPI files against qualified checksums
        id: pypi-check
        shell: bash
        run: |
          set -euo pipefail
          publish=0
          for package in brokk-bifrost-searchtools brokk-bifrost; do
            response="$RUNNER_TEMP/pypi-${package}.json"
            status="$(curl --silent --show-error --location --output "$response" --write-out '%{http_code}' \
              "https://pypi.org/pypi/${package}/${RELEASE_VERSION}/json")"
            if [[ "$status" == 404 ]]; then
              publish=1
              continue
            fi
            test "$status" = 200
            while IFS= read -r file; do
              [[ "$file" == *"${package//-/_}-"* ]] || continue
              filename="$(basename "$file")"
              expected="$(jq -r --arg filename "$filename" '.urls[] | select(.filename == $filename) | .digests.sha256' "$response")"
              if [[ -z "$expected" ]]; then
                publish=1
                continue
              fi
              [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
              actual="$(sha256sum "$RUNNER_TEMP/pypi-dist/$filename" | awk '{print $1}')"
              test "$actual" = "$expected"
            done < <(find "$RUNNER_TEMP/pypi-dist" -maxdepth 1 -type f -printf '%f\n')
          done
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Publish qualified files to PyPI
        if: steps.pypi-check.outputs.publish == '1'
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          packages-dir: ${{ runner.temp }}/pypi-dist
          skip-existing: true

  publish-npm:
    name: dispatch qualified npm publication
    needs: [release-context, promote-qualification]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    outputs:
      child_run_id: ${{ steps.dispatch.outputs.run_id }}
    env:
      RELEASE_TAG: ${{ needs.release-context.outputs.tag }}
      RELEASE_VERSION: ${{ needs.release-context.outputs.version }}
      RELEASE_COMMIT: ${{ needs.release-context.outputs.commit }}
      QUALIFICATION_RUN_ID: ${{ needs.promote-qualification.outputs.run_id }}
      QUALIFICATION_RUN_ATTEMPT: ${{ needs.promote-qualification.outputs.run_attempt }}
      QUALIFICATION_ARTIFACT_ID: ${{ needs.promote-qualification.outputs.artifact_id }}
      QUALIFICATION_ARTIFACT_DIGEST: ${{ needs.promote-qualification.outputs.artifact_digest }}
      QUALIFICATION_MANIFEST_SHA256: ${{ needs.promote-qualification.outputs.manifest_sha256 }}
      DISPATCH_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch the trusted-publishing workflow with exact qualification identity
        # publish-npm.yml runs npm run publish-release against these qualified
        # archives so npm's trusted publisher remains bound to its filename.
        id: dispatch
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run publish-npm.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref master \
            --field release_tag="$RELEASE_TAG" \
            --field release_version="$RELEASE_VERSION" \
            --field release_commit="$RELEASE_COMMIT" \
            --field qualification_run_id="$QUALIFICATION_RUN_ID" \
            --field qualification_run_attempt="$QUALIFICATION_RUN_ATTEMPT" \
            --field qualification_artifact_id="$QUALIFICATION_ARTIFACT_ID" \
            --field qualification_artifact_digest="$QUALIFICATION_ARTIFACT_DIGEST" \
            --field qualification_manifest_sha256="$QUALIFICATION_MANIFEST_SHA256" \
            --field dispatch_nonce="$DISPATCH_NONCE"
          expected_title="Publish npm ${RELEASE_TAG} [${DISPATCH_NONCE}]"
          for attempt in $(seq 1 30); do
            gh run list --repo "$GITHUB_REPOSITORY" --workflow publish-npm.yml \
              --event workflow_dispatch --branch master --limit 10 \
              --json databaseId,displayTitle > "$RUNNER_TEMP/npm-runs.json"
            child_run="$(jq -r --arg title "$expected_title" \
              '[.[] | select(.displayTitle == $title)] | first | .databaseId // empty' \
              "$RUNNER_TEMP/npm-runs.json")"
            if [[ -n "$child_run" ]]; then
              echo "run_id=$child_run" >> "$GITHUB_OUTPUT"
              gh run watch "$child_run" --repo "$GITHUB_REPOSITORY" --exit-status
              exit 0
            fi
            sleep 5
          done
          echo "The dispatched publish-npm.yml run did not appear." >&2
          exit 1

  publish-agent-plugin:
    name: verify qualified agent plugin asset
    needs: [release-context, promote-qualification, release]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_TAG: ${{ needs.release-context.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download qualified release bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ needs.promote-qualification.outputs.artifact_id }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.promote-qualification.outputs.run_id }}
          github-token: ${{ github.token }}
          path: qualification
          merge-multiple: true

      - name: Verify GitHub asset matches the qualified agent archive
        shell: bash
        run: |
          set -euo pipefail
          file="qualification/bifrost-agent-${RELEASE_TAG}.tar.gz"
          expected="sha256:$(sha256sum "$file" | awk '{print $1}')"
          release_json="$RUNNER_TEMP/release.json"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > "$release_json"
          actual="$(jq -r --arg name "$(basename "$file")" '.assets[] | select(.name == $name) | (.digest // "")' "$release_json")"
          test "$actual" = "$expected"

  publish-pi-package:
    name: verify qualified Pi asset
    needs: [release-context, promote-qualification, release]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_TAG: ${{ needs.release-context.outputs.tag }}
      RELEASE_VERSION: ${{ needs.release-context.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download qualified release bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ needs.promote-qualification.outputs.artifact_id }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.promote-qualification.outputs.run_id }}
          github-token: ${{ github.token }}
          path: qualification
          merge-multiple: true

      - name: Verify GitHub asset matches the qualified Pi archive
        shell: bash
        run: |
          set -euo pipefail
          file="qualification/brokk-bifrost-agent-${RELEASE_VERSION}.tgz"
          expected="sha256:$(sha256sum "$file" | awk '{print $1}')"
          release_json="$RUNNER_TEMP/release.json"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > "$release_json"
          actual="$(jq -r --arg name "$(basename "$file")" '.assets[] | select(.name == $name) | (.digest // "")' "$release_json")"
          test "$actual" = "$expected"

  publish-policy-scan-action:
    name: sync policy-scan action alias repository
    # Publishes the composite action from the qualified release commit into
    # the standalone alias repository so consumers can write
    # `uses: BrokkAi/bifrost-policy-scan@vX.Y.Z`. The synced copy pins its
    # `version` input default to this release, so the alias tag and the
    # Bifrost binary it installs stay in lockstep. Runs after `release`
    # because that default must resolve to published release assets.
    needs: [release-context, promote-qualification, release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.release-context.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.release-context.outputs.commit }}
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ needs.release-context.outputs.commit }}

      - name: Verify tag still selects the qualified commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          tag_ref="refs/tags/$RELEASE_TAG"
          remote_refs="$(git ls-remote --tags origin "${tag_ref}*")"
          actual_commit="$(awk -v tag_ref="$tag_ref" '
            $2 == (tag_ref "^{}") { print $1; found = 1; exit }
            $2 == tag_ref { fallback = $1 }
            END { if (!found && fallback) print fallback }
          ' <<< "$remote_refs")"
          test "$actual_commit" = "$RELEASE_COMMIT"

      - name: Mint an alias-repository-only GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.POLICY_SCAN_APP_CLIENT_ID }}
          private-key: ${{ secrets.POLICY_SCAN_APP_PRIVATE_KEY }}
          owner: BrokkAi
          repositories: bifrost-policy-scan
          permission-contents: write

      - name: Sync the action into the alias repository
        env:
          POLICY_SCAN_SYNC_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bash scripts/sync-policy-scan-action.sh

  attach-vscode:
    name: verify qualified VSIX asset
    needs: [release-context, promote-qualification, release]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_TAG: ${{ needs.release-context.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download qualified release bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ needs.promote-qualification.outputs.artifact_id }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.promote-qualification.outputs.run_id }}
          github-token: ${{ github.token }}
          path: qualification
          merge-multiple: true

      - name: Verify GitHub asset matches the qualified VSIX
        shell: bash
        run: |
          set -euo pipefail
          file="qualification/bifrost-vscode-${RELEASE_TAG}.vsix"
          expected="sha256:$(sha256sum "$file" | awk '{print $1}')"
          release_json="$RUNNER_TEMP/release.json"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > "$release_json"
          actual="$(jq -r --arg name "$(basename "$file")" '.assets[] | select(.name == $name) | (.digest // "")' "$release_json")"
          test "$actual" = "$expected"

  publish-vscode:
    name: publish qualified VSIX to Visual Studio Marketplace
    needs: [release-context, promote-qualification, attach-vscode]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout exact marketplace tooling
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ needs.release-context.outputs.commit }}

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install marketplace tooling
        run: npm ci
        working-directory: editors/vscode

      - name: Download qualified release bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ needs.promote-qualification.outputs.artifact_id }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.promote-qualification.outputs.run_id }}
          github-token: ${{ github.token }}
          path: qualification
          merge-multiple: true

      - name: Publish exact qualified VSIX
        run: >-
          npx --no-install vsce publish
          --packagePath "${{ github.workspace }}/qualification/bifrost-vscode-${{ needs.release-context.outputs.tag }}.vsix"
          --skip-duplicate
        working-directory: editors/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

  publish-open-vsx:
    name: publish qualified VSIX to Open VSX
    needs: [release-context, promote-qualification, attach-vscode]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_VERSION: ${{ needs.release-context.outputs.version }}
      RELEASE_TAG: ${{ needs.release-context.outputs.tag }}
    steps:
      - name: Checkout exact Open VSX tooling
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ needs.release-context.outputs.commit }}

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install Open VSX tooling
        run: npm ci
        working-directory: editors/vscode

      - name: Download qualified release bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ needs.promote-qualification.outputs.artifact_id }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.promote-qualification.outputs.run_id }}
          github-token: ${{ github.token }}
          path: qualification
          merge-multiple: true

      - name: Publish or verify exact qualified VSIX
        shell: bash
        working-directory: editors/vscode
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          VSIX_PATH: ${{ github.workspace }}/qualification/bifrost-vscode-${{ needs.release-context.outputs.tag }}.vsix
        run: |
          set -euo pipefail
          metadata_url="https://open-vsx.org/api/brokk/bifrost-vscode/$RELEASE_VERSION"
          checksum_url="$metadata_url/file/brokk.bifrost-vscode-$RELEASE_VERSION.sha256"
          local_checksum="$(sha256sum "$VSIX_PATH" | awk '{print $1}')"
          metadata_file="$RUNNER_TEMP/open-vsx-bifrost-vscode.json"
          status="$(curl --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --output "$metadata_file" --write-out '%{http_code}' "$metadata_url")"
          if [[ "$status" == 200 ]]; then
            registry_checksum="$(curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' "$checksum_url" | tr -d '[:space:]')"
            [[ "$registry_checksum" =~ ^[0-9a-f]{64}$ ]]
            test "$registry_checksum" = "$local_checksum"
            exit 0
          fi
          test "$status" = 404
          test -n "${OVSX_PAT:-}"
          npx --no-install ovsx publish "$VSIX_PATH" --skip-duplicate
          for attempt in $(seq 1 30); do
            status="$(curl --silent --show-error --location --output "$metadata_file" --write-out '%{http_code}' "$metadata_url")"
            if [[ "$status" == 200 ]]; then
              registry_checksum="$(curl --fail --silent --show-error --location "$checksum_url" | tr -d '[:space:]')"
              [[ "$registry_checksum" =~ ^[0-9a-f]{64}$ ]]
              test "$registry_checksum" = "$local_checksum"
              exit 0
            fi
            test "$status" = 404
            sleep 10
          done
          exit 1

