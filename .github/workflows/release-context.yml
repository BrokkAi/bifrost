name: Release context

on:
  workflow_call:
    inputs:
      tag:
        description: Unqualified v-prefixed release tag to validate
        required: true
        type: string
    outputs:
      tag:
        description: Normalized v-prefixed release tag
        value: ${{ jobs.validate.outputs.tag }}
      version:
        description: Validated Cargo package version
        value: ${{ jobs.validate.outputs.version }}
      commit:
        description: Immutable source commit checked out from the validated tag
        value: ${{ jobs.validate.outputs.commit }}

permissions:
  contents: read

jobs:
  validate:
    name: validate release context
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: refs/tags/${{ inputs.tag }}

      - name: Verify requested tag selected this checkout
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          expected_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          actual_commit="$(git rev-parse HEAD)"
          test "$actual_commit" = "$expected_commit"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Validate release version and metadata
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: >
          node scripts/release-version.mjs check
          --tag "$RELEASE_TAG"
          --github-output "$GITHUB_OUTPUT"

      - name: Capture immutable release commit
        id: source
        shell: bash
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
