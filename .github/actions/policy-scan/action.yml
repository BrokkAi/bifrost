name: Bifrost Policy Scan
# GitHub Marketplace refuses a listing whose description is 125 characters or
# more, and this is the field it reads. The full exit-code contract -- 0 clean,
# 1 a policy gate failure, 2 unreliable, and why unreliable must never be read
# as clean -- lives in the README, which is the listing body.
description: >-
  Run Bifrost static-analysis policies, upload SARIF to code scanning, and fail
  closed when a scan is unreliable.

branding:
  icon: shield
  color: purple

inputs:
  version:
    description: >-
      Bifrost release tag to install (see BrokkAi/bifrost releases). Pin an
      exact tag for reproducible gates. The special value `local` skips the
      install and uses a release or debug `bifrost` binary from the checkout,
      otherwise the `bifrost` already on PATH.
    required: false
    default: v0.11.4
  policy-packs:
    description: Space-separated built-in pack IDs to run.
    required: false
    default: bifrost.code-smells
  policy-ids:
    description: Space-separated policy IDs to run.
    required: false
    default: ''
  policy-categories:
    description: Space-separated policy categories to run.
    required: false
    default: ''
  policy-files:
    description: Space-separated workspace-relative .rqlp files to run.
    required: false
    default: ''
  fail-on:
    description: 'Severity gate: never, finding, note, warning, or error.'
    required: false
    default: warning
  diff-base:
    description: >-
      Git revision to diff against. When set, the same policies also evaluate
      that commit's content, every finding is classified new or persisting,
      and only new findings gate. Pass the pull request's base SHA for a
      changed-code-only gate. Requires a checkout deep enough to contain the
      revision.
    required: false
    default: ''
  sarif-file:
    description: SARIF output path, relative to working-directory.
    required: false
    default: bifrost-policy.sarif
  policy-timings:
    description: Collect per-policy timing details (requires a runner supporting --policy-timings).
    required: false
    default: 'false'
  artifact-name:
    description: Retain the SARIF report as an artifact before gating. Empty disables artifact upload; use a unique name for each scan in a job.
    required: false
    default: ''
  upload:
    description: Upload the SARIF file to GitHub code scanning.
    required: false
    default: 'true'
  category:
    description: Code-scanning category that isolates this scan's alerts.
    required: false
    default: bifrost-policy
  cache:
    description: Restore and save a dedicated analyzer cache, scoped to this working directory and exact build.
    required: false
    default: 'true'
  working-directory:
    description: Workspace root to analyze, relative to the checkout.
    required: false
    default: '.'

outputs:
  analyzer-cache-hit:
    description: Whether the analyzer cache restored an exact entry (empty when caching is disabled).
    value: ${{ steps.analyzer-cache.outputs.cache-hit }}
  exit-code:
    description: Raw bifrost policy exit code (0, 1, or 2).
    value: ${{ steps.run.outputs.exit-code }}
  sarif-file:
    description: Path of the SARIF report, relative to the checkout.
    value: ${{ steps.run.outputs.sarif-file }}
  bifrost-bin:
    description: Absolute path of the bifrost executable the run used.
    value: ${{ steps.install.outputs.bifrost_bin }}

runs:
  using: composite
  steps:
    - name: Install bifrost
      id: install
      shell: bash
      env:
        BIFROST_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        bin=bifrost
        if [ "${RUNNER_OS}" = Windows ]; then bin=bifrost.exe; fi
        if [ "${BIFROST_VERSION}" = local ]; then
          if [ -x "${GITHUB_WORKSPACE}/target/release/${bin}" ]; then
            echo "bifrost_bin=${GITHUB_WORKSPACE}/target/release/${bin}" >> "${GITHUB_OUTPUT}"
          elif [ -x "${GITHUB_WORKSPACE}/target/debug/${bin}" ]; then
            echo "bifrost_bin=${GITHUB_WORKSPACE}/target/debug/${bin}" >> "${GITHUB_OUTPUT}"
          else
            command -v bifrost >/dev/null || { echo "::error::version=local but no bifrost is available"; exit 1; }
            echo "bifrost_bin=$(command -v bifrost)" >> "${GITHUB_OUTPUT}"
          fi
          exit 0
        fi
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64) target=x86_64-unknown-linux-gnu; archive=tar.gz ;;
          Linux-ARM64) target=aarch64-unknown-linux-gnu; archive=tar.gz ;;
          macOS-X64|macOS-ARM64) target=universal-apple-darwin; archive=tar.gz ;;
          Windows-X64) target=x86_64-pc-windows-msvc; archive=zip ;;
          Windows-ARM64) target=aarch64-pc-windows-msvc; archive=zip ;;
          *) echo "::error::unsupported runner: ${RUNNER_OS}-${RUNNER_ARCH}"; exit 1 ;;
        esac
        stage="bifrost-${BIFROST_VERSION}-${target}"
        url="https://github.com/BrokkAi/bifrost/releases/download/${BIFROST_VERSION}"
        dir="${RUNNER_TEMP}/bifrost-install"
        mkdir -p "${dir}"
        cd "${dir}"
        curl -fsSL -O "${url}/${stage}.${archive}"
        curl -fsSL -O "${url}/${stage}.${archive}.sha256"
        # Windows release checksum files carry CRLF from Out-File, and sha256sum -c rejects the \r in the filename.
        tr -d '\r' < "${stage}.${archive}.sha256" > "${stage}.${archive}.sha256.lf"
        mv "${stage}.${archive}.sha256.lf" "${stage}.${archive}.sha256"
        if command -v sha256sum >/dev/null 2>&1; then
          sha256sum -c "${stage}.${archive}.sha256"
        else
          shasum -a 256 -c "${stage}.${archive}.sha256"
        fi
        if [ "${archive}" = zip ]; then
          if command -v unzip >/dev/null 2>&1; then
            # -o keeps the step idempotent: a second run in the same job
            # re-extracts, and a bare unzip prompts instead of overwriting.
            unzip -oq "${stage}.zip"
          else
            python3 -m zipfile -e "${stage}.zip" .
          fi
        else
          tar -xzf "${stage}.tar.gz"
        fi
        # The archive extracts to a directory named after the stage; the
        # executable lives inside it, next to the license files.
        echo "bifrost_bin=${dir}/${stage}/${bin}" >> "${GITHUB_OUTPUT}"

    - name: Resolve analyzer cache identity
      id: analyzer-cache-identity
      if: inputs.cache == 'true'
      shell: bash
      env:
        BIFROST_BIN: ${{ steps.install.outputs.bifrost_bin }}
        WORKDIR: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        identity=$("${BIFROST_BIN}" --build-identity)
        if [[ ! "${identity}" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::Bifrost returned an invalid build identity: ${identity}"
          exit 1
        fi
        echo "value=${identity}" >> "${GITHUB_OUTPUT}"
        if command -v sha256sum >/dev/null 2>&1; then
          workspace_key=$(printf '%s' "${WORKDIR}" | sha256sum | cut -d ' ' -f 1)
        else
          workspace_key=$(printf '%s' "${WORKDIR}" | shasum -a 256 | cut -d ' ' -f 1)
        fi
        echo "workspace-key=${workspace_key}" >> "${GITHUB_OUTPUT}"
        # The cached path participates in GitHub's cache version: keep it
        # workspace-relative and stable across invocations and runner locations.
        # Scope this action-owned root by the build and selected workspace.
        cache_path=".bifrost/cache/policy-action/${identity}/${workspace_key}"
        mkdir -p "${GITHUB_WORKSPACE}/${cache_path}"
        echo "cache-path=${cache_path}" >> "${GITHUB_OUTPUT}"
        echo "cache-root=${GITHUB_WORKSPACE}/${cache_path}" >> "${GITHUB_OUTPUT}"

    - name: Restore analyzer cache
      id: analyzer-cache
      if: inputs.cache == 'true'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ steps.analyzer-cache-identity.outputs.cache-path }}
        key: bifrost-policy-cache-${{ runner.os }}-${{ runner.arch }}-${{ inputs.version }}-${{ steps.analyzer-cache-identity.outputs.value }}-${{ steps.analyzer-cache-identity.outputs.workspace-key }}

    - name: Run policies
      id: run
      shell: bash
      env:
        WORKDIR: ${{ inputs.working-directory }}
        SARIF_FILE: ${{ inputs.sarif-file }}
        FAIL_ON: ${{ inputs.fail-on }}
        POLICY_PACKS: ${{ inputs.policy-packs }}
        POLICY_IDS: ${{ inputs.policy-ids }}
        POLICY_CATEGORIES: ${{ inputs.policy-categories }}
        POLICY_FILES: ${{ inputs.policy-files }}
        DIFF_BASE: ${{ inputs.diff-base }}
        MANAGED_CACHE: ${{ inputs.cache }}
        MANAGED_CACHE_ROOT: ${{ steps.analyzer-cache-identity.outputs.cache-root }}
        POLICY_TIMINGS: ${{ inputs.policy-timings }}
        BIFROST_BIN: ${{ steps.install.outputs.bifrost_bin }}
      run: |
        set -euo pipefail
        cd "${WORKDIR}"
        if [ "${MANAGED_CACHE:-false}" = true ]; then
          export BIFROST_CACHE_ROOT="${MANAGED_CACHE_ROOT}"
          # Avoid the default repository child hash changing with the runner's
          # absolute checkout path. The action key already scopes this workspace.
          export BIFROST_CACHE_DIR="${MANAGED_CACHE_ROOT}/analyzer"
        fi
        args=(--root . --format sarif --output "${SARIF_FILE}" --fail-on "${FAIL_ON}")
        for p in ${POLICY_PACKS}; do args+=(--policy-pack "${p}"); done
        for p in ${POLICY_IDS}; do args+=(--policy-id "${p}"); done
        for p in ${POLICY_CATEGORIES}; do args+=(--policy-category "${p}"); done
        for p in ${POLICY_FILES}; do args+=(--policy-file "${p}"); done
        if [ -n "${DIFF_BASE}" ]; then args+=(--diff-base "${DIFF_BASE}"); fi
        if [ "${POLICY_TIMINGS:-false}" = true ]; then args+=(--policy-timings); fi
        set +e
        if [ "${POLICY_TIMINGS:-false}" = true ]; then
          # Capture stderr without a pipeline so the analyzer status is exact.
          "${BIFROST_BIN}" "${args[@]}" 2> "${SARIF_FILE}.stderr.log"
          code=$?
          cat "${SARIF_FILE}.stderr.log" >&2
          echo "stderr-file=${WORKDIR}/${SARIF_FILE}.stderr.log" >> "${GITHUB_OUTPUT}"
        else
          "${BIFROST_BIN}" "${args[@]}"
          code=$?
        fi
        set -e
        echo "exit-code=${code}" >> "${GITHUB_OUTPUT}"
        echo "sarif-file=${WORKDIR}/${SARIF_FILE}" >> "${GITHUB_OUTPUT}"
        if [ -f "${SARIF_FILE}" ]; then
          echo "has-sarif=true" >> "${GITHUB_OUTPUT}"
        else
          echo "has-sarif=false" >> "${GITHUB_OUTPUT}"
        fi

    # Save after the analyzer exits, even when its policy gate will fail. Never
    # restore another producer's build identity as a cache fallback.
    - name: Save analyzer cache
      if: always() && inputs.cache == 'true' && steps.analyzer-cache.outputs.cache-hit != 'true' && steps.run.outputs.has-sarif == 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ steps.analyzer-cache-identity.outputs.cache-path }}
        key: ${{ steps.analyzer-cache.outputs.cache-primary-key }}

    - name: Retain SARIF report
      if: always() && inputs.artifact-name != '' && steps.run.outputs.has-sarif == 'true'
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ steps.run.outputs.sarif-file }}
          ${{ steps.run.outputs.stderr-file }}
        if-no-files-found: error

    - name: Summarize policy execution
      if: always() && steps.run.outputs.has-sarif == 'true'
      shell: bash
      env:
        SARIF_PATH: ${{ steps.run.outputs.sarif-file }}
        DIFF_BASE: ${{ inputs.diff-base }}
      run: |
        set -euo pipefail
        echo '::group::Bifrost policy execution evidence'
        # Per-policy work describes the head; aggregate stages can include diff_base.
        # JSON escaping keeps source-controlled diagnostics inert in the log.
        jq --arg diff_base "${DIFF_BASE}" '
          .runs[] | .properties | {
            policy_work_scope: (if $diff_base == "" then "workspace" else "head" end),
            timing_note: "aggregate stages include diff_base when reached; measured stages and actual coverage are in opt-in stderr, successful canonical times may be zero",
            execution: .["bifrost.execution"],
            incremental: .["bifrost.incremental"],
            policy_runs: .["bifrost.policyRuns"],
            report_diagnostics: .["bifrost.reportDiagnostics"],
            diff_baseline: .["bifrost.diffBaseline"]
          }
        ' "${SARIF_PATH}"
        echo '::endgroup::'

    - name: Upload SARIF to code scanning
      if: inputs.upload == 'true' && steps.run.outputs.has-sarif == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        SARIF_PATH: ${{ steps.run.outputs.sarif-file }}
        CATEGORY: ${{ inputs.category }}
      run: |
        set -euo pipefail
        categorized="${RUNNER_TEMP}/bifrost-categorized.sarif"
        jq --arg category "${CATEGORY}" '
          .runs |= map(
            if (.automationDetails // {} | has("id") | not)
            then .automationDetails = ((.automationDetails // {}) + {
              id: (if ($category | endswith("/")) then $category else ($category + "/") end)
            })
            else .
            end
          )
        ' "${SARIF_PATH}" > "${categorized}"
        # The payload can exceed the kernel argv limit, so it travels as a
        # request-body file, never as a command-line argument.
        encoded="${RUNNER_TEMP}/bifrost-sarif.b64"
        gzip -c "${categorized}" | base64 -w0 > "${encoded}"
        body="${RUNNER_TEMP}/bifrost-sarif-body.json"
        jq -n \
          --arg commit_sha "${GITHUB_SHA}" \
          --arg ref "${GITHUB_REF}" \
          --arg checkout_uri "file://${GITHUB_WORKSPACE}" \
          --rawfile sarif "${encoded}" \
          '{commit_sha: $commit_sha, ref: $ref, checkout_uri: $checkout_uri, sarif: $sarif}' \
          > "${body}"
        gh api "repos/${GITHUB_REPOSITORY}/code-scanning/sarifs" --input "${body}"

    - name: Gate on the exit code
      if: always()
      shell: bash
      env:
        CODE: ${{ steps.run.outputs.exit-code }}
        FAIL_ON: ${{ inputs.fail-on }}
        DIFF_BASE: ${{ inputs.diff-base }}
        SARIF_PATH: ${{ steps.run.outputs.sarif-file }}
      run: |
        set -euo pipefail
        if [ ! -f "${SARIF_PATH}" ]; then
          echo "::error::Bifrost policy scan did not emit a SARIF report at ${SARIF_PATH}."
          exit 1
        fi
        if ! command -v jq >/dev/null 2>&1; then
          echo "::error::jq is required to validate and gate the Bifrost SARIF report."
          exit 1
        fi
        if ! jq -e '
          .version == "2.1.0"
          and (.runs | type == "array" and length > 0)
          and all(.runs[];
            type == "object"
            and (.results | type == "array")
            and all(.results[]; type == "object")
            and (.invocations | type == "array" and length > 0)
            and all(.invocations[]; type == "object" and (.executionSuccessful | type == "boolean"))
            and (.properties | type == "object")
          )
        ' "${SARIF_PATH}" >/dev/null; then
          echo "::error::invalid SARIF report at ${SARIF_PATH}; expected a SARIF 2.1.0 object with runs and result arrays."
          exit 1
        fi
        case "${CODE}" in
          0)
            if ! jq -e '
              all(.runs[]; all(.invocations[]; .executionSuccessful == true))
            ' "${SARIF_PATH}" >/dev/null; then
              echo "::error::Bifrost returned clean status 0 but the SARIF report contains an unsuccessful invocation."
              exit 1
            fi
            echo "Bifrost policy scan is clean."
            ;;
          1)
            echo "::group::Bifrost policy gate causes"
            if ! causes=$(jq -r --arg fail_on "${FAIL_ON}" '
              def severity:
                if . == "error" then 3
                elif . == "warning" then 2
                elif . == "note" then 1
                else 0
                end;
              def gates:
                if $fail_on == "never" then false
                elif $fail_on == "finding" then true
                elif $fail_on == "error" then (.level | severity) >= 3
                elif $fail_on == "warning" then (.level | severity) >= 2
                elif $fail_on == "note" then (.level | severity) >= 1
                else true
                end;
              def finding_causes:
                .runs[].results[]
                | select((.properties["bifrost.diffDisposition"] // .baselineState // "new") == "new")
                | select(((.suppressions // []) | map(select(.status != "accepted")) | length) > 0 or ((.suppressions // []) | length) == 0)
                | select(gates)
                | (.ruleId // .rule?.id // "unknown-rule") as $rule
                | (.locations[0].physicalLocation // {}) as $location
                | ($location.artifactLocation.uri // "<unknown-path>") as $path
                | ($location.region.startLine // "?") as $line
                | (.message.text // "<no-message>") as $message
                | (.properties["bifrost.findingId"] // .partialFingerprints["bifrostFinding/v1"] // "") as $finding_id
                | if $finding_id == ""
                  then "finding: \($rule) \($path):\($line) \($message)"
                  else "finding: \($rule) \($path):\($line) \($message) [finding: \($finding_id)]"
                  end;
              def suppression_causes:
                .runs[].properties["bifrost.suppressionReviews"][]?
                | select(.orphan_state == "orphaned")
                | "orphaned suppression: \(.policy_id) [finding: \(.finding_id)]"
                  + if ((.rekey_candidates // []) | length) == 0 then ""
                    else " [re-key candidates: \(.rekey_candidates | join(", "))]"
                    end;
              [finding_causes, suppression_causes] | unique[]
            ' "${SARIF_PATH}"); then
              echo "::endgroup::"
              echo "::error::unable to extract policy gate causes from ${SARIF_PATH}."
              exit 1
            fi
            if [ -n "${causes}" ]; then
              printf '%s\n' "${causes}"
            else
              echo "::warning::exit 1 was reported, but no gating finding or orphaned suppression was retained in ${SARIF_PATH}"
            fi
            echo "::endgroup::"
            echo "::error::Bifrost policy scan reported a policy gate failure. See the gate causes above and the SARIF report."
            exit 1
            ;;
          2)
            echo "::group::Bifrost policy report diagnostics"
            if diagnostics=$(jq -r '
              (.runs[].invocations[]?.toolExecutionNotifications[]?
              | if .properties["bifrost.reportDiagnostic"] != null then
                  .properties["bifrost.reportDiagnostic"] as $diagnostic
                  | "\($diagnostic.code // .descriptor.id // "unknown"): \(.message.text // "<no-message>")"
                elif .properties["bifrost.completion"] != null then
                  .properties["bifrost.completion"] as $completion
                  | "\(.descriptor.id // "unknown"): \(.message.text // "<no-message>")"
                    + " [policy: \(.properties["bifrost.policyId"] // "unknown"); completion: \($completion | tojson)]"
                else empty
                end),
              (.runs[].properties["bifrost.policyRuns"][]?
                | select(.completion.type != "complete" or ((.diagnostics // []) | length) > 0)
                | "policy: " + tojson)
            ' "${SARIF_PATH}"); then
              if [ -n "${diagnostics}" ]; then
                printf '%s\n' "${diagnostics}"
              else
                echo "No report or policy diagnostics were emitted in ${SARIF_PATH}."
              fi
            else
              echo "::endgroup::"
              echo "::error::unable to extract report diagnostics from ${SARIF_PATH}."
              exit 1
            fi
            echo "::error::Bifrost policy scan is UNRELIABLE. The run could not prove its own completeness. Read the report and policy diagnostics. Do not treat this result as clean."
            echo "::endgroup::"
            exit 2
            ;;
          *)
            echo "::error::bifrost exited with unexpected status ${CODE}."
            exit 1
            ;;
        esac
