# Nextest profile for the local validation gate (#1454).
#
# The motivating incident: the 2026-08-02 pre-push gate hung 90 minutes on a
# rayon self-deadlock inside one test, with no signal beyond libtest's "has
# been running for over 60 seconds" line buried in a log. Nextest's slow-timeout
# both surfaces the test's name while it is slow and kills it at the terminate
# threshold, turning a silent multi-hour hang into a named failure in minutes.
#
# period x terminate-after = the kill threshold (60s x 10 = 10 minutes). The
# ordinary tests finish in a couple of minutes even on a loaded box. Scoped
# nightly stress exceptions below keep their own measured hang thresholds.

[profile.default]
slow-timeout = { period = "60s", terminate-after = 10 }

# Persist per-test failure output to target/nextest/default/junit.xml.
#
# The motivating incident (#1891): during a multi-agent validation campaign,
# the whole bifrost_benchmark_run suite failed wholesale in under a second per
# test - faster than its fastest possible pass, so a setup or spawn failure,
# not an assertion - while the box was under severe memory pressure. Both
# observers piped nextest through filters that dropped the failure-detail
# blocks, so the panic text was lost and the mechanism could not be proven.
# The JUnit file records each failure's output regardless of how stdout is
# filtered, so the next transient environmental failure arrives with its
# evidence attached.
[profile.default.junit]
path = "junit.xml"

# #13066's operator-only whole-corpus calibration includes cold setup taking
# 1.8-2.3 hours on the loaded measurement host. The coordinator allows six
# hours for setup; ordinary tests and measured-request budgets are unchanged.
[[profile.default.overrides]]
filter = 'test(private_bifrost_corpus_projection_and_publication_cost)'
threads-required = "num-cpus"
slow-timeout = { period = "60s", terminate-after = 360 }

# #9737: the 96-case Rust warm/cold edit-and-process-restart proof passed in
# 2788 seconds (46m28s) at nice 10 on a4ceb1347997. Allow 70 minutes, about
# 50 percent above that full-run duration, for this one ignored nightly test.
# All other tests retain the profile's ten-minute hang detector.
[[profile.default.overrides]]
filter = 'test(rust_derivation_properties::update_state_machine::rust_derivation_properties)'
slow-timeout = { period = "60s", terminate-after = 70 }

# #7362 activates a whole real JDK in the existing scheduled JDK step.
# Its scoped rayon pool uses every CPU handed to this reservation.
# #8000's on-demand import test activates the JDK once per point, about a
# minute each on one thread, and spreads its points over the same CPUs.
# #8222's Scala implicit-root test does the same for its six workspaces.
[[profile.default.overrides]]
filter = 'test(java_indexed_jdk_closes_unacquired_default_provider_boundary) | test(java_indexed_jdk_on_demand_import_candidates) | test(java_indexed_jdk_scala_implicit_root_navigation)'
threads-required = "num-cpus"

# Start the real-process repository corpus checks before the short unit tests
# so their analyzer/server setup overlaps the rest of the run instead of
# becoming a serial tail. They still reserve only the default single slot.
[[profile.default.overrides]]
filter = 'test(/^lsp_repository_corpus::/) | test(/^mcp_repository_corpus::/) | test(/^bifrost_benchmark_run::/) | test(/^scratch_cache_isolation::/)'
priority = 100

# temp_storage_scripts asserts live-PID / open-directory / age semantics of
# real spawned processes. Under whole-box saturation its holder process can be
# starved and its "young" fixtures age past thresholds (observed once at load
# ~80: a 38s run of a normally 4s test). Reserve the box for these few tests.
[[profile.default.overrides]]
filter = 'test(temp_storage_scripts)'
threads-required = "num-cpus"

# This process-isolated watchdog builds a large JS/TS usage graph inside a
# four-thread rayon pool and has its own wall-clock deadlock watchdog. It
# completes in about 20-35 seconds alone, but whole-suite CPU saturation inside
# this invocation, or concurrent nextest invocations this reservation cannot
# coordinate with, can starve the worker thread long enough to mimic the
# deadlock it detects (#2777).
[[profile.default.overrides]]
filter = 'test(jsts_usage_graph_receiver_analysis_does_not_deadlock_on_pool)'
threads-required = "num-cpus"

# Initial workspace construction is tested under a held build lock in the
# MCP deadline golden, without a machine-relative latency assertion. Functional
# clients retry the typed workspace_not_ready result before checking payloads.

# Assertions that are intrinsically about machine-relative timing, each over its
# own temporary root, so cache contention is not available as an explanation and
# the only way any of them misses its bound is CPU starvation.
#
# persisted_open_populates_a_cache_the_reopen_hydrates_from asserts a first
# persisted open under five seconds: 1.5s scoped, panicked at 7.9s in the
# saturated 2026-08-29 run.
#
# light_lookup_overtakes_long_usage_scan asserts that a light request overtakes
# an in-flight heavy scan. It is an ordering assertion rather than a duration
# threshold, but the ordering it observes is produced by the scheduler, and on
# an oversubscribed box the observation says nothing about the scheduler.
#
# The Go typestate CLI latency guard (#14735, now
# cli_reruns_reuse_stored_work_and_one_file_edit_rederives_only_its_units) and
# c_wide_translation_unit_indexes_in_linear_time (#14738) left this list: the
# first asserts the work each CLI run does, the second a same-run CPU-time
# ratio, so neither depends on host load. Prefer that shape to a reservation.
# deeply_nested_javascript_extraction_is_linear followed (#14777) on the shared
# CPU-ratio guard in tests/common/cpu_scaling.rs.
#
# The rest are absolute or relative wall-clock bounds found by sweeping the
# suites for elapsed-time assertions, reserved as a class rather than one at a
# time: patching only the test that happened to fail meant each ~70-minute run
# could discover exactly one more, which never converges. Hang detectors with
# very large margins are deliberately NOT here -- load cannot plausibly flip
# them, and reserving the machine for them would cost more than it protects.
#
# large_rust_file_definition_stays_interactive      5s interactive bound.
# exact_go_source_set_produces_and_compiles_api_pack   two 5s lookup bounds.
# explicit_file_fifo_is_rejected_without_blocking and
# directory_entries_reject_fifo_replacement_without_blocking   1s, each racing a
#     peer thread that sleeps 2s; scheduler starvation can spuriously delay the
#     non-blocking open these discriminate on.
[[profile.default.overrides]]
filter = 'test(persisted_open_populates_a_cache_the_reopen_hydrates_from) | test(light_lookup_overtakes_long_usage_scan) | test(large_rust_file_definition_stays_interactive) | test(exact_go_source_set_produces_and_compiles_api_pack) | test(explicit_file_fifo_is_rejected_without_blocking) | test(directory_entries_reject_fifo_replacement_without_blocking)'
threads-required = "num-cpus"

# activation_pins_the_release_coverage_it_bootstraps_with (#14097) synchronously
# assembles three workspaces, and each constructor runs the ordinary
# semantic-pack activation eagerly. A focused run takes about 3.5 s, but in a
# full brokk-bifrost-mcp run on a 32-CPU host at load ~47 it was killed by the
# profile-wide 600 s terminate-after while every other failure in that run was
# load-bound. The test now reads the coverage those constructors already pinned
# instead of activating each workspace a second time. Reserve the box so the
# suite's own concurrency cannot starve the remaining three activations; the
# 600 s terminate-after stays the hang detector.
[[profile.default.overrides]]
filter = 'test(activation_pins_the_release_coverage_it_bootstraps_with)'
threads-required = "num-cpus"

# issue_3006_release_zero_config runs only under `--cfg scheduled_tests` (the
# hourly os-matrix legs and ad hoc --run-ignored runs): a real `bifrost scan`
# that produces the zero-configuration JDK pack from a real JDK's jmods on every
# core this reservation hands it (issue #5241), inside a fresh ScratchCacheDir
# so no earlier test's catalog can warm it. It is the heaviest single test in
# the suite, and the rest of nextest saturates the shared hourly runner around
# it: same code on the same aarch64 runner class passed in 178.5 s and 131.8 s,
# then took 564.4 s on the last green hourly (94% of the 600 s kill threshold)
# and TIMEOUT at >600 s in run 35017405309 (issue #3401). A 4.5x load-driven
# spread on identical code is CPU starvation, not a hang; reserve the box so
# the profile-wide terminate-after = 10 stays a hang detector instead of a
# load gauge. The reservation costs nothing per push: without scheduled_tests
# the test is ignored and never runs.
[[profile.default.overrides]]
filter = 'test(issue_3006_release_zero_config)'
threads-required = "num-cpus"

# semantic_ir_rows_round_trip_every_workspace_crate_source runs only under
# `--cfg scheduled_tests`: it runs the parse-time producer (lowering and
# partial flows) over every Rust file under crates/ (about 2,540, one just
# over 4 MB) on every available CPU, largest file first, then stores and
# decodes the rows and flows. The Rust lowerer alone takes 270 s to 530 s on
# each of the three largest files in a debug build on a loaded host
# (2026-10-08), so the test cannot meet the 600 s threshold. Partial flows
# (#8617) cost 1.39x the CPU seconds of lowering and rows alone (13,735 s
# against 9,858 s on one 32-CPU host, 2026-11-01, #8739). Release gate legs
# took up to 1,164 s on macOS before that, so about 1,650 s then. #11491
# (2026-11-11) stopped six lowering panics that had abandoned the heaviest
# files, and the macOS leg then took 2,190 s (gate run 43056152488).
#
# #14280 (2026-11-18): the macOS round trip now passes in 2,223-2,978 s and
# timed out at 3,000 s on both sides of #13873, so the kill sat inside the
# runner's passing distribution. The same test under --profile measure is
# 583.7 s wall with 2,334 CPU-s (#13873); locally it is 629.4 s at base
# 6d92aac and 657.1 s at the final merged head, while a run three merges
# earlier (9afe8f7, 2,542 files) took 431.2 s. Local wall variance alone is
# therefore about +-25%, the same order as the macOS gate's 2,223-2,978 s
# spread, so the limit is calibrated to the distribution rather than one
# run. A gate-profile run is 2,822.4 s at 6d92aac and 2,260.3 s at the
# final merged head, 3.4-4.5x the measure wall (opt-level 0, debug
# assertions and overflow checks, which also leaves bundled SQLite at
# -O0); its wall is the largest file's round trip, not throughput, and
# the largest file alone is 1,992.0 s at the final head. #5263 owns that
# product
# cold-construction cost. The corpus under crates/ grew from 106.4 MB to
# 137.9 MB between 2026-11-01 and 2026-11-18, about 12% a week, so 70
# minutes is a measured stopgap that buys about three weeks at that rate;
# the next recurrence needs the #5263 product fix or an owner decision, not
# another raise. It covers the slowest pass and the 2026-11-18 slow-day
# extrapolation (2,978 s x 1.146), not an open-ended budget. The
# round-trip shard's job timeout is 90 minutes in
# ci-os-matrix.yml so the named TIMEOUT, junit record and hang diagnostics
# survive a kill. Set this limit from a measured multi-threaded run, as
# `.agents/docs/testing-and-rust-validation.md` requires; do not sample the
# corpus or weaken the assertions.
[[profile.default.overrides]]
filter = 'test(semantic_ir_rows_round_trip_every_workspace_crate_source)'
threads-required = "num-cpus"
slow-timeout = { period = "60s", terminate-after = 70 }

# rust_call_targets_are_independent_of_file_batch (#9755) resolves every Rust
# call site in every golden fixture twice, once in its file's batch and once
# alone, on every available CPU. It takes about 950 CPU seconds: 170 s and 267 s
# of wall time on a 96-CPU host at load 130 to 150 (2026-11-05), so about two
# minutes on the 16-CPU push runner and up to six minutes on a 4-CPU gate
# runner. 15 minutes keeps it a hang detector on the small runners.
[[profile.default.overrides]]
filter = 'test(rust_call_targets_are_independent_of_file_batch)'
threads-required = "num-cpus"
slow-timeout = { period = "60s", terminate-after = 15 }

# output_budget_stop::transient_residency_boundary_scan (#11704) evaluates one
# cold and two warm policy runs for each of 66 row limits at the #10893
# admission edge. Serial, it took 470-520 s on the push and merge hosts and
# 512 s alone on a 32-CPU container, against the profile-wide 600 s kill, and
# timed out under full policy-integration load. The rows are independent, so
# the test spreads them over the CPUs this reservation hands it: measured 59 s
# on 32 CPUs and 268 s with two CPUs. Fifteen minutes keeps this a hang
# detector on the smallest runner.
[[profile.default.overrides]]
filter = 'test(transient_residency_boundary_scan)'
threads-required = "num-cpus"
slow-timeout = { period = "60s", terminate-after = 15 }

# flow_evidence_contracts::golden_policy_flow_evidence (#12773) renders 54
# independent policy-flow fixture cases through the CLI and, in the
# rust-primitive-universe case, 19 independent edits of one fixture. Serial,
# the family took about 525 s alone and timed out at the 600 s profile-wide
# kill under full policy-integration load. The cases, and the edits inside
# rust-primitive-universe, copy their own fixture roots and use independent
# processes, so both levels spread their work over the CPUs this reservation
# hands the test: measured 55 s on 32 CPUs at host load 9 to 21, down from
# 386 s in the rust-primitive-universe case alone. Fifteen minutes keeps this
# a hang detector on the smallest runner.
[[profile.default.overrides]]
filter = 'test(flow_evidence_contracts::golden_policy_flow_evidence)'
threads-required = "num-cpus"
slow-timeout = { period = "60s", terminate-after = 15 }

# protocol_summary_relations::oversized_exit_projection_preserves_source_results_without_publishing_a_prefix
# (#12839) intentionally produces 65,792 exit summaries (257 bindings x 256
# states) and solves the same oversized projection twice: once from an empty
# repository, then again from the same repository to prove the first run
# published no prefix. The solver and projection are single-threaded, so this
# test cannot spread its work over the CPUs a reservation would hand it.
# Measured on 2026-11-14: alone on a 32-CPU container, 249.3 s (setup 2.4 s,
# first solve 125.3 s, assertions 12 ms, second solve 121.6 s); in the whole
# suite_semantic binary on that container, 387.205 s (1.55x); alone on the
# merge host, 582.763 s, only 17.2 s under the profile-wide 600 s kill, and a
# full suite_semantic run there timed out at 600.056 s. At the container's
# loaded ratio, the merge host's loaded duration is about 900 s. Twenty
# minutes gives that estimate 33% headroom and keeps this a hang detector
# without moving the global threshold. The current CI x86 runner takes about
# 175 s.
[[profile.default.overrides]]
filter = 'test(oversized_exit_projection_preserves_source_results_without_publishing_a_prefix)'
slow-timeout = { period = "60s", terminate-after = 20 }

[[profile.default.overrides]]
filter = 'test(native_java_kotlin_csharp_all_fixture_rows_and_partial_flows_round_trip)'
threads-required = "num-cpus"
slow-timeout = { period = "60s", terminate-after = 30 }

# workspace_authority_memos_are_classified (#10951) is a syn census of the
# workspace: check_capability_ownership parses every crate twice, and the
# recorder and field censuses walk the 25 in-scope crates again, about 390 MiB
# of source in total. Serial, it took 190 s on the 16-CPU push runner, 272 s
# alone on the 2-CPU merge host, and 461 s on a loaded 32-CPU host (load 60 to
# 202) against the profile-wide 600 s kill; in a broad 4462-test push-tests run
# a second copy ran beside it and starved it past 600 s.
#
# The test now spreads each per-crate walk over every CPU: measured 101 s on 32
# CPUs, 174 s on 2 CPUs, and 290 s for each of two concurrent copies sharing 2
# CPUs. Reserve the machine so the rest of the suite cannot compete with those
# workers inside one nextest process. A reservation cannot coordinate separate
# nextest processes; 15 minutes keeps this a hang detector when merge runs
# overlap.
[[profile.default.overrides]]
filter = 'test(workspace_authority_memos_are_classified)'
threads-required = "num-cpus"
slow-timeout = { period = "60s", terminate-after = 15 }

# The partial-flow differentials walk a corpus file by file and, per procedure,
# project the workspace relations, build an ICFG and solve value flow. The
# per-file work is independent, and each test's walk spreads it over one worker
# per available CPU, so reserve the box as the semantic-IR round trip does
# rather than letting the walk's own parallelism compete with the rest of the
# suite.
#
# The two `*_over_crates` variants are ignored until #5263 lowers the cold
# `crates/` workspace construction they need (about 1,500 Rust files, 81 MiB),
# so today this override covers the fixture and external-root variants. The
# limit below is not sized for the ignored pair: their walk is parallel now, and
# what still outlives the profile-wide ceiling at #4869 is the cold construction
# that #5263 owns, which no test limit can budget.
#
# The fixture variant now outlives the profile-wide 10-minute limit on the
# release gate's isolated shard (aarch64 Linux and macOS, gate run 43752314774):
# it was terminated at 600 s while the host variant needed over 300 s. #12167
# owns bringing its cost back down; until then the isolated shard, which runs
# about ten tests inside its 60-minute job, has room for a 20-minute limit.
#
# The promoted cb7afec1 batch measured the fixture walk alone at 1,227 s
# (333 s workspace build plus about 894 s over 1,225 files) after newly
# analyzable Rust macro, closure and pointer-oracle fixtures joined the slow
# list. Two nextest runs were killed at the 1,200 s limit; the direct walk
# finished with no conclusive differences. Give that one walk 25 minutes.
# The host walk stays at 20 and the isolated shard still fits its 60 minutes.
[[profile.default.overrides]]
filter = 'test(=partial_flow_differential::algorithm_differential_over_fixtures)'
threads-required = "num-cpus"
slow-timeout = { period = "60s", terminate-after = 25 }

[[profile.default.overrides]]
filter = 'test(/^partial_flow_differential::/)'
threads-required = "num-cpus"
slow-timeout = { period = "60s", terminate-after = 20 }

# The opt-in pinned Vector census uses the container's available runtime workers.
# It preserves the complete archive and all member/dependency/export assertions.
[[profile.default.overrides]]
filter = 'test(vector_archive_rust_summary_differential_census)'
threads-required = "num-cpus"

# The manual Go discovery corpus differential partitions real source files over
# all available CPUs, like the existing Go corpus profile tier.
[[profile.default.overrides]]
filter = 'test(shared_closer_differential_go_discovery_corpus)'
threads-required = "num-cpus"

# Both manual tests use BIFROST_J0_KOTLIN_CORPUS. Work replay edits
# FileSpec.kt in place, so readers must share its exclusive corpus slot.
[test-groups.kotlinpoet-corpus]
max-threads = 1

[[profile.default.overrides]]
filter = 'test(shared_jvm_kotlinpoet_source_golden) | test(shared_closer_private_kotlinpoet_work)'
test-group = "kotlinpoet-corpus"
