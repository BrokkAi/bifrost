# Nextest profile for the local validation gate (#1454).
#
# The motivating incident: the 2026-08-02 pre-push gate hung 90 minutes on a
# rayon self-deadlock inside one test, with no signal beyond libtest's "has
# been running for over 60 seconds" line buried in a log. Nextest's slow-timeout
# both surfaces the test's name while it is slow and kills it at the terminate
# threshold, turning a silent multi-hour hang into a named failure in minutes.
#
# period x terminate-after = the kill threshold (60s x 10 = 10 minutes). The
# heaviest legitimate single tests in this workspace finish in a couple of
# minutes even on a loaded box; nothing real should survive to 10.

[profile.default]
slow-timeout = { period = "60s", terminate-after = 10 }

# Persist per-test failure output to target/nextest/default/junit.xml.
#
# The motivating incident (#1891): during a multi-agent validation campaign,
# the whole bifrost_benchmark_run suite failed wholesale in under a second per
# test - faster than its fastest possible pass, so a setup or spawn failure,
# not an assertion - while the box was under severe memory pressure. Both
# observers piped nextest through filters that dropped the failure-detail
# blocks, so the panic text was lost and the mechanism could not be proven.
# The JUnit file records each failure's output regardless of how stdout is
# filtered, so the next transient environmental failure arrives with its
# evidence attached.
[profile.default.junit]
path = "junit.xml"

# Start the real-process repository corpus checks before the short unit tests
# so their analyzer/server setup overlaps the rest of the run instead of
# becoming a serial tail. They still reserve only the default single slot.
[[profile.default.overrides]]
filter = 'test(/^lsp_repository_corpus::/) | test(/^mcp_repository_corpus::/) | test(/^bifrost_benchmark_run::/) | test(/^scratch_cache_isolation::/)'
priority = 100

# temp_storage_scripts asserts live-PID / open-directory / age semantics of
# real spawned processes. Under whole-box saturation its holder process can be
# starved and its "young" fixtures age past thresholds (observed once at load
# ~80: a 38s run of a normally 4s test). Reserve the box for these few tests.
[[profile.default.overrides]]
filter = 'test(temp_storage_scripts)'
threads-required = "num-cpus"

# This process-isolated watchdog builds a large JS/TS usage graph inside a
# four-thread rayon pool and enforces its own 60-second deadlock timeout. It
# completes well within that boundary alone, but whole-suite CPU saturation can
# starve the worker thread long enough to mimic the deadlock it detects.
[[profile.default.overrides]]
filter = 'test(jsts_usage_graph_receiver_analysis_does_not_deadlock_on_pool)'
threads-required = "num-cpus"
