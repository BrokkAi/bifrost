schema_version: 1
pack_id: acme.builders
version: "1.0.0"
producer:
  name: policy-author
  version: "1.0.0"
language: java
ecosystem: maven
compatibility:
  bifrost: ">=0.8.0, <1.0.0"
provenance:
  source: "https://docs.example/acme-builders"
license: MIT
completeness: partial
safety:
  generated_code_only: true
  review_required: true
shards:
  - id: generators.builders
    activation:
      - package:
          name: com.acme:builders
          version: ">=1.0.0, <2.0.0"
    payload:
      kind: generator_rules
      rules:
        - id: rule.builder
          trigger:
            kind: annotation
            name: com.acme.GenerateBuilder
          captures:
            - name: entity
              value_kind: identifier
              cardinality: one
            - name: entity_type
              value_kind: type
              cardinality: one
          emissions:
            - kind: declaration
              id:
                op: transform
                transform: snake_case
                value:
                  op: capture
                  name: entity
              name:
                op: transform
                transform: pascal_case
                value:
                  op: capture
                  name: entity
              declaration_kind: type
              type:
                kind: capture
                name: entity_type
